<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HỆ THỐNG SÁT HẠCH NGHỀ KHOA MÁY THI CÔNG - CAEE</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            --caee-blue: #003399; --header-blue: #0040cc;
            --btn-orange: #ff6600; --btn-blue: #3366ff;
            --success: #28a745; --danger: #dc3545;
            --light-bg: #f0f2f5;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--light-bg); font-family: 'Segoe UI', Arial, sans-serif; overflow: hidden; height: 100vh; }

        /* HEADER & TIMER */
        .caee-header {
            background: var(--header-blue); color: white; height: 60px;
            display: none; flex-direction: column; justify-content: center; align-items: center;
            position: fixed; top: 0; width: 100%; z-index: 1000; transition: opacity 0.5s ease;
        }
        .timer-transparent { 
            position: fixed; top: 10px; left: 10px; background: rgba(255, 0, 0, 0.6); 
            color: white; padding: 5px 15px; border-radius: 20px; font-weight: bold; 
            font-family: monospace; z-index: 1001; border: 1px solid rgba(255,255,255,0.3);
            display: none;
        }

        /* KHU VỰC THI (CENTERED) */
        #quiz-screen { display: none; padding-top: 20px; height: 100vh; }
        .quiz-container {
            background: white; width: 95%; max-width: 800px; margin: 20px auto;
            border-radius: 15px; padding: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            height: calc(100vh - 120px); overflow-y: auto;
        }
        .q-title { font-size: 1.2rem; color: #333; margin-bottom: 20px; font-weight: 700; }
        
        .option-item {
            border: 1px solid #ddd; border-radius: 8px; padding: 15px; margin-bottom: 10px;
            cursor: pointer; transition: 0.2s; background: #fff; display: flex; align-items: center;
        }
        .option-item.selected { border: 2px solid var(--btn-blue); background: #f0f7ff; }

        /* FOOTER NAVIGATION */
        .quiz-footer {
            position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
            width: 95%; max-width: 800px; display: none; gap: 10px; z-index: 1001;
        }
        .nav-btn {
            flex: 1; height: 50px; border-radius: 12px; border: none; color: white;
            font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.3s;
        }
        .btn-prev-next { background: var(--btn-blue); }
        .btn-submit-main { background: var(--caee-blue); flex: 1.5; box-shadow: 0 4px 15px rgba(0,51,153,0.3); }

        /* MÀN HÌNH CHÀO */
        #start-screen { height: 100vh; display: flex; justify-content: center; align-items: center; background: #f0f2f5; }
        .welcome-card { background: white; padding: 30px; border-radius: 20px; width: 90%; max-width: 450px; text-align: center; }
        .form-control { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; }

        #warning-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); color: white; z-index: 9999; justify-content: center; align-items: center; text-align: center; }
    </style>
</head>
<body oncontextmenu="return false">

    <div id="warning-overlay">⚠️ KHÔNG ĐƯỢC THOÁT TRÌNH DUYỆT!</div>
    <div id="timer" class="timer-transparent">20:00</div>

    <div class="caee-header" id="caee-header">
        <div style="font-size: 0.8rem; font-weight: bold;">TRƯỜNG CAO ĐẲNG CƠ ĐIỆN NÔNG NGHIỆP VÀ MÔI TRƯỜNG</div>
        <div id="header-sub" style="font-size: 0.7rem; color: #ffd700;">NGHỀ: VẬN HÀNH XE NÂNG HÀNG</div>
        <div id="header-user" style="font-size: 0.7rem;">HỌC VIÊN: ---</div>
    </div>

    <div id="start-screen">
        <div class="welcome-card">
            <h2 style="color:var(--caee-blue); margin-bottom: 20px;">HỆ THỐNG SÁT HẠCH</h2>
            <select id="jobType" class="form-control" onchange="preloadQuestions()">
                <option value="1538604642">VẬN HÀNH XE NÂNG HÀNG</option>
                <option value="798209567">VẬN HÀNH CẦN TRỤC</option>
                <option value="1969781180">VẬN HÀNH CẦU TRỤC</option>
            </select>
            <input type="text" id="studentName" placeholder="HỌ VÀ TÊN" class="form-control" style="text-transform: uppercase;">
            <input type="text" id="studentDOB" placeholder="NGÀY SINH (DD/MM/YYYY)" class="form-control">
            <input type="password" id="maThi" placeholder="MÃ THI" class="form-control">
            <button class="nav-btn btn-submit-main" style="width: 100%; margin-top: 15px;" onclick="validateAndStart()">VÀO THI</button>
        </div>
    </div>

    <div id="quiz-screen">
        <div class="quiz-container" id="quiz-content"></div>
    </div>

    <div class="quiz-footer" id="quiz-footer">
        <button class="nav-btn btn-prev-next" onclick="changeQuestion(-1)">QUAY LẠI</button>
        <button class="nav-btn btn-submit-main" onclick="submitQuiz()">NỘP BÀI</button>
        <button class="nav-btn btn-prev-next" onclick="changeQuestion(1)">TIẾP THEO</button>
    </div>

    <script>
        const BASE_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRs5CSEsuNg_OtjJbzTmAxQ__5EyVZFe7axrAa1KW9bTAM6dSRNclBRdz1zKXUOZpmfVvQRwU5RRuiN/pub?output=csv&gid=";
        let allQuestions = [], selectedQuestions = [], studentAnswers = [];
        let currentQuestionIndex = 0, timeLeft = 1200, timerInterval;

        function preloadQuestions() {
            const gid = document.getElementById('jobType').value;
            Papa.parse(BASE_CSV_URL + gid, {
                download: true, header: true, complete: function(results) {
                    allQuestions = results.data.filter(i => i.CauHoi).map(i => ({
                        question: i.CauHoi, options: [i.A, i.B, i.C, i.D].filter(o => o),
                        answer: i.DapAnDung ? i.DapAnDung.trim().toUpperCase() : "",
                        image: i["HINH ANH"] || ""
                    }));
                }
            });
        }

        function validateAndStart() {
            const name = document.getElementById('studentName').value;
            const code = document.getElementById('maThi').value;
            if(!name || !code) return alert("Nhập đủ thông tin!");
            
            // Chuyển giao diện
            document.getElementById('start-screen').style.display = 'none';
            const header = document.getElementById('caee-header');
            header.style.display = 'flex';
            document.getElementById('header-user').innerText = "HỌC VIÊN: " + name.toUpperCase();
            document.getElementById('header-sub').innerText = "NGHỀ: " + document.getElementById('jobType').options[document.getElementById('jobType').selectedIndex].text;
            
            // Xử lý ẩn Header sau 10 giây
            setTimeout(() => {
                header.style.opacity = '0';
                setTimeout(() => header.style.display = 'none', 500);
            }, 10000);

            startQuiz();
        }

        function startQuiz() {
            selectedQuestions = allQuestions.sort(() => 0.5 - Math.random()).slice(0, 30);
            document.getElementById('quiz-screen').style.display = 'block';
            document.getElementById('quiz-footer').style.display = 'flex';
            document.getElementById('timer').style.display = 'block';
            showQuestion(0);
            startTimer();
        }

        function showQuestion(idx) {
            currentQuestionIndex = idx;
            const q = selectedQuestions[idx];
            const stored = studentAnswers.find(a => a.qIndex === idx);
            
            let html = `<div class="q-title">Câu ${idx + 1}: ${q.question}</div>`;
            if(q.image) html += `<center><img src="${q.image}" style="max-width:100%; border-radius:10px; margin-bottom:10px;"></center>`;
            
            q.options.forEach((opt, i) => {
                const isSelected = stored && opt === stored.selected;
                html += `<div class="option-item ${isSelected?'selected':''}" onclick="selectAns(${idx}, '${opt}')">
                            <b style="margin-right:10px">${['A','B','C','D'][i]}.</b> ${opt}
                         </div>`;
            });
            document.getElementById('quiz-content').innerHTML = html;
        }

        function selectAns(qIdx, ans) {
            const i = studentAnswers.findIndex(a => a.qIndex === qIdx);
            if(i > -1) studentAnswers[i].selected = ans;
            else studentAnswers.push({qIndex: qIdx, selected: ans});
            showQuestion(qIdx);
        }

        function changeQuestion(dir) {
            let n = currentQuestionIndex + dir;
            if(n >= 0 && n < 30) showQuestion(n);
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                let m = Math.floor(timeLeft/60), s = timeLeft%60;
                document.getElementById('timer').innerText = `${m}:${s<10?'0':''}${s}`;
                if(timeLeft <= 0) submitQuiz();
            }, 1000);
        }

        function submitQuiz() {
            clearInterval(timerInterval);
            alert("Bài thi đã được gửi hệ thống!");
            location.reload();
        }

        window.onload = preloadQuestions;
    </script>
</body>
</html>
