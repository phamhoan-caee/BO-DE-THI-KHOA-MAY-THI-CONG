<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SÁT HẠCH NGHỀ CAEE - GAMING EDITION</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-green: #39ff14;
            --neon-red: #ff3131;
            --dark-bg: #0a0b10;
            --panel-bg: rgba(20, 25, 35, 0.9);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        body { 
            background: var(--dark-bg); 
            color: white; 
            font-family: 'Roboto', sans-serif; 
            overflow: hidden; 
            height: 100vh;
        }

        /* Hình nền mờ ảo phía sau */
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0,242,255,0.05) 0%, rgba(10,11,16,1) 80%);
            z-index: -1;
        }

        /* HEADER PHONG CÁCH HUD GAME */
        .caee-header {
            background: linear-gradient(to bottom, #161b22, transparent);
            padding: 10px 20px; display: none; justify-content: space-between;
            align-items: center; border-bottom: 1px solid var(--neon-blue);
            position: fixed; top: 0; width: 100%; z-index: 1000;
        }
        .hud-text { font-family: 'Orbitron', sans-serif; text-shadow: 0 0 10px var(--neon-blue); }
        .timer-box { 
            background: rgba(255, 49, 49, 0.2); border: 1px solid var(--neon-red);
            padding: 5px 15px; border-radius: 5px; color: var(--neon-red); font-weight: bold;
            box-shadow: 0 0 10px var(--neon-red);
        }

        /* MÀN HÌNH CHỜ */
        #start-screen { height: 100vh; display: flex; justify-content: center; align-items: center; }
        .welcome-container { 
            background: var(--panel-bg); width: 90%; max-width: 450px; border-radius: 20px; 
            padding: 30px; border: 1px solid var(--neon-blue); box-shadow: 0 0 30px rgba(0,242,255,0.2);
        }
        .form-control { 
            width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #333;
            background: #1a1f26; color: white; outline: none;
        }
        .form-control:focus { border-color: var(--neon-blue); }

        .btn-start { 
            background: linear-gradient(45deg, #00c6ff, #0072ff); color: white; border: none;
            width: 100%; padding: 15px; border-radius: 50px; font-weight: bold; cursor: pointer;
            font-family: 'Orbitron', sans-serif; letter-spacing: 2px; transition: 0.3s;
        }
        .btn-start:hover { transform: scale(1.05); box-shadow: 0 0 20px var(--neon-blue); }

        /* GIAO DIỆN LÀM BÀI CHÍNH */
        #quiz-screen { 
            display: none; height: 100vh; padding-top: 80px; padding-bottom: 100px;
            grid-template-columns: 1fr 300px; gap: 20px; max-width: 1400px; margin: auto;
        }

        #quiz-content { 
            background: var(--panel-bg); padding: 25px; border-radius: 15px; 
            border: 1px solid rgba(255,255,255,0.1); overflow-y: auto;
        }

        .option-item {
            background: rgba(255,255,255,0.05); border: 1px solid #333; border-radius: 10px;
            padding: 18px; margin-bottom: 12px; cursor: pointer; transition: 0.2s;
        }
        .option-item:hover { background: rgba(0,242,255,0.1); border-color: var(--neon-blue); }
        .option-item.selected { 
            background: rgba(0,242,255,0.2); border-color: var(--neon-blue); 
            box-shadow: 0 0 15px var(--neon-blue);
        }

        /* NÚT ĐIỀU HƯỚNG KIỂU GAMEPAD */
        .game-controls {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 90px;
            background: rgba(0,0,0,0.8); display: flex; justify-content: space-between;
            align-items: center; padding: 0 20px; border-top: 1px solid var(--neon-blue);
        }
        .btn-nav-game {
            width: 120px; padding: 12px; border-radius: 10px; border: 2px solid var(--neon-blue);
            background: transparent; color: var(--neon-blue); font-family: 'Orbitron'; font-weight: bold;
        }
        .btn-nav-game:disabled { opacity: 0.3; border-color: #555; color: #555; }

        /* SƠ ĐỒ CÂU HỎI */
        .sidebar-right { background: var(--panel-bg); padding: 20px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); }
        .grid-item {
            height: 40px; display: flex; justify-content: center; align-items: center;
            border-radius: 5px; cursor: pointer; font-family: 'Orbitron'; border: 1px solid #333;
        }
        .grid-item.answered { background: var(--neon-blue); color: #000; box-shadow: 0 0 10px var(--neon-blue); }
        .grid-item.active { border: 2px solid orange; transform: scale(1.1); }

        /* HÌNH ẢNH CÂU HỎI */
        .q-image-box img { max-width: 100%; border-radius: 10px; border: 1px solid var(--neon-blue); }

        @media (max-width: 900px) {
            #quiz-screen { grid-template-columns: 1fr; padding: 70px 10px 100px 10px; }
            .sidebar-right { display: none; } /* Ẩn sidebar trên mobile để thoáng bài thi */
        }
    </style>
</head>
<body oncontextmenu="return false">

    <div class="caee-header" id="caee-header">
        <div>
            <div class="hud-text" id="job-display-header" style="font-size: 14px; color: var(--neon-blue);">LOADING...</div>
            <div style="font-size: 12px; opacity: 0.8;">PILOT: <span id="display-name">---</span></div>
        </div>
        <div id="timer" class="timer-box">20:00</div>
    </div>

    <div id="start-screen">
        <div class="welcome-container">
            <h2 class="hud-text" style="text-align:center; color:var(--neon-blue); margin-bottom: 25px;">MISSION SELECT</h2>
            <select id="jobType" class="form-control" onchange="preloadQuestions()">
                <option value="1538604642">VẬN HÀNH XE NÂNG HÀNG</option>
                <option value="798209567">VẬN HÀNH CẦN TRỤC</option>
                <option value="1969781180">VẬN HÀNH CẦU TRỤC</option>
            </select>
            <input type="text" id="studentName" placeholder="Tên học viên" class="form-control">
            <input type="text" id="studentDOB" placeholder="Ngày/tháng/năm sinh" class="form-control">
            <div style="display: flex; gap: 10px;">
                <input type="text" id="khoaThi" value="T4/2026" class="form-control" style="flex:1" readonly>
                <input type="password" id="maThi" placeholder="Mã thi" class="form-control" style="flex:1">
            </div>
            <div style="display:flex; align-items:center; margin: 15px 0; justify-content: center; gap:10px;">
                <input type="checkbox" id="modeToggle">
                <label for="modeToggle">Chế độ Ôn tập (Training Mode)</label>
            </div>
            <button class="btn-start" id="btnStart" onclick="validateAndStart()">START MISSION</button>
        </div>
    </div>

    <div id="quiz-screen">
        <div id="quiz-content"></div>
        <div class="sidebar-right">
            <h4 class="hud-text" style="margin-bottom:15px; text-align:center; font-size:14px;">RADAR MAP</h4>
            <div id="nav-grid" style="display:grid; grid-template-columns: repeat(5, 1fr); gap:8px;"></div>
            <button id="submitBtn" class="btn-start" style="margin-top:30px; background: var(--neon-red);" onclick="submitQuiz()">FINISH</button>
        </div>
    </div>

    <div class="game-controls" id="game-controls" style="display:none;">
        <button class="btn-nav-game" id="btnPrev" onclick="showQuestion(currentQuestionIndex-1)">◀ PREV</button>
        <div style="text-align:center">
            <div style="font-size:10px; opacity:0.6;">CÂU HỎI</div>
            <div id="q-counter" class="hud-text">01 / 30</div>
        </div>
        <button class="btn-nav-game" id="btnNext" onclick="showQuestion(currentQuestionIndex+1)">NEXT ▶</button>
    </div>

    <script>
        // Copy toàn bộ phần Script cũ của bạn vào đây
        // Chú ý sửa lại hàm showQuestion để tương thích giao diện mới:

        const BASE_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR7h1KNottkL2N-DEBjkUVVlXLblXy25_x1UhqML8WQz3AWeWeXFuvkSQUb4Sxv5eaK5T-VJQEWh4wB/pub?output=csv&gid=";
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyVojY_hSnDSex9ftp8ur9o9w0b21W_U-pT2YMKzKkuP8KVEm44XTvBAPTOnLlJzg3o/exec";
        
        let allQuestions = [], selectedQuestions = [], studentAnswers = [];
        let currentQuestionIndex = 0, timeLeft = 1200, timerInterval, isSubmitted = false, cheatCount = 0;

        window.onload = preloadQuestions;

        function preloadQuestions() {
            const gid = document.getElementById('jobType').value;
            Papa.parse(BASE_CSV_URL + gid, {
                download: true, header: true, skipEmptyLines: true,
                complete: function(results) {
                    allQuestions = results.data.filter(i => i.CauHoi).map(i => ({
                        question: i.CauHoi,
                        options: [i.A, i.B, i.C, i.D].filter(o => o),
                        answer: i.DapAnDung ? i.DapAnDung.trim().toUpperCase() : "",
                        explanation: i.Giaithich || "Tuân thủ quy trình an toàn.",
                        image: i["HINH ANH"] || "" 
                    }));
                }
            });
        }

        async function validateAndStart() {
            // ... (Giữ nguyên hàm validate cũ của bạn)
            startQuiz(); // Chạy thẳng để test giao diện
        }

        function startQuiz() {
            selectedQuestions = allQuestions.sort(() => 0.5 - Math.random()).slice(0, 30);
            document.getElementById('display-name').innerText = document.getElementById('studentName').value.toUpperCase() || "RECRUIT";
            document.getElementById('job-display-header').innerText = document.getElementById('jobType').options[document.getElementById('jobType').selectedIndex].text;
            
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('caee-header').style.display = 'flex';
            document.getElementById('quiz-screen').style.display = 'grid';
            document.getElementById('game-controls').style.display = 'flex';
            
            showQuestion(0);
            startTimer();
        }

        function showQuestion(idx) {
            if(idx < 0 || idx > 29) return;
            currentQuestionIndex = idx;
            const q = selectedQuestions[idx];
            const stored = studentAnswers.find(a => a.qIndex === idx);
            const labels = ['A', 'B', 'C', 'D'];

            document.getElementById('q-counter').innerText = `${idx + 1 < 10 ? '0' : ''}${idx + 1} / 30`;
            document.getElementById('btnPrev').disabled = idx === 0;
            document.getElementById('btnNext').disabled = idx === 29;

            let html = `<h3 style="margin-bottom:20px; line-height:1.5;">${q.question}</h3>`;
            if(q.image) html += `<div class="q-image-box" style="margin-bottom:20px;"><img src="${q.image}"></div>`;

            q.options.forEach((opt, i) => {
                let cls = (stored && opt === stored.selected) ? "selected" : "";
                html += `<div class="option-item ${cls}" onclick="selectAns(${idx}, '${opt.replace(/'/g, "\\'")}')">
                            <span style="color:var(--neon-blue); font-weight:bold; margin-right:10px;">${labels[i]}.</span> ${opt}
                         </div>`;
            });

            document.getElementById('quiz-content').innerHTML = html;
            renderGrid();
        }

        function selectAns(qIdx, ans) {
            const i = studentAnswers.findIndex(a => a.qIndex === qIdx);
            if(i > -1) studentAnswers[i].selected = ans;
            else studentAnswers.push({qIndex: qIdx, selected: ans});
            showQuestion(qIdx);
        }

        function renderGrid() {
            const grid = document.getElementById('nav-grid');
            grid.innerHTML = "";
            selectedQuestions.forEach((_, i) => {
                const hasAns = studentAnswers.some(a => a.qIndex === i);
                const active = i === currentQuestionIndex ? 'active' : '';
                const answered = hasAns ? 'answered' : '';
                grid.innerHTML += `<div onclick="showQuestion(${i})" class="grid-item ${active} ${answered}">${i+1}</div>`;
            });
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                let m = Math.floor(timeLeft/60), s = timeLeft%60;
                document.getElementById('timer').innerText = `${m}:${s<10?'0':''}${s}`;
                if(timeLeft <= 0) submitQuiz(true);
            }, 1000);
        }

        function submitQuiz() {
            alert("Mission Accomplished! Kiểm tra kết quả trong cơ sở dữ liệu.");
            location.reload();
        }
    </script>
</body>
</html>
