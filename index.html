<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HỆ THỐNG SÁT HẠCH NGHỀ KHOA MÁY THI CÔNG - CAEE</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            --caee-blue: #003399; --header-blue: #0040cc;
            --btn-orange: #ff6600; --btn-blue: #3366ff;
            --success: #28a745; --danger: #dc3545;
            --light-bg: #f0f2f5;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background-color: var(--light-bg); font-family: 'Segoe UI', Arial, sans-serif; padding-top: 60px; overflow-x: hidden; }

        /* Cảnh báo gian lận */
        #warning-overlay {
            display: none; position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(220, 53, 69, 0.95); color: white; z-index: 9999;
            justify-content: center; align-items: center; text-align: center; font-size: 1.5rem; padding: 20px;
        }

        .caee-header {
            background: var(--header-blue); color: white; padding: 10px;
            display: none; justify-content: space-between; align-items: center;
            position: fixed; top: 0; width: 100%; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .timer-box { background: #ff3333; padding: 5px 15px; border-radius: 4px; font-weight: bold; min-width: 70px; text-align: center; }

        /* Màn hình đăng nhập */
        #start-screen { min-height: 90vh; display: flex; justify-content: center; align-items: center; padding: 15px; }
        .welcome-container { background: white; width: 100%; max-width: 450px; border-radius: 20px; padding: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
        .form-control { width: 100%; padding: 14px; margin: 8px 0; border: 1.5px solid #ddd; border-radius: 10px; font-size: 1rem; transition: 0.3s; }
        .form-control:focus { border-color: var(--btn-blue); outline: none; box-shadow: 0 0 8px rgba(51, 102, 255, 0.2); }
        
        .btn-start { 
            background: var(--success); color: white; border: none; width: 100%; padding: 16px; 
            border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.3s;
            font-size: 1.1rem; margin-top: 10px;
        }
        .btn-start:active { transform: scale(0.98); }
        .btn-start:disabled { background: #bbb; cursor: not-allowed; }

        /* Màn hình thi */
        #quiz-screen { padding: 15px; display: none; grid-template-columns: 1fr 300px; gap: 20px; max-width: 1200px; margin: auto; }
        #quiz-content { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        
        .option-item {
            border: 2px solid #eee; border-radius: 10px; padding: 15px; margin-bottom: 10px;
            cursor: pointer; transition: 0.2s; display: flex; align-items: center; font-size: 1rem;
        }
        .option-item.selected { background: #e7f0ff; border-color: var(--btn-blue); color: var(--caee-blue); }
        .option-item.correct { background: #d4edda !important; border-color: #28a745 !important; }
        .option-item.wrong { background: #f8d7da !important; border-color: #dc3545 !important; }

        /* Lưới câu hỏi */
        #nav-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 15px; }
        .nav-item { height: 40px; display: flex; justify-content: center; align-items: center; border-radius: 8px; border: 1px solid #ddd; font-weight: bold; cursor: pointer; }

        /* Màn hình kết quả */
        #result-screen {
            display: none; position: fixed; top:0; left:0; width:100%; height:100%;
            background: linear-gradient(135deg, #003399 0%, #0066ff 100%);
            z-index: 10000; justify-content: center; align-items: center; padding: 20px;
        }
        .result-card {
            background: white; width: 100%; max-width: 450px; border-radius: 25px;
            padding: 30px; text-align: center; animation: zoomIn 0.4s ease;
        }
        @keyframes zoomIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .score-circle {
            width: 100px; height: 100px; border-radius: 50%; border: 6px solid #f0f0f0;
            margin: 20px auto; display: flex; flex-direction: column; justify-content: center;
            font-size: 1.8rem; font-weight: 800; color: var(--caee-blue);
        }

        @media (max-width: 900px) {
            #quiz-screen { grid-template-columns: 1fr; padding-top: 90px; }
            .sidebar-right { order: -1; }
        }
    </style>
</head>
<body oncontextmenu="return false">

    <div id="warning-overlay">⚠️ CẢNH BÁO GIAN LẬN!<br><small>Hệ thống ghi nhận bạn đã rời khỏi màn hình thi.</small></div>

    <div class="caee-header" id="caee-header">
        <div style="flex-grow: 1; text-align: left; padding-left: 10px;">
            <div id="job-display-header" style="font-weight: bold; font-size: 0.8rem; color: #ffd700;">HỆ THỐNG SÁT HẠCH</div>
            <div style="font-size: 0.8rem;">HV: <span id="display-name" style="font-weight: bold;">---</span></div>
        </div>
        <div id="timer" class="timer-box">20:00</div>
    </div>

    <div id="start-screen">
        <div class="welcome-container">
            <h3 style="text-align:center; color:var(--caee-blue); margin-bottom: 20px;">SÁT HẠCH NGHỀ - CAEE</h3>
            
            <label style="font-size: 0.85rem; font-weight: bold; color: #666;">CHỌN NGHỀ SÁT HẠCH:</label>
            <select id="jobType" class="form-control" onchange="preloadQuestions()">
                <option value="1538604642">VẬN HÀNH XE NÂNG HÀNG</option>
                <option value="798209567">VẬN HÀNH CẦN TRỤC</option>
                <option value="1969781180">VẬN HÀNH CẦU TRỤC</option>
            </select>
            
            <input type="text" id="studentName" placeholder="HỌ VÀ TÊN HỌC VIÊN" class="form-control" style="text-transform: uppercase;">
            <input type="text" id="studentDOB" placeholder="NGÀY SINH (VD: 01/01/2000)" class="form-control">

            <div style="display: flex; gap: 10px;">
                <input type="text" id="khoaThi" value="Tháng 04/2026" class="form-control" style="flex: 1.5; background: #f9f9f9;" readonly>
                <input type="password" id="maThi" placeholder="MÃ THI" class="form-control" style="flex: 1; border-color: var(--btn-orange);">
            </div>

            <div style="display:flex; align-items:center; margin: 15px 0; gap:10px; background: #f0f7ff; padding: 10px; border-radius: 10px;">
                <input type="checkbox" id="modeToggle" style="width:20px; height:20px;">
                <label for="modeToggle" style="cursor:pointer; font-weight: bold; color: var(--caee-blue);">Chế độ Ôn tập (Không cần Mã)</label>
            </div>

            <button class="btn-start" id="btnStart" onclick="validateAndStart()">VÀO THI NGAY</button>
        </div>
    </div>

    <div id="quiz-screen">
        <div id="quiz-content"></div>
        <div class="sidebar-right">
            <div style="background:white; padding:15px; border-radius:15px; box-shadow:0 4px 15px rgba(0,0,0,0.05);">
                <h4 style="text-align:center; margin-bottom:10px;">TIẾN ĐỘ BÀI THI</h4>
                <div id="nav-grid"></div>
                <button id="submitBtn" class="btn-start" style="background-color: var(--caee-blue);" onclick="submitQuiz()">NỘP BÀI THI</button>
            </div>
        </div>
    </div>

    <div id="result-screen">
        <div class="result-card">
            <h2 id="res-status-text" style="color: var(--caee-blue);">KẾT QUẢ</h2>
            <div style="margin: 15px 0; font-size: 1rem;">
                <p>Học viên: <b id="res-name">---</b></p>
                <p>Ngày sinh: <b id="res-dob">---</b></p>
            </div>
            <div class="score-circle">
                <span id="res-score">0</span>
                <small style="font-size: 0.7rem; font-weight: normal;">/ 30 CÂU</small>
            </div>
            <div id="res-badge" class="status-badge" style="padding: 10px 30px; border-radius: 50px; color: white; font-weight: bold;">---</div>
            <div style="margin-top: 20px; font-size: 0.85rem; color: #666;">
                Hệ thống sẽ tự động tải lại sau <span id="countdown" style="font-weight: bold; color: red;">10</span> giây.
            </div>
        </div>
    </div>

<script>
    const BASE_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRs5CSEsuNg_OtjJbzTmAxQ__5EyVZFe7axrAa1KW9bTAM6dSRNclBRdz1zKXUOZpmfVvQRwU5RRuiN/pub?output=csv&gid=";
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz4H6Qh-lUtHR0o6OMUEoVZvd8iaeSiS1sNaa7fu2UpjdeuIeT3w1mfcVca-cl0ZQck/exec";
    
    let allQuestions = [], selectedQuestions = [], studentAnswers = [];
    let currentQuestionIndex = 0, timeLeft = 1200, timerInterval, isSubmitted = false, cheatCount = 0;

    window.onload = preloadQuestions;

    function preloadQuestions() {
        const gid = document.getElementById('jobType').value;
        Papa.parse(BASE_CSV_URL + gid, {
            download: true, header: true, skipEmptyLines: true,
            complete: function(results) {
                allQuestions = results.data.filter(i => i.CauHoi).map(i => ({
                    question: i.CauHoi,
                    options: [i.A, i.B, i.C, i.D].filter(o => o),
                    answer: i.DapAnDung ? i.DapAnDung.trim().toUpperCase() : "",
                    explanation: i.Giaithich || "Thực hiện đúng quy trình an toàn.",
                    image: i["HINH ANH"] || "" 
                }));
            }
        });
    }

    // Giám sát gian lận
    window.onblur = () => { 
        if(!isSubmitted && selectedQuestions.length > 0) { 
            cheatCount++; 
            document.getElementById('warning-overlay').style.display = 'flex'; 
            if(cheatCount >= 3) submitQuiz(true); 
        } 
    };
    window.onfocus = () => { document.getElementById('warning-overlay').style.display = 'none'; };

    async function validateAndStart() {
        const name = document.getElementById('studentName').value.trim();
        const dob = document.getElementById('studentDOB').value.trim();
        const maThi = document.getElementById('maThi').value.trim();
        const isPractice = document.getElementById('modeToggle').checked;

        if(!name || !dob) return alert("Vui lòng nhập Họ tên và Ngày sinh!");
        if(!isPractice && !maThi) return alert("Chế độ thi thật yêu cầu Mã thi!");

        const btn = document.getElementById('btnStart');
        btn.disabled = true; btn.innerText = "ĐANG XÁC THỰC...";

        if(isPractice) {
            startQuiz();
        } else {
            try {
                const res = await fetch(`${WEB_APP_URL}?action=checkCode&code=${maThi}`);
                const result = await res.json();
                if(result.isValid) {
                    startQuiz();
                } else {
                    alert(result.message || "Mã thi không hợp lệ hoặc đã sử dụng!");
                    btn.disabled = false; btn.innerText = "VÀO THI NGAY";
                }
            } catch(e) {
                alert("Lỗi kết nối máy chủ!");
                btn.disabled = false; btn.innerText = "VÀO THI NGAY";
            }
        }
    }

    function startQuiz() {
        if(allQuestions.length === 0) return alert("Dữ liệu chưa tải xong, vui lòng đợi 2 giây.");
        
        selectedQuestions = allQuestions.sort(() => 0.5 - Math.random()).slice(0, 30);
        document.getElementById('display-name').innerText = document.getElementById('studentName').value.toUpperCase();
        document.getElementById('job-display-header').innerText = document.getElementById('jobType').options[document.getElementById('jobType').selectedIndex].text;
        
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('caee-header').style.display = 'flex';
        document.getElementById('quiz-screen').style.display = 'grid';
        
        showQuestion(0);
        startTimer();
    }

    function showQuestion(idx) {
        currentQuestionIndex = idx;
        const q = selectedQuestions[idx];
        const stored = studentAnswers.find(a => a.qIndex === idx);
        const isPractice = document.getElementById('modeToggle').checked;
        const labels = ['A', 'B', 'C', 'D'];

        let html = `<h3 style="margin-bottom:15px; color:var(--caee-blue);">Câu ${idx + 1}: ${q.question}</h3>`;
        if(q.image) html += `<div style="text-align:center; margin-bottom:15px;"><img src="${q.image}" style="max-width:100%; border-radius:10px; border:1px solid #ddd;"></div>`;

        q.options.forEach((opt, i) => {
            let cls = "";
            const isSelected = stored && opt === stored.selected;
            if(isPractice && stored) {
                if(labels[i] === q.answer) cls = "correct";
                else if(isSelected) cls = "wrong";
            } else if(isSelected) cls = "selected";

            html += `<div class="option-item ${cls}" onclick="selectAns(${idx}, '${opt.replace(/'/g, "\\'")}')">
                        <b style="margin-right:10px;">${labels[i]}.</b> ${opt}
                     </div>`;
        });

        if(isPractice && stored) html += `<div style="background:#fff3cd; padding:12px; border-radius:10px; border-left:5px solid #ffc107; font-size:0.9rem;"><b>Giải thích:</b> ${q.explanation}</div>`;
        
        html += `<div style="display:flex; gap:10px; margin-top:20px;">
                    <button class="btn-start" style="background:#6c757d;" onclick="showQuestion(${idx-1})" ${idx===0?'disabled':''}>Quay lại</button>
                    <button class="btn-start" style="background:var(--btn-blue);" onclick="showQuestion(${idx+1})" ${idx===29?'disabled':''}>Câu tiếp</button>
                 </div>`;
        document.getElementById('quiz-content').innerHTML = html;
        renderGrid();
    }

    function selectAns(qIdx, ans) {
        if(isSubmitted) return;
        const i = studentAnswers.findIndex(a => a.qIndex === qIdx);
        if(i > -1) studentAnswers[i].selected = ans;
        else studentAnswers.push({qIndex: qIdx, selected: ans});
        showQuestion(qIdx);
    }

    function renderGrid() {
        const grid = document.getElementById('nav-grid');
        grid.innerHTML = "";
        selectedQuestions.forEach((_, i) => {
            const hasAns = studentAnswers.some(a => a.qIndex === i);
            const active = i === currentQuestionIndex ? 'border:2px solid var(--btn-orange); transform: scale(1.1);' : '';
            const bg = hasAns ? 'background:var(--caee-blue); color:white;' : 'background:white;';
            grid.innerHTML += `<div class="nav-item" onclick="showQuestion(${i})" style="${bg} ${active}">${i+1}</div>`;
        });
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            timeLeft--;
            let m = Math.floor(timeLeft/60), s = timeLeft%60;
            document.getElementById('timer').innerText = `${m}:${s<10?'0':''}${s}`;
            if(timeLeft <= 0) submitQuiz(true);
        }, 1000);
    }

    async function submitQuiz(auto = false) {
        if(isSubmitted) return;
        if(!auto && !confirm("XÁC NHẬN: Bạn muốn nộp bài và kết thúc sát hạch?")) return;
        isSubmitted = true; clearInterval(timerInterval);

        let score = 0;
        selectedQuestions.forEach((q, i) => {
            const ans = studentAnswers.find(a => a.qIndex === i);
            if(ans) {
                const selectedLabel = ['A','B','C','D'][q.options.indexOf(ans.selected)];
                if(selectedLabel === q.answer) score++;
            }
        });

        const status = score >= 25 ? "ĐẠT" : "KHÔNG ĐẠT";
        const studentName = document.getElementById('studentName').value.toUpperCase();
        const studentDOB = document.getElementById('studentDOB').value;

        document.getElementById('res-name').innerText = studentName;
        document.getElementById('res-dob').innerText = studentDOB;
        document.getElementById('res-score').innerText = score;
        document.getElementById('res-badge').innerText = status;
        document.getElementById('res-badge').style.backgroundColor = score >= 25 ? "var(--success)" : "var(--danger)";
        
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('caee-header').style.display = 'none';
        document.getElementById('result-screen').style.display = 'flex';

        // Gửi dữ liệu về Google Sheets
        const formData = new URLSearchParams();
        formData.append('name', studentName);
        formData.append('birthDate', studentDOB);
        formData.append('khoaThi', document.getElementById('khoaThi').value);
        formData.append('jobName', document.getElementById('job-display-header').innerText);
        formData.append('score', score);
        formData.append('status', status);
        formData.append('mode', document.getElementById('modeToggle').checked ? "ONTAP" : "THI");
        formData.append('cheat', cheatCount);

        fetch(WEB_APP_URL, { method: "POST", mode: "no-cors", body: formData });

        let c = 10;
        setInterval(() => { if(c > 0) { c--; document.getElementById('countdown').innerText = c; } if(c===0) location.reload(); }, 1000);
    }
</script>
</body>
</html>
