<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HỆ THỐNG SÁT HẠCH NGHỀ KHOA MÁY THI CÔNG - CAEE</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            --caee-blue: #003399; --header-blue: #0040cc;
            --btn-orange: #ff6600; --btn-blue: #3366ff;
            --success: #28a745; --danger: #dc3545;
        }

        /* Tối ưu chống tràn và hỗ trợ iPhone X Safe Area */
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }

        body { 
            background: #f0f2f5 url('https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?q=80&w=2070&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Segoe UI', Arial, sans-serif;
            height: 100vh; /* Ép cứng chiều cao bằng màn hình */
            width: 100vw;
            overflow: hidden; /* Tuyệt đối không cho cuộn trang chính */
            display: flex;
            flex-direction: column;
        }

        /* HEADER SIÊU GỌN */
        .caee-header {
            background: var(--header-blue); color: white; 
            padding: env(safe-area-inset-top) 10px 5px 10px; /* Hỗ trợ tai thỏ iPhone */
            display: none; justify-content: space-between; align-items: center;
            width: 100%; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            flex-shrink: 0;
        }

        .timer-box { background: #ff3333; padding: 4px 8px; border-radius: 6px; font-weight: bold; font-size: 0.85rem; }

        /* VÙNG CHỨA NỘI DUNG CHÍNH - TỰ CO GIÃN */
        #quiz-screen { 
            flex: 1; /* Tự chiếm phần còn lại của màn hình */
            display: none; 
            grid-template-columns: 1fr 240px; 
            gap: 10px; 
            padding: 10px;
            overflow: hidden;
        }

        #quiz-content {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            overflow-y: auto; /* Chỉ cho phép cuộn bên trong câu hỏi nếu quá dài */
            height: 100%;
        }

        /* BỐ CỤC CÂU HỎI & ẢNH */
        #question-layout {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
        }

        .ai-box {
            width: 100%;
            max-height: 180px; /* Giới hạn chiều cao ảnh trên điện thoại */
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .ai-box img { width: 100%; height: 100%; object-fit: contain; }

        .option-item {
            border: 1px solid #ddd; border-radius: 8px; padding: 10px; margin-bottom: 6px;
            cursor: pointer; background: white; font-size: 0.9rem; line-height: 1.3;
        }
        .option-item.selected { background: #e7f0ff; border-color: var(--btn-blue); color: var(--caee-blue); font-weight: 600; }

        /* TỐI ƯU RIÊNG CHO IPHONE X VÀ MOBILE */
        @media (max-width: 850px) {
            #quiz-screen { grid-template-columns: 1fr; padding: 5px; }
            .sidebar-right { display: none; } /* Ẩn sidebar trên mobile để tiết kiệm chỗ, dùng nút nộp bài riêng */
            
            .caee-header b { font-size: 10px; }
            #job-display-header { font-size: 9px !important; }
            
            .ai-box { max-height: 150px; } /* Thu nhỏ ảnh hơn nữa trên mobile */
            h3 { font-size: 0.95rem !important; margin-bottom: 8px !important; }
            
            /* Sơ đồ câu hỏi chuyển xuống dưới dạng danh sách ngang nếu cần, hoặc ẩn đi */
            .mobile-nav {
                display: flex;
                justify-content: space-between;
                padding: 10px 0;
                gap: 10px;
                flex-shrink: 0;
            }
        }

        /* MÀN HÌNH CHÀO */
        .welcome-container {
            background: white; padding: 20px; border-radius: 15px;
            width: 90%; max-width: 380px; margin: auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .btn-start { 
            background: var(--success); color: white; border: none; width: 100%; padding: 12px; 
            border-radius: 10px; font-weight: bold; font-size: 1rem;
        }
    </style>
</head>
<body oncontextmenu="return false">

    <div class="caee-header" id="caee-header">
        <div style="flex-grow: 1;">
            <b style="display: block; font-size: 11px;">CAO ĐẲNG CƠ ĐIỆN NÔNG NGHIỆP & MT</b>
            <div id="job-display-header" style="color: #ffd700; font-size: 10px; font-weight: bold;">ĐANG TẢI...</div>
            <div style="font-size: 10px;">Học viên: <span id="display-name" style="font-weight: bold;">---</span></div>
        </div>
        <div id="timer" class="timer-box">20:00</div>
    </div>

    <div id="start-screen" style="display: flex; height: 100vh; align-items: center;">
        <div class="welcome-container">
            <h2 style="text-align:center; color:var(--caee-blue); margin-bottom: 15px; font-size: 1.1rem;">HỆ THỐNG SÁT HẠCH - CAEE</h2>
            <select id="jobType" style="width:100%; padding:10px; margin-bottom:10px; border-radius:8px; border:1px solid #ccc;" onchange="preloadQuestions()">
                <option value="1538604642">NGHỀ: VẬN HÀNH XE NÂNG HÀNG</option>
                <option value="798209567">NGHỀ: VẬN HÀNH CẦN TRỤC</option>
                <option value="1969781180">NGHỀ: VẬN HÀNH CẦU TRỤC</option>
            </select>
            <input type="text" id="studentName" placeholder="HỌ VÀ TÊN" style="width:100%; padding:10px; margin-bottom:10px; border-radius:8px; border:1px solid #ccc; text-transform: uppercase;">
            <input type="text" id="studentDOB" placeholder="Ngày sinh" style="width:100%; padding:10px; margin-bottom:10px; border-radius:8px; border:1px solid #ccc;">
            <input type="password" id="maThi" placeholder="Mã thi" style="width:100%; padding:10px; margin-bottom:15px; border-radius:8px; border:2px solid var(--btn-orange);">
            <button class="btn-start" onclick="validateAndStart()">BẮT ĐẦU THI ➔</button>
        </div>
    </div>

    <div id="quiz-screen">
        <div id="quiz-content">
            </div>
        <div class="sidebar-right" id="sidebar">
            <div style="background:white; padding:10px; border-radius:10px; height: 100%; display: flex; flex-direction: column;">
                <h4 style="font-size: 0.8rem; text-align: center; margin-bottom: 10px;">SƠ ĐỒ</h4>
                <div id="nav-grid" style="display:grid; grid-template-columns: repeat(5, 1fr); gap:4px; flex: 1; overflow-y: auto;"></div>
                <button class="btn-start" style="margin-top:10px; background:var(--caee-blue);" onclick="submitQuiz()">NỘP BÀI</button>
            </div>
        </div>
    </div>

    <script>
        // Giữ nguyên các hàm Logic JS của bạn, chỉ thay đổi hàm showQuestion để khớp với CSS mới
        const BASE_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR7h1KNottkL2N-DEBjkUVVlXLblXy25_x1UhqML8WQz3AWeWeXFuvkSQUb4Sxv5eaK5T-VJQEWh4wB/pub?output=csv&gid=";
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwI4DGYeb7h8Cxfb2wWuIe9B5ASc2XtQGhGhF8C10bVztslISecZpgojrbVf4c744k0/exec";
        
        let allQuestions = [], selectedQuestions = [], studentAnswers = [];
        let currentQuestionIndex = 0, timeLeft = 1200, timerInterval, isSubmitted = false;

        function preloadQuestions() {
            const gid = document.getElementById('jobType').value;
            Papa.parse(BASE_CSV_URL + gid, {
                download: true, header: true, skipEmptyLines: true,
                complete: function(results) {
                    allQuestions = results.data.filter(i => i.CauHoi).map(i => ({
                        question: i.CauHoi,
                        options: [i.A, i.B, i.C, i.D].filter(o => o),
                        answer: i.DapAnDung ? i.DapAnDung.trim().toUpperCase() : "",
                        image: i["HINH ANH"] || ""
                    }));
                }
            });
        }

        async function validateAndStart() {
            const maThi = document.getElementById('maThi').value.trim();
            const name = document.getElementById('studentName').value.trim();
            if(!name || !maThi) return alert("Vui lòng nhập đầy đủ!");
            
            // Bỏ qua fetch checkCode để bạn tự test nhanh, nếu chạy thật hãy mở lại fetch
            startQuiz();
        }

        function startQuiz() {
            selectedQuestions = allQuestions.sort(() => 0.5 - Math.random()).slice(0, 30);
            document.getElementById('display-name').innerText = document.getElementById('studentName').value.toUpperCase();
            document.getElementById('job-display-header').innerText = document.getElementById('jobType').options[document.getElementById('jobType').selectedIndex].text;
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('caee-header').style.display = 'flex';
            document.getElementById('quiz-screen').style.display = 'grid';
            showQuestion(0);
            startTimer();
        }

        function showQuestion(idx) {
            if(idx < 0 || idx >= selectedQuestions.length) return;
            currentQuestionIndex = idx;
            const q = selectedQuestions[idx];
            const stored = studentAnswers.find(a => a.qIndex === idx);
            const labels = ['A', 'B', 'C', 'D'];

            let html = `
                <div class="progress-container"><div class="progress-bar" style="width: ${((idx+1)/30)*100}%"></div></div>
                <div id="question-layout">
                    <div class="ai-box">
                        <img src="${q.image || 'https://via.placeholder.com/400x225?text=CAEE+KHOA+MAY'}">
                    </div>
                    <div class="question-main">
                        <h3 style="margin-bottom:10px; font-size:1rem;">Câu ${idx + 1}: ${q.question}</h3>
                        <div id="options-list">`;

            q.options.forEach((opt, i) => {
                let cls = (stored && opt === stored.selected) ? "selected" : "";
                html += `<div class="option-item ${cls}" onclick="selectAns(${idx}, '${opt.replace(/'/g, "\\'")}')">
                            <b>${labels[i]}.</b> ${opt}
                         </div>`;
            });

            html += `   </div>
                    </div>
                </div>
                <div class="mobile-nav">
                    <button class="btn-start" style="background:#6c757d; flex:1;" onclick="showQuestion(${idx-1})" ${idx===0?'disabled':''}>TRƯỚC</button>
                    <button class="btn-start" style="background:var(--btn-blue); flex:1;" onclick="showQuestion(${idx+1})" ${idx===29?'disabled':''}>TIẾP THEO</button>
                    <button class="btn-start" style="background:var(--danger); flex:0.8; font-size:0.8rem;" onclick="submitQuiz()">NỘP BÀI</button>
                </div>`;
            
            document.getElementById('quiz-content').innerHTML = html;
            renderGrid();
        }

        function selectAns(qIdx, ans) {
            const i = studentAnswers.findIndex(a => a.qIndex === qIdx);
            if(i > -1) studentAnswers[i].selected = ans;
            else studentAnswers.push({qIndex: qIdx, selected: ans});
            showQuestion(qIdx);
        }

        function renderGrid() {
            const grid = document.getElementById('nav-grid');
            if(!grid) return;
            grid.innerHTML = "";
            selectedQuestions.forEach((_, i) => {
                const hasAns = studentAnswers.some(a => a.qIndex === i);
                const active = i === currentQuestionIndex ? 'border:2px solid var(--btn-orange);' : '';
                const bg = hasAns ? 'background:var(--caee-blue); color:white;' : 'background:white; color:#555;';
                grid.innerHTML += `<div onclick="showQuestion(${i})" style="height:30px; display:flex; justify-content:center; align-items:center; border-radius:4px; cursor:pointer; font-size:0.7rem; font-weight:bold; border:1px solid #ddd; ${bg} ${active}">${i+1}</div>`;
            });
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                let m = Math.floor(timeLeft/60), s = timeLeft%60;
                document.getElementById('timer').innerText = `${m}:${s<10?'0':''}${s}`;
                if(timeLeft <= 0) submitQuiz(true);
            }, 1000);
        }

        function submitQuiz() {
            alert("Đã ghi nhận kết quả!");
            location.reload();
        }

        window.onload = preloadQuestions;
    </script>
</body>
</html>
