<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>HỆ THỐNG SÁT HẠCH NGHỀ KHOA MÁY - CAEE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        /* Đồng hồ trong suốt góc phải */
        .glass-timer {
            position: fixed;
            top: 15px;
            right: 15px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 15px;
            border-radius: 12px;
            color: #1e293b;
            font-weight: 700;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: none;
        }

        /* Thanh tiến trình */
        .progress-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 6px;
            background: #e2e8f0; z-index: 1001;
        }
        #progress-bar {
            width: 0%; height: 100%;
            background: linear-gradient(90deg, #3b82f6, #2563eb);
            transition: width 0.3s ease;
        }

        .option-item {
            transition: all 0.2s ease;
            border: 2px solid #e2e8f0;
        }
        .option-item.selected {
            background-color: #eff6ff;
            border-color: #3b82f6;
            color: #1e40af;
            transform: scale(1.02);
        }
        .option-item.correct { background-color: #dcfce7 !important; border-color: #22c55e !important; color: #166534 !important; }
        .option-item.wrong { background-color: #fee2e2 !important; border-color: #ef4444 !important; color: #991b1b !important; }

        #warning-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(239, 68, 68, 0.95); color: white; z-index: 9999;
            justify-content: center; align-items: center; text-align: center;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800" oncontextmenu="return false">

    <div id="warning-overlay" class="p-6">
        <div class="text-3xl font-bold italic">⚠️ PHÁT HIỆN GIAN LẬN!</div>
        <p class="mt-4">Vui lòng quay lại màn hình thi ngay lập tức.</p>
    </div>

    <div class="progress-container" id="p-container" style="display: none;">
        <div id="progress-bar"></div>
    </div>

    <div id="timer" class="glass-timer text-xl">20:00</div>

    <div id="start-screen" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-3xl p-8 shadow-2xl border border-slate-100">
            <div class="text-center mb-8">
                <h1 class="text-2xl font-extrabold text-blue-800 tracking-tight">HỆ THỐNG SÁT HẠCH</h1>
                <p class="text-slate-500 font-medium uppercase text-sm mt-1">Khoa Máy Thi Công - CAEE</p>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="text-xs font-bold text-slate-500 ml-1 uppercase">Ngành nghề</label>
                    <select id="jobType" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl font-bold focus:ring-2 focus:ring-blue-500 outline-none appearance-none" onchange="preloadQuestions()">
                        <option value="1538604642">VẬN HÀNH XE NÂNG HÀNG</option>
                        <option value="798209567">VẬN HÀNH CẦN TRỤC</option>
                        <option value="1969781180">VẬN HÀNH CẦU TRỤC</option>
                    </select>
                </div>

                <input type="text" id="studentName" placeholder="HỌ VÀ TÊN HỌC VIÊN" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none uppercase font-semibold">
                <input type="text" id="studentDOB" placeholder="NGÀY SINH (VD: 01/01/2000)" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">

                <div class="flex gap-3">
                    <input type="text" id="khoaThi" value="Tháng 4/2026" class="w-2/3 p-4 bg-slate-100 border border-slate-200 rounded-xl font-bold text-slate-600" readonly>
                    <input type="password" id="maThi" placeholder="MÃ THI" class="w-1/3 p-4 bg-slate-50 border-2 border-blue-200 rounded-xl focus:border-blue-500 outline-none text-center font-bold">
                </div>

                <label class="flex items-center justify-center gap-3 p-3 bg-blue-50 rounded-xl cursor-pointer hover:bg-blue-100 transition">
                    <input type="checkbox" id="modeToggle" class="w-5 h-5 rounded text-blue-600">
                    <span class="font-bold text-blue-800">CHẾ ĐỘ ÔN TẬP</span>
                </label>

                <button onclick="validateAndStart()" id="btnStart" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-extrabold py-5 rounded-2xl shadow-lg shadow-blue-200 transition-all active:scale-95 text-lg uppercase">
                    Bắt đầu làm bài ➔
                </button>
            </div>
        </div>
    </div>

    <div id="quiz-screen" class="hidden max-w-3xl mx-auto p-4 pt-20 pb-32">
        <div id="quiz-content" class="bg-white rounded-3xl p-6 shadow-xl border border-slate-100 min-h-[400px]"></div>
        
        <div class="fixed bottom-0 left-0 w-full bg-white/80 backdrop-blur-md p-4 border-t border-slate-100 shadow-[0_-10px_25px_rgba(0,0,0,0.05)]">
            <div class="max-w-3xl mx-auto flex items-center justify-between gap-3">
                <button id="prevBtn" onclick="changeQuestion(-1)" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-4 rounded-xl active:scale-95 transition text-sm">LÙI LẠI</button>
                <button id="submitBtn" onclick="submitQuiz()" class="flex-[1.5] bg-blue-600 hover:bg-blue-700 text-white font-black py-4 rounded-xl shadow-md active:scale-95 transition text-base">NỘP BÀI</button>
                <button id="nextBtn" onclick="changeQuestion(1)" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-4 rounded-xl active:scale-95 transition text-sm">TIẾP THEO</button>
            </div>
        </div>
    </div>

    <div id="result-screen" class="hidden fixed inset-0 bg-blue-900 z-[10000] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-[2.5rem] p-10 text-center shadow-2xl">
            <h2 class="text-xl font-bold text-slate-400 uppercase tracking-widest mb-2">Kết quả sát hạch</h2>
            <div id="res-name" class="text-2xl font-black text-blue-900 uppercase mb-6">TÊN HỌC VIÊN</div>
            
            <div class="relative inline-flex items-center justify-center mb-6">
                <div class="w-40 h-40 rounded-full border-[12px] border-slate-100 flex flex-col items-center justify-center">
                    <span id="res-score" class="text-6xl font-black text-blue-600">0</span>
                    <span class="text-slate-400 font-bold text-sm">/ 30 CÂU</span>
                </div>
            </div>

            <div id="res-badge" class="py-3 px-10 rounded-full text-white font-black text-xl mb-6 shadow-lg inline-block">---</div>
            
            <div class="bg-amber-50 text-amber-700 p-4 rounded-2xl text-sm font-bold leading-relaxed mb-6">
                KẾT QUẢ NÀY ĐƯỢC HỆ THỐNG LƯU TRỮ VÀ DÙNG ĐỂ XÉT DUYỆT CẤP CHỨNG CHỈ.
            </div>
            
            <p class="text-slate-400 text-xs font-medium">Hệ thống tự đóng sau <span id="countdown" class="text-blue-600 font-bold">10</span> giây...</p>
        </div>
    </div>

<script>
    const BASE_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR7h1KNottkL2N-DEBjkUVVlXLblXy25_x1UhqML8WQz3AWeWeXFuvkSQUb4Sxv5eaK5T-VJQEWh4wB/pub?output=csv&gid=";
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwAtaRA2z11PUj6b24FFBXgGzgFO7GzYfy30v30IyHYoHWbeqexQSh3Y8iGVkkyLliP/exec";
    
    let allQuestions = [], selectedQuestions = [], studentAnswers = [];
    let currentIdx = 0, timeLeft = 1200, timerInterval, isSubmitted = false, cheatCount = 0;

    window.onload = preloadQuestions;

    function preloadQuestions() {
        const gid = document.getElementById('jobType').value;
        Papa.parse(BASE_CSV_URL + gid, {
            download: true, header: true, skipEmptyLines: true,
            complete: function(results) {
                allQuestions = results.data.filter(i => i.CauHoi).map(i => ({
                    question: i.CauHoi,
                    options: [i.A, i.B, i.C, i.D].filter(o => o),
                    answer: i.DapAnDung ? i.DapAnDung.trim().toUpperCase() : "",
                    explanation: i.Giaithich || "Thực hiện đúng quy trình an toàn.",
                    image: i["HINH ANH"] || "" 
                }));
            }
        });
    }

    // Chống gian lận
    window.onblur = () => { if(!isSubmitted && selectedQuestions.length > 0) { cheatCount++; document.getElementById('warning-overlay').style.display = 'flex'; if(cheatCount >= 3) submitQuiz(true); } };
    window.onfocus = () => { document.getElementById('warning-overlay').style.display = 'none'; };

    async function validateAndStart() {
        const maThi = document.getElementById('maThi').value.trim();
        const name = document.getElementById('studentName').value.trim();
        const dob = document.getElementById('studentDOB').value.trim();
        if(!name || !maThi || !dob) return alert("Vui lòng nhập đủ Tên, Ngày sinh và Mã thi!");

        const btn = document.getElementById('btnStart');
        btn.disabled = true; btn.innerText = "ĐANG XÁC MINH...";

        try {
            const res = await fetch(`${WEB_APP_URL}?action=checkCode&code=${maThi}`);
            const result = await res.json();
            if(result.isValid) startQuiz();
            else { alert("Mã thi không chính xác!"); btn.disabled = false; btn.innerText = "BẮT ĐẦU LÀM BÀI ➔"; }
        } catch(e) { alert("Lỗi Server! Thử lại sau."); btn.disabled = false; btn.innerText = "BẮT ĐẦU LÀM BÀI ➔"; }
    }

    function startQuiz() {
        if(allQuestions.length === 0) return alert("Đang tải dữ liệu, hãy đợi 1-2 giây...");
        selectedQuestions = allQuestions.sort(() => 0.5 - Math.random()).slice(0, 30);
        
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        document.getElementById('timer').style.display = 'block';
        document.getElementById('p-container').style.display = 'block';
        
        showQuestion(0);
        startTimer();
    }

    function showQuestion(idx) {
        currentIdx = idx;
        const q = selectedQuestions[idx];
        const stored = studentAnswers.find(a => a.qIndex === idx);
        const isPractice = document.getElementById('modeToggle').checked;
        const labels = ['A', 'B', 'C', 'D'];

        let html = `<div class="flex items-center gap-3 mb-4">
                        <span class="bg-blue-600 text-white px-3 py-1 rounded-lg font-black italic">CÂU ${idx + 1}</span>
                    </div>
                    <h3 class="text-lg font-bold leading-relaxed mb-6 text-slate-800">${q.question}</h3>`;
        
        if(q.image) html += `<img src="${q.image}" class="w-full rounded-2xl mb-6 shadow-sm border border-slate-100">`;

        q.options.forEach((opt, i) => {
            let cls = "";
            const isSelected = stored && opt === stored.selected;
            if(isPractice && stored) {
                if(labels[i] === q.answer) cls = "correct";
                else if(isSelected) cls = "wrong";
            } else if(isSelected) cls = "selected";

            html += `<div class="option-item flex items-center p-4 mb-3 rounded-xl cursor-pointer font-semibold ${cls}" onclick="selectAns(${idx}, '${opt.replace(/'/g, "\\'")}')">
                        <span class="w-8 h-8 flex items-center justify-center bg-slate-100 rounded-lg mr-4 text-sm font-black text-slate-500">${labels[i]}</span>
                        <div class="flex-1">${opt}</div>
                     </div>`;
        });

        if(isPractice && stored) html += `<div class="mt-4 p-4 bg-blue-50 border-l-4 border-blue-500 rounded-r-xl text-sm font-bold text-blue-800 italic">💡 Giải thích: ${q.explanation}</div>`;

        document.getElementById('quiz-content').innerHTML = html;
        document.getElementById('prevBtn').disabled = (idx === 0);
        document.getElementById('nextBtn').disabled = (idx === 29);
        updateProgress();
    }

    function selectAns(qIdx, ans) {
        if(isSubmitted) return;
        const i = studentAnswers.findIndex(a => a.qIndex === qIdx);
        if(i > -1) studentAnswers[i].selected = ans;
        else studentAnswers.push({qIndex: qIdx, selected: ans});
        showQuestion(qIdx);
    }

    function changeQuestion(step) {
        let n = currentIdx + step;
        if(n >= 0 && n < 30) showQuestion(n);
    }

    function updateProgress() {
        const percent = (studentAnswers.length / 30) * 100;
        document.getElementById('progress-bar').style.width = percent + "%";
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            timeLeft--;
            let m = Math.floor(timeLeft/60), s = timeLeft%60;
            const timerEl = document.getElementById('timer');
            timerEl.innerText = `${m}:${s<10?'0':''}${s}`;
            if(timeLeft < 300) timerEl.style.color = '#ef4444'; // Đỏ khi còn dưới 5 phút
            if(timeLeft <= 0) submitQuiz(true);
        }, 1000);
    }

    async function submitQuiz(auto = false) {
        if(isSubmitted) return;
        if(!auto && !confirm("BẠN CÓ CHẮC MUỐN NỘP BÀI KHÔNG?")) return;
        isSubmitted = true; clearInterval(timerInterval);

        let score = 0;
        selectedQuestions.forEach((q, i) => {
            const ans = studentAnswers.find(a => a.qIndex === i);
            if(ans && ['A','B','C','D'][q.options.indexOf(ans.selected)] === q.answer) score++;
        });

        const status = score >= 25 ? "ĐẠT" : "KHÔNG ĐẠT";
        const name = document.getElementById('studentName').value.toUpperCase();
        
        document.getElementById('res-name').innerText = name;
        document.getElementById('res-score').innerText = score;
        document.getElementById('res-badge').innerText = status;
        document.getElementById('res-badge').style.backgroundColor = score >= 25 ? "#22c55e" : "#ef4444";
        
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('timer').style.display = 'none';
        document.getElementById('result-screen').classList.remove('hidden');

        // Lưu về Google Sheets
        const formData = new URLSearchParams();
        formData.append('name', name);
        formData.append('birthDate', document.getElementById('studentDOB').value);
        formData.append('khoaThi', document.getElementById('khoaThi').value);
        formData.append('jobName', document.getElementById('jobType').options[document.getElementById('jobType').selectedIndex].text);
        formData.append('score', score);
        formData.append('status', status);
        formData.append('mode', document.getElementById('modeToggle').checked ? "ONTAP" : "THI");
        formData.append('cheat', cheatCount);
        fetch(WEB_APP_URL, { method: "POST", mode: "no-cors", body: formData });

        let c = 10;
        const countInt = setInterval(() => { c--; document.getElementById('countdown').innerText = c; if(c<=0) { clearInterval(countInt); location.reload(); } }, 1000);
    }
</script>
</body>
</html>
