<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SÁT HẠCH NGHỀ CAEE - GAMING LIGHT</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00d2ff;
            --neon-pink: #ff007f;
            --gaming-white: #f8f9fa;
            --text-dark: #1a1f26;
            --panel-shadow: 0 10px 30px rgba(0, 210, 255, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        body { 
            background: #f0f4f8; 
            color: var(--text-dark); 
            font-family: 'Roboto', sans-serif; 
            overflow: hidden; 
            height: 100vh;
        }

        /* HEADER TỰ ĐỘNG ẨN HIỆN - GIÚP TĂNG 15% DIỆN TÍCH */
        .caee-header {
            background: white;
            padding: 8px 20px; 
            display: none; /* Hiện khi vào thi */
            justify-content: space-between;
            align-items: center; 
            border-bottom: 3px solid var(--neon-blue);
            position: fixed; 
            top: 0; width: 100%; 
            z-index: 1000;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .header-hidden { transform: translateY(-100%); }

        .hud-text { font-family: 'Orbitron', sans-serif; font-weight: 700; color: var(--neon-blue); }
        
        /* TIMER TÁCH BIỆT KHỎI TIÊU ĐỀ */
        .timer-box { 
            background: var(--text-dark); border-radius: 8px;
            padding: 5px 15px; color: var(--neon-blue); font-family: 'Orbitron';
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.4);
            font-size: 1.1rem;
        }

        /* GIAO DIỆN LÀM BÀI GRID 2 CỘT */
        #quiz-screen { 
            display: none; 
            height: 100vh; 
            padding: 70px 15px 110px 15px; /* Padding trên để chừa chỗ header, dưới cho Gamepad */
            grid-template-columns: 1fr 280px; 
            gap: 15px; 
            max-width: 1400px; 
            margin: auto;
        }

        #quiz-content { 
            background: white; padding: 20px; border-radius: 15px; 
            box-shadow: var(--panel-shadow); 
            overflow-y: auto;
            border-top: 5px solid var(--neon-blue);
            scrollbar-width: thin;
        }

        .q-text { font-size: 1.15rem; font-weight: 700; margin-bottom: 12px; color: #222; line-height: 1.4; }
        
        .option-item {
            background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px;
            padding: 14px 18px; margin-bottom: 10px; cursor: pointer; transition: 0.2s;
            font-size: 15px; display: flex; align-items: center;
        }
        .option-item:hover { background: #f0f9ff; border-color: var(--neon-blue); }
        .option-item.selected { 
            background: #e0f2fe; border-color: var(--neon-blue); 
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.2); font-weight: 500;
        }

        /* KHU VỰC HÌNH ẢNH CHIẾM DIỆN TÍCH LỚN */
        .q-image-box { text-align: center; margin-bottom: 15px; }
        .q-image-box img { 
            width: 100%; max-height: 320px; object-fit: contain;
            border-radius: 12px; border: 1px solid #e2e8f0; background: #fff;
        }

        /* GAMEPAD CONTROLS PHÍA DƯỚI */
        .game-controls {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 100px;
            background: rgba(255,255,255,0.95); display: flex; justify-content: space-between;
            align-items: center; padding: 0 30px; border-top: 2px solid var(--neon-blue);
            backdrop-filter: blur(10px); z-index: 999;
        }
        .btn-nav-game {
            width: 110px; height: 55px; border-radius: 12px; border: none;
            background: var(--text-dark); color: white; font-family: 'Orbitron'; font-weight: bold;
            box-shadow: 0 4px 0 #000; transition: 0.1s; cursor: pointer;
        }
        .btn-nav-game:active { transform: translateY(3px); box-shadow: none; }
        .btn-nav-game:disabled { opacity: 0.3; cursor: not-allowed; }

        /* SƠ ĐỒ CÂU HỎI BÊN PHẢI */
        .sidebar-right { background: white; padding: 15px; border-radius: 15px; box-shadow: var(--panel-shadow); height: fit-content; }
        .grid-container { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
        .grid-item {
            height: 38px; display: flex; justify-content: center; align-items: center;
            border-radius: 8px; cursor: pointer; font-family: 'Orbitron'; font-size: 13px;
            background: #f1f5f9; color: #64748b; border: 1px solid #e2e8f0;
        }
        .grid-item.answered { background: var(--neon-blue); color: white; border: none; box-shadow: 0 4px 10px rgba(0, 210, 255, 0.3); }
        .grid-item.active { border: 2px solid var(--neon-pink); color: var(--neon-pink); font-weight: bold; }

        @media (max-width: 900px) {
            #quiz-screen { grid-template-columns: 1fr; padding-top: 10px; }
            .sidebar-right { display: none; }
            .q-image-box img { max-height: 220px; }
            .game-controls { padding: 0 15px; height: 90px; }
        }
    </style>
</head>
<body oncontextmenu="return false">

    <div class="caee-header" id="caee-header">
        <div>
            <div class="hud-text" style="font-size: 11px; letter-spacing: 1px;">CAO ĐẲNG CAEE - KHOA MÁY</div>
            <div style="font-size: 13px; font-weight: 700;">HỌC VIÊN: <span id="display-name" style="color: var(--neon-pink);">---</span></div>
        </div>
        <div id="timer" class="timer-box">20:00</div>
    </div>

    <div id="start-screen">
        <div class="welcome-container">
            <h2 class="hud-text" style="text-align:center; color:var(--text-dark); margin-bottom: 25px; font-size: 1.3rem;">HỆ THỐNG SÁT HẠCH</h2>
            <input type="text" id="studentName" placeholder="NHẬP HỌ TÊN" class="form-control" style="text-transform: uppercase; font-weight: bold;">
            <input type="text" id="studentDOB" placeholder="NGÀY SINH (DD/MM/YYYY)" class="form-control">
            <input type="password" id="maThi" placeholder="MÃ DỰ THI" class="form-control">
            <button class="btn-start" onclick="startQuiz()">BẮT ĐẦU THI</button>
        </div>
    </div>

    <div id="quiz-screen">
        <div id="quiz-content">
            </div>
        
        <aside class="sidebar-right">
            <div class="hud-text" style="font-size: 14px; margin-bottom: 15px; text-align: center;">MISSION PROGRESS</div>
            <div id="nav-grid" class="grid-container"></div>
            <div style="margin-top: 20px; padding-top: 15px; border-top: 1px dashed #ddd;">
                <div style="font-size: 11px; color: #94a3b8; text-align: center;">KHOA MÁY THI CÔNG - 2026</div>
            </div>
        </aside>
    </div>

    <div class="game-controls" id="game-controls" style="display:none;">
        <button class="btn-nav-game" id="btnPrev" onclick="showQuestion(currentQuestionIndex-1)">PREV</button>
        <div style="text-align:center">
            <div id="q-counter" class="hud-text" style="font-size: 20px; color: var(--text-dark);">01/30</div>
            <button id="submitBtn" style="background: var(--neon-pink); border:none; color:white; padding:5px 15px; border-radius:6px; font-family:'Orbitron'; font-size:11px; cursor:pointer; margin-top:5px;" onclick="submitQuiz()">NỘP BÀI</button>
        </div>
        <button class="btn-nav-game" id="btnNext" onclick="showQuestion(currentQuestionIndex+1)" style="background: var(--neon-blue); box-shadow: 0 4px 0 #0099cc;">NEXT</button>
    </div>

    <script>
        let selectedQuestions = [], studentAnswers = [];
        let currentQuestionIndex = 0, timeLeft = 1200, timerInterval;
        let lastScrollTop = 0;

        // LOGIC TỰ ĐỘNG ẨN/HIỆN HEADER KHI CUỘN NỘI DUNG CÂU HỎI
        document.getElementById('quiz-content').addEventListener('scroll', function() {
            let st = this.scrollTop;
            let header = document.getElementById('caee-header');
            if (st > lastScrollTop && st > 30) {
                header.classList.add('header-hidden');
            } else {
                header.classList.remove('header-hidden');
            }
            lastScrollTop = st;
        });

        function startQuiz() {
            const name = document.getElementById('studentName').value;
            if(!name) return alert("Vui lòng nhập họ tên!");
            
            // Giả lập 30 câu hỏi (Anh kết nối lại với PapaParse tại đây)
            selectedQuestions = Array.from({length: 30}, (_, i) => ({
                question: `Câu hỏi vận hành ${i+1}: Quan sát hình ảnh và cho biết thao tác nào là đúng quy trình an toàn?`,
                options: ["Kiểm tra phanh và hệ thống lái", "Tiến hành nâng hàng ngay", "Báo cáo cấp trên", "Hạ càng sát mặt đất"],
                image: "https://via.placeholder.com/800x400.png?text=Hinh+Anh+Ky+Thuat+Xe+Nang"
            }));

            document.getElementById('display-name').innerText = name.toUpperCase();
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('caee-header').style.display = 'flex';
            document.getElementById('quiz-screen').style.display = 'grid';
            document.getElementById('game-controls').style.display = 'flex';
            
            showQuestion(0);
            startTimer();
        }

        function showQuestion(idx) {
            if(idx < 0 || idx > 29) return;
            currentQuestionIndex = idx;
            const q = selectedQuestions[idx];
            const stored = studentAnswers.find(a => a.qIndex === idx);
            
            document.getElementById('q-counter').innerText = `${idx + 1 < 10 ? '0' : ''}${idx + 1}/30`;
            document.getElementById('btnPrev').disabled = idx === 0;
            document.getElementById('btnNext').disabled = idx === 29;

            let html = `<div class="q-text">Câu ${idx+1}: ${q.question}</div>`;
            if(q.image) html += `<div class="q-image-box"><img src="${q.image}"></div>`;

            html += `<div class="options-container">`;
            q.options.forEach((opt, i) => {
                let cls = (stored && opt === stored.selected) ? "selected" : "";
                html += `<div class="option-item ${cls}" onclick="selectAns(${idx}, '${opt}')">
                            <b style="color:var(--neon-blue); margin-right:12px; font-family:'Orbitron';">${String.fromCharCode(65+i)}</b> ${opt}
                         </div>`;
            });
            html += `</div>`;

            document.getElementById('quiz-content').innerHTML = html;
            document.getElementById('quiz-content').scrollTop = 0; 
            renderGrid();
        }

        function selectAns(qIdx, ans) {
            const i = studentAnswers.findIndex(a => a.qIndex === qIdx);
            if(i > -1) studentAnswers[i].selected = ans;
            else studentAnswers.push({qIndex: qIdx, selected: ans});
            showQuestion(qIdx);
        }

        function renderGrid() {
            const grid = document.getElementById('nav-grid');
            grid.innerHTML = "";
            for(let i=0; i<30; i++) {
                const hasAns = studentAnswers.some(a => a.qIndex === i);
                const active = i === currentQuestionIndex ? 'active' : '';
                const answered = hasAns ? 'answered' : '';
                grid.innerHTML += `<div onclick="showQuestion(${i})" class="grid-item ${active} ${answered}">${i+1}</div>`;
            }
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                let m = Math.floor(timeLeft/60), s = timeLeft%60;
                document.getElementById('timer').innerText = `${m}:${s<10?'0':''}${s}`;
                if(timeLeft <= 0) { clearInterval(timerInterval); submitQuiz(); }
            }, 1000);
        }

        function submitQuiz() {
            alert("Hệ thống đã nhận bài làm của bạn!");
            location.reload();
        }
    </script>
</body>
</html>
