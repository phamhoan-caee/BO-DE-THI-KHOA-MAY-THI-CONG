<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HỆ THỐNG SÁT HẠCH NGHỀ KHOA MÁY THI CÔNG - CAEE</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            --caee-blue: #003399; --header-blue: #0040cc;
            --btn-orange: #ff6600; --btn-blue: #3366ff;
            --success: #28a745; --danger: #dc3545;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }

        body { 
            background: #f4f7f6;
            font-family: 'Segoe UI', Arial, sans-serif; padding-top: 65px; min-height: 100vh;
        }

        /* HEADER TỐI GIẢN CHO MOBILE */
        .caee-header {
            background: var(--header-blue); color: white; padding: 6px 12px;
            display: none; justify-content: space-between; align-items: center;
            position: fixed; top: 0; width: 100%; z-index: 1000; box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .timer-box { background: #ff3333; padding: 4px 8px; border-radius: 5px; font-weight: bold; min-width: 60px; text-align: center; font-size: 0.85rem; }

        /* VÙNG CHỨA CHÍNH TỰ CO GIÃN */
        .welcome-container, #quiz-content, .sidebar-right > div, .result-card { 
            background: #fff; border-radius: 10px; padding: 15px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            width: 95%; max-width: 500px; margin: 0 auto 15px;
        }

        #quiz-content { max-width: 1000px; width: 96%; }

        .ai-box {
            width: 100%; background: #eee; border-radius: 8px; overflow: hidden;
            aspect-ratio: 16/9; margin-bottom: 12px; border: 1px solid #ddd;
        }

        .ai-box img { width: 100%; height: 100%; object-fit: contain; }

        /* PHẦN THI TRẮC NGHIỆM */
        #quiz-screen { padding: 10px; display: none; grid-template-columns: 1fr 280px; gap: 15px; max-width: 1200px; margin: auto; }
        
        .option-item {
            border: 1px solid #ddd; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px;
            cursor: pointer; background: white; display: flex; align-items: center; font-size: 0.9rem; line-height: 1.3;
        }
        .option-item.selected { background: #e7f0ff; border-color: var(--btn-blue); color: var(--caee-blue); font-weight: 600; }

        /* ĐIỀU CHỈNH RIÊNG CHO ĐIỆN THOẠI */
        @media (max-width: 768px) {
            body { padding-top: 85px; }
            .caee-header { padding: 5px 10px; }
            .caee-header b { font-size: 10px; display: block; line-height: 1.1; }
            
            #quiz-screen { grid-template-columns: 1fr; padding: 5px; gap: 10px; }
            .sidebar-right { order: 2; width: 100%; }
            #quiz-content { padding: 12px; }
            
            #question-layout { display: flex !important; flex-direction: column !important; }
            .ai-side { order: -1; margin-bottom: 8px; }
            
            #nav-grid { grid-template-columns: repeat(6, 1fr) !important; gap: 4px; }
            .btn-nav { padding: 10px !important; font-size: 0.9rem !important; }
            h3 { font-size: 0.95rem !important; }
        }

        .btn-nav { background: var(--btn-blue); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; width: 48%; cursor: pointer; }
    </style>
</head>
<body>

    <div class="caee-header" id="caee-header">
        <div style="flex: 1; overflow: hidden;">
            <b style="color: #fff;">CAO ĐẲNG CƠ ĐIỆN NÔNG NGHIỆP & MT</b>
            <div id="display-name" style="font-size: 11px; font-weight: bold; color: #ffd700;">HỌC VIÊN: ---</div>
        </div>
        <div id="timer" class="timer-box">20:00</div>
    </div>

    <div id="start-screen" style="padding-top: 20px;">
        <div class="welcome-container">
            <h2 style="text-align:center; color:var(--caee-blue); margin-bottom: 15px; font-size: 1.1rem;">HỆ THỐNG SÁT HẠCH - CAEE</h2>
            <select id="jobType" style="width:100%; padding:10px; margin-bottom:10px; border-radius:5px;">
                <option value="1538604642">NGHỀ: VẬN HÀNH XE NÂNG HÀNG</option>
            </select>
            <input type="text" id="studentName" placeholder="HỌ VÀ TÊN" style="width:100%; padding:10px; margin-bottom:10px; border-radius:5px; border:1px solid #ccc;">
            <input type="password" id="maThi" placeholder="Mã dự thi" style="width:100%; padding:10px; margin-bottom:15px; border-radius:5px; border:1px solid var(--btn-orange);">
            <button onclick="startQuiz()" style="width:100%; padding:12px; background:var(--success); color:white; border:none; border-radius:8px; font-weight:bold;">BẮT ĐẦU THI</button>
        </div>
    </div>

    <div id="quiz-screen">
        <div id="quiz-content">
            </div>
        <div class="sidebar-right">
            <div>
                <h4 style="margin-bottom:10px; text-align:center; font-size: 0.8rem; color: #666;">SƠ ĐỒ CÂU HỎI</h4>
                <div id="nav-grid" style="display:grid; grid-template-columns: repeat(5, 1fr); gap:5px;"></div>
                <button onclick="submitQuiz()" style="width:100%; margin-top:15px; padding:10px; background:var(--caee-blue); color:white; border:none; border-radius:5px; font-weight:bold;">NỘP BÀI</button>
            </div>
        </div>
    </div>

    <script>
        // Các hàm JavaScript của bạn (giữ nguyên logic xử lý câu hỏi)
        function startQuiz() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('caee-header').style.display = 'flex';
            document.getElementById('quiz-screen').style.display = 'grid';
            renderQuestion(0);
        }

        function renderQuestion(idx) {
            let html = `
                <div id="question-layout" style="display: grid; grid-template-columns: 1fr 250px; gap: 15px;">
                    <div class="question-text">
                        <h3 style="margin-bottom:12px;">Câu ${idx+1}: Nội dung câu hỏi mẫu để kiểm tra hiển thị?</h3>
                        <div class="option-item">A. Đáp án A</div>
                        <div class="option-item">B. Đáp án B</div>
                        <div class="option-item">C. Đáp án C</div>
                        <div class="option-item">D. Đáp án D</div>
                    </div>
                    <div class="ai-side">
                        <div class="ai-box">
                            <img src="https://via.placeholder.com/400x225?text=Hinh+Anh+Minh+Hoa">
                        </div>
                    </div>
                </div>
                <div style="display:flex; justify-content:space-between; margin-top:15px;">
                    <button class="btn-nav" style="background:#6c757d;">TRƯỚC</button>
                    <button class="btn-nav">TIẾP THEO</button>
                </div>
            `;
            document.getElementById('quiz-content').innerHTML = html;
        }
    </script>
</body>
</html>
