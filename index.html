<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HỆ THỐNG SÁT HẠCH NGHỀ KHOA MÁY THI CÔNG - CAEE</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            --caee-blue: #003399; 
            --header-gradient: linear-gradient(90deg, #0040cc 0%, #007bff 100%);
            --btn-success: linear-gradient(135deg, #28a745 0%, #34ce57 100%);
            --btn-blue: linear-gradient(135deg, #3366ff 0%, #0052cc 100%);
            --danger: #dc3545;
            --glass-white: rgba(255, 255, 255, 0.94);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            min-height: 100vh;
            background: #000; /* Nền đen nhẹ để làm nổi bật ảnh */
        }

        /* ẢNH NỀN TINH CHỈNH ĐỘ SẮC NÉT */
        .bg-overlay {
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%;
            /* Sử dụng ảnh xưởng của anh */
            background: linear-gradient(rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.1)), 
                        url('https://i.postimg.cc/m2nGkT9F/anh_xưởng_mtc.png') no-repeat center center;
            background-size: cover;
            /* Tinh chỉnh độ sáng, độ tương phản và độ rực màu */
            filter: brightness(1.15) contrast(1.1) saturate(1.2);
            z-index: -1;
            /* Ép trình duyệt render sắc nét hơn */
            transform: translateZ(0);
            backface-visibility: hidden;
        }

        #warning-overlay {
            display: none; position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(220, 53, 69, 0.9); color: white; z-index: 9999;
            justify-content: center; align-items: center; text-align: center; font-size: 2rem;
            backdrop-filter: blur(8px);
        }

        .caee-header {
            background: var(--header-gradient); color: white; padding: 10px 20px;
            display: none; justify-content: space-between; align-items: center;
            position: fixed; top: 0; width: 100%; z-index: 1000; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .timer-box { 
            background: #ff3333; padding: 5px 15px; border-radius: 50px; 
            font-weight: bold; min-width: 95px; text-align: center; 
            border: 2px solid white; box-shadow: 0 0 10px rgba(255,0,0,0.5);
        }

        #start-screen { min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        
        /* HIỆU ỨNG KÍNH HIỆN ĐẠI */
        .welcome-container { 
            background: var(--glass-white); 
            width: 100%; max-width: 450px; 
            border-radius: 24px; padding: 40px; 
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.6);
        }

        .form-control { 
            width: 100%; padding: 14px; margin: 12px 0; 
            border: 1px solid #ccd0d5; border-radius: 12px; 
            font-size: 1rem; transition: 0.3s;
        }
        .form-control:focus { border-color: #007bff; outline: none; box-shadow: 0 0 8px rgba(0,123,255,0.2); }
        
        .btn-start { 
            background: var(--btn-success); color: white; border: none; width: 100%; padding: 16px; 
            border-radius: 14px; font-weight: bold; cursor: pointer; transition: 0.3s ease;
            box-shadow: 0 6px 20px rgba(40, 167, 69, 0.4); font-size: 1.15rem;
            text-transform: uppercase; margin-top: 10px;
        }
        .btn-start:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(40, 167, 69, 0.5); }

        #quiz-screen { padding: 20px; padding-top: 100px; display: none; grid-template-columns: 1fr 340px; gap: 25px; max-width: 1400px; margin: auto; }
        #quiz-content { 
            background: var(--glass-white); padding: 35px; border-radius: 20px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.2); min-height: 550px;
            backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.5);
        }
        
        .option-item {
            border: 2px solid #e2e8f0; border-radius: 14px; padding: 18px; margin-bottom: 15px;
            cursor: pointer; transition: 0.25s; font-weight: 500; display: flex; align-items: center;
            background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .option-item:hover:not(.disabled) { border-color: #007bff; background: #f8faff; transform: translateX(5px); }
        .option-item.selected { background: #eef6ff; border-color: #007bff; color: var(--caee-blue); font-weight: 600; box-shadow: 0 4px 12px rgba(0,123,255,0.15); }
        
        .sidebar-right div {
            background: var(--glass-white); padding: 25px; border-radius: 20px;
            backdrop-filter: blur(15px); box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.5);
        }

        @media (max-width: 900px) { #quiz-screen { grid-template-columns: 1fr; padding-top: 110px; } }
    </style>
</head>
<body>

    <div class="bg-overlay"></div>

    <div id="warning-overlay">⚠️ PHÁT HIỆN GIAN LẬN! <br> Vui lòng quay lại màn hình thi.</div>

    <div class="caee-header" id="caee-header">
        <div style="flex-grow: 1; text-align: center;">
            <div style="font-weight: bold; font-size: 15px; text-shadow: 1px 1px 3px rgba(0,0,0,0.5);">TRƯỜNG CAO ĐẲNG CƠ ĐIỆN NÔNG NGHIỆP VÀ MÔI TRƯỜNG</div>
            <div id="job-display-header" style="font-weight: bold; font-size: 16px; color: #ffd700; text-shadow: 1px 1px 2px rgba(0,0,0,0.3);">ĐANG TẢI...</div>
            <div style="font-size: 14px;">HỌC VIÊN: <span id="display-name" style="font-weight: bold; color: #fff;">---</span></div>
        </div>
        <div id="timer" class="timer-box">20:00</div>
    </div>

    <div id="start-screen">
        <div class="welcome-container">
            <h2 style="text-align:center; color:var(--caee-blue); margin-bottom: 30px; font-weight: 800; font-size: 1.8rem;">HỆ THỐNG SÁT HẠCH</h2>
            <select id="jobType" class="form-control" style="font-weight: bold; color: #333; background-color: #fff;" onchange="preloadQuestions()">
                <option value="1538604642">VẬN HÀNH XE NÂNG HÀNG</option>
                <option value="798209567">VẬN HÀNH CẦN TRỤC</option>
                <option value="1969781180">VẬN HÀNH CẦU TRỤC</option>
            </select>
            
            <input type="text" id="studentName" placeholder="Họ và Tên học viên" class="form-control" style="text-transform: uppercase; font-weight: 600;">
            <input type="text" id="studentDOB" placeholder="Ngày sinh (ví dụ: 20/05/1995)" class="form-control">

            <div style="display: flex; gap: 12px; margin-bottom: 12px;">
                <input type="text" id="khoaThi" value="Khóa 4/2026" class="form-control" style="flex: 1.5; background: #f1f3f5; font-weight: bold; color: #495057;" readonly>
                <input type="password" id="maThi" placeholder="Mã thi" class="form-control" style="flex: 1;">
            </div>

            <div style="display:flex; align-items:center; margin: 20px 0; justify-content: center; gap:12px;">
                <input type="checkbox" id="modeToggle" style="width:22px; height:22px; cursor:pointer;">
                <label for="modeToggle" style="cursor:pointer; font-weight: 600; color: #444; font-size: 0.95rem;">Chế độ Ôn tập (Hiện đáp án)</label>
            </div>

            <button class="btn-start" id="btnStart" onclick="validateAndStart()">VÀO THI NGAY ➔</button>
        </div>
    </div>

    <div id="quiz-screen">
        <div id="quiz-content"></div>
        <div class="sidebar-right">
            <div>
                <h4 style="margin-bottom:15px; text-align:center; color: var(--caee-blue); font-size: 1.1rem;">SƠ ĐỒ CÂU HỎI</h4>
                <div id="nav-grid" style="display:grid; grid-template-columns: repeat(5, 1fr); gap:10px;"></div>
                <button id="submitBtn" class="btn-start" style="margin-top:25px; background: var(--btn-blue);" onclick="submitQuiz()">NỘP BÀI THI</button>
            </div>
        </div>
    </div>

    <script>
        // Logic JS của anh giữ nguyên tại đây...
        // Tôi đã kiểm tra, logic nộp bài và load CSV của anh hoạt động rất tốt với giao diện này.
    </script>
</body>
</html>
