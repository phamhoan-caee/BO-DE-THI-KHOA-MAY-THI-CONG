<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HỆ THỐNG SÁT HẠCH NGHỀ - CAEE</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            --caee-blue: #003399;
            --header-blue: #0040cc;
            --btn-orange: #ff6600;
            --btn-blue: #3366ff;
            --success: #28a745;
            --danger: #dc3545;
            --light-bg: #f4f7fa;
            --glass: rgba(255, 255, 255, 0.85);
            --radius-lg: 24px;
            --radius-md: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--light-bg); 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            padding-top: 70px; 
            overflow-x: hidden;
            color: #333;
        }

        /* Navbar thông minh */
        .caee-header {
            background: var(--header-blue);
            color: white;
            padding: 8px 15px;
            display: none;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0; width: 100%;
            z-index: 1000;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
        }

        /* Đồng hồ trong suốt cố định góc phải */
        .timer-box { 
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 8px 18px;
            border-radius: var(--radius-md);
            font-weight: 800;
            border: 1px solid rgba(255,255,255,0.3);
            font-family: monospace;
            font-size: 1.1rem;
            position: relative;
        }

        /* Container & Khối nội dung bo góc lớn */
        #start-screen { min-height: 90vh; display: flex; justify-content: center; align-items: center; padding: 15px; }
        .welcome-container { 
            background: white; 
            width: 100%; max-width: 450px; 
            border-radius: var(--radius-lg); 
            padding: 30px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); 
        }

        .form-control { 
            width: 100%; padding: 14px; margin: 10px 0; 
            border: 1.5px solid #eee; border-radius: var(--radius-md); 
            font-size: 1rem; transition: var(--transition);
        }
        .form-control:focus { border-color: var(--btn-blue); outline: none; background: #fdfdff; }

        .btn-start { 
            background: var(--success); color: white; border: none; 
            width: 100%; padding: 16px; border-radius: var(--radius-lg); 
            font-weight: bold; cursor: pointer; transition: var(--transition);
            font-size: 1.1rem; box-shadow: 0 8px 20px rgba(40, 167, 69, 0.2);
        }
        .btn-start:active { transform: scale(0.96); opacity: 0.9; }

        /* Màn hình thi trắc nghiệm */
        #quiz-screen { padding: 15px; display: none; max-width: 1000px; margin: auto; }
        #quiz-content { 
            background: white; padding: 25px; 
            border-radius: var(--radius-lg); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.04); 
        }

        /* Câu hỏi & Đáp án tối ưu cảm ứng */
        .question-text { font-size: 1.15rem; font-weight: 700; margin-bottom: 20px; line-height: 1.4; color: var(--caee-blue); }
        
        .option-item {
            border: 2px solid #f0f0f0; border-radius: var(--radius-md); 
            padding: 18px; margin-bottom: 15px; /* Tăng khoảng cách để dễ bấm */
            cursor: pointer; transition: var(--transition); 
            display: flex; align-items: center; font-size: 1rem;
        }
        .option-item:hover { background: #f8faff; border-color: #d0e0ff; }
        .option-item.selected { 
            background: #eef4ff; border-color: var(--btn-blue); 
            box-shadow: 0 5px 15px rgba(51, 102, 255, 0.15); 
            transform: translateX(5px);
        }

        /* Nút điều hướng bo gọn */
        .nav-buttons { display: flex; justify-content: space-between; gap: 12px; margin-top: 25px; }
        .btn-nav { 
            flex: 1; padding: 14px; border-radius: var(--radius-md); 
            border: none; font-weight: bold; color: white; transition: var(--transition);
        }

        /* UI Đặc biệt cho Mobile */
        @media (max-width: 600px) {
            body { padding-top: 65px; }
            .caee-header { padding: 5px 10px; }
            .sidebar-right { display: none; } /* Loại bỏ sơ đồ câu hỏi trên điện thoại */
            .question-text { font-size: 1rem; }
            .option-item { padding: 14px; font-size: 0.95rem; margin-bottom: 10px; }
            .welcome-container { padding: 20px; border-radius: var(--radius-md); }
            .timer-box { font-size: 0.9rem; padding: 6px 12px; }
        }

        /* Desktop vẫn giữ sơ đồ */
        @media (min-width: 901px) {
            #quiz-screen { grid-template-columns: 1fr 280px; display: none; gap: 20px; }
            .sidebar-right { display: block; }
        }

        #result-screen {
            display: none; position: fixed; inset: 0;
            background: rgba(10, 20, 50, 0.95); backdrop-filter: blur(10px);
            z-index: 10000; justify-content: center; align-items: center; padding: 20px;
        }
        .result-card {
            background: white; width: 100%; max-width: 420px; border-radius: var(--radius-lg);
            padding: 40px; text-align: center; animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body oncontextmenu="return false">

    <div class="caee-header" id="caee-header">
        <div style="line-height: 1.2;">
            <div id="job-display-header" style="font-weight: bold; font-size: 0.75rem; color: #ffd700; text-transform: uppercase;">...</div>
            <div style="font-size: 0.85rem; font-weight: 600;"><span id="display-name">HỌC VIÊN</span></div>
        </div>
        <div id="timer" class="timer-box">20:00</div>
    </div>

    <div id="start-screen">
        <div class="welcome-container">
            <h2 style="text-align:center; color:var(--caee-blue); margin-bottom: 25px; font-weight: 800;">CAEE QUIZ</h2>
            <select id="jobType" class="form-control" style="font-weight: bold;" onchange="preloadQuestions()">
                <option value="1538604642">VẬN HÀNH XE NÂNG HÀNG</option>
                <option value="798209567">VẬN HÀNH CẦN TRỤC</option>
                <option value="1969781180">VẬN HÀNH CẦU TRỤC</option>
            </select>
            
            <input type="text" id="studentName" placeholder="HỌ VÀ TÊN" class="form-control" style="text-transform: uppercase;">
            <input type="text" id="studentDOB" placeholder="NGÀY SINH (DD/MM/YYYY)" class="form-control">

            <div style="display: flex; gap: 10px;">
                <input type="text" id="khoaThi" value="Tháng 4/2026" class="form-control" style="flex: 1.5; background: #f9f9f9;" readonly>
                <input type="password" id="maThi" placeholder="MÃ THI" class="form-control" style="flex: 1;">
            </div>

            <div style="display:flex; align-items:center; margin: 15px 0; justify-content: center; gap:10px;">
                <input type="checkbox" id="modeToggle" style="width:18px; height:18px; accent-color: var(--btn-blue);">
                <label for="modeToggle" style="cursor:pointer; font-weight: 600; font-size: 0.9rem;">Chế độ Ôn tập</label>
            </div>

            <button class="btn-start" id="btnStart" onclick="validateAndStart()">BẮT ĐẦU VÀO THI ➔</button>
        </div>
    </div>

    <div id="quiz-screen">
        <div id="quiz-content-wrapper">
            <div id="quiz-content"></div>
        </div>
        
        <div class="sidebar-right">
            <div style="background:white; padding:20px; border-radius:var(--radius-lg); box-shadow:0 5px 20px rgba(0,0,0,0.05);">
                <h4 style="margin-bottom:15px; text-align:center; font-size: 0.9rem;">SƠ ĐỒ CÂU HỎI</h4>
                <div id="nav-grid" style="display:grid; grid-template-columns: repeat(5, 1fr); gap:6px;"></div>
                <button class="btn-start" style="margin-top:20px; background:var(--caee-blue); padding: 12px;" onclick="submitQuiz()">NỘP BÀI</button>
            </div>
        </div>
    </div>

    <div id="result-screen">
        <div class="result-card">
            <h2 id="res-badge" style="font-size: 2rem; margin-bottom: 10px;">ĐẠT</h2>
            <p style="color: #666; margin-bottom: 20px;">Học viên: <b id="res-name">---</b></p>
            <div style="font-size: 3rem; font-weight: 900; color: var(--caee-blue); margin-bottom: 10px;">
                <span id="res-score">0</span><small style="font-size: 1rem; color: #999;">/30</small>
            </div>
            <button class="btn-start" style="background: var(--btn-blue);" onclick="location.reload()">THOÁT</button>
        </div>
    </div>

<script>
    const BASE_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR7h1KNottkL2N-DEBjkUVVlXLblXy25_x1UhqML8WQz3AWeWeXFuvkSQUb4Sxv5eaK5T-VJQEWh4wB/pub?output=csv&gid=";
    let allQuestions = [], selectedQuestions = [], studentAnswers = [];
    let currentIdx = 0, timeLeft = 1200, timerInterval, isSubmitted = false;

    window.onload = preloadQuestions;

    function preloadQuestions() {
        const gid = document.getElementById('jobType').value;
        Papa.parse(BASE_CSV_URL + gid, {
            download: true, header: true, skipEmptyLines: true,
            complete: function(results) {
                allQuestions = results.data.filter(i => i.CauHoi).map(i => ({
                    question: i.CauHoi,
                    options: [i.A, i.B, i.C, i.D].filter(o => o),
                    answer: i.DapAnDung ? i.DapAnDung.trim().toUpperCase() : "",
                    image: i["HINH ANH"] || "" 
                }));
            }
        });
    }

    function validateAndStart() {
        const name = document.getElementById('studentName').value.trim();
        const maThi = document.getElementById('maThi').value.trim();
        if(!name || !maThi) return alert("Vui lòng nhập Tên và Mã thi!");
        
        startQuiz();
    }

    function startQuiz() {
        if(allQuestions.length === 0) return alert("Dữ liệu đang tải...");
        selectedQuestions = allQuestions.sort(() => 0.5 - Math.random()).slice(0, 30);
        
        document.getElementById('display-name').innerText = document.getElementById('studentName').value.toUpperCase();
        document.getElementById('job-display-header').innerText = document.getElementById('jobType').options[document.getElementById('jobType').selectedIndex].text;
        
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('caee-header').style.display = 'flex';
        document.getElementById('quiz-screen').style.display = window.innerWidth > 900 ? 'grid' : 'block';
        
        showQuestion(0);
        startTimer();
    }

    function showQuestion(idx) {
        currentIdx = idx;
        const q = selectedQuestions[idx];
        const stored = studentAnswers.find(a => a.qIndex === idx);
        const labels = ['A', 'B', 'C', 'D'];

        let html = `<div class="question-text">Câu ${idx + 1}: ${q.question}</div>`;
        if(q.image) html += `<img src="${q.image}" style="width:100%; border-radius:15px; margin-bottom:15px;">`;

        q.options.forEach((opt, i) => {
            let cls = (stored && stored.selected === opt) ? "selected" : "";
            html += `<div class="option-item ${cls}" onclick="selectAns(${idx}, '${opt.replace(/'/g, "\\'")}')">
                        <b style="color:var(--btn-blue); margin-right:12px;">${labels[i]}.</b> ${opt}
                     </div>`;
        });

        html += `<div class="nav-buttons">
                    <button class="btn-nav" style="background:#8e9aaf;" onclick="changeQ(-1)" ${idx===0?'disabled':''}>TRƯỚC</button>
                    <button class="btn-nav" style="background:var(--btn-orange);" onclick="submitQuiz()">NỘP BÀI</button>
                    <button class="btn-nav" style="background:var(--btn-blue);" onclick="changeQ(1)" ${idx===29?'disabled':''}>TIẾP THEO</button>
                 </div>`;
        
        document.getElementById('quiz-content').innerHTML = html;
        if(window.innerWidth > 900) renderGrid();
    }

    function selectAns(qIdx, ans) {
        if(isSubmitted) return;
        const i = studentAnswers.findIndex(a => a.qIndex === qIdx);
        if(i > -1) studentAnswers[i].selected = ans;
        else studentAnswers.push({qIndex: qIdx, selected: ans});
        showQuestion(qIdx);
    }

    function changeQ(step) {
        let n = currentIdx + step;
        if(n >= 0 && n < 30) showQuestion(n);
    }

    function renderGrid() {
        const grid = document.getElementById('nav-grid');
        grid.innerHTML = "";
        selectedQuestions.forEach((_, i) => {
            const hasAns = studentAnswers.some(a => a.qIndex === i);
            const active = i === currentIdx ? 'border:2px solid var(--btn-orange);' : '';
            const bg = hasAns ? 'background:var(--caee-blue); color:white;' : 'background:#f0f0f0;';
            grid.innerHTML += `<div onclick="showQuestion(${i})" style="height:35px; display:flex; justify-content:center; align-items:center; border-radius:8px; cursor:pointer; font-size:0.8rem; font-weight:bold; ${bg} ${active}">${i+1}</div>`;
        });
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            timeLeft--;
            let m = Math.floor(timeLeft/60), s = timeLeft%60;
            document.getElementById('timer').innerText = `${m}:${s<10?'0':''}${s}`;
            if(timeLeft <= 0) submitQuiz(true);
        }, 1000);
    }

    function submitQuiz(auto = false) {
        if(!auto && !confirm("BẠN MUỐN NỘP BÀI?")) return;
        isSubmitted = true; clearInterval(timerInterval);
        let score = 0;
        selectedQuestions.forEach((q, i) => {
            const ans = studentAnswers.find(a => a.qIndex === i);
            if(ans && ['A','B','C','D'][q.options.indexOf(ans.selected)] === q.answer) score++;
        });
        document.getElementById('res-score').innerText = score;
        document.getElementById('res-name').innerText = document.getElementById('studentName').value.toUpperCase();
        document.getElementById('res-badge').innerText = score >= 25 ? "ĐẠT" : "KHÔNG ĐẠT";
        document.getElementById('res-badge').style.color = score >= 25 ? "var(--success)" : "var(--danger)";
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('caee-header').style.display = 'none';
        document.getElementById('result-screen').style.display = 'flex';
    }
</script>
</body>
</html>
