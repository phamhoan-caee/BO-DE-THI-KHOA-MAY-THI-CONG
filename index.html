<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HỆ THỐNG SÁT HẠCH NGHỀ KHOA MÁY THI CÔNG - CAEE</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            --caee-blue: #003399; 
            --header-gradient: linear-gradient(90deg, #0040cc 0%, #007bff 100%);
            --btn-success: linear-gradient(135deg, #28a745 0%, #34ce57 100%);
            --btn-blue: linear-gradient(135deg, #3366ff 0%, #0052cc 100%);
            --danger: #dc3545;
            --glass-white: rgba(255, 255, 255, 0.96);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            min-height: 100vh;
            background: #000;
            overflow-x: hidden;
        }

        /* ẢNH NỀN SIÊU SÁNG & SẮC NÉT (OPTIMIZED FOR MOBILE & PC) */
        .bg-overlay {
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%;
            background: linear-gradient(rgba(255, 255, 255, 0.1), rgba(0, 0, 0, 0.05)), 
                        url('https://i.postimg.cc/m2nGkT9F/anh_xưởng_mtc.png') no-repeat center center;
            background-size: cover;
            /* Bộ lọc tăng cường độ sáng và độ nét cực đại */
            filter: brightness(1.25) contrast(1.2) saturate(1.3);
            z-index: -1;
            image-rendering: -webkit-optimize-contrast;
            transform: translateZ(0);
        }

        #warning-overlay {
            display: none; position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(220, 53, 69, 0.96); color: white; z-index: 9999;
            justify-content: center; align-items: center; text-align: center; font-size: 1.5rem;
            backdrop-filter: blur(15px); padding: 20px; font-weight: bold;
        }

        .caee-header {
            background: var(--header-gradient); color: white; padding: 10px 15px;
            display: none; justify-content: space-between; align-items: center;
            position: fixed; top: 0; width: 100%; z-index: 1000; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .timer-box { 
            background: #ff0000; padding: 6px 12px; border-radius: 50px; 
            font-weight: bold; min-width: 85px; text-align: center; 
            border: 2px solid white; font-size: 1.1rem; box-shadow: 0 0 15px rgba(255,0,0,0.4);
        }

        /* FORM ĐĂNG NHẬP */
        #start-screen { min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 15px; }
        
        .welcome-container { 
            background: var(--glass-white); 
            width: 100%; max-width: 420px; 
            border-radius: 25px; padding: 35px 25px; 
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.8);
        }

        .form-control { 
            width: 100%; padding: 14px; margin: 10px 0; 
            border: 1px solid #c8ced4; border-radius: 12px; 
            font-size: 16px; transition: 0.3s;
        }
        .form-control:focus { border-color: var(--caee-blue); outline: none; box-shadow: 0 0 10px rgba(0,51,153,0.1); }
        
        .btn-start { 
            background: var(--btn-success); color: white; border: none; width: 100%; padding: 16px; 
            border-radius: 15px; font-weight: bold; cursor: pointer; transition: 0.3s;
            box-shadow: 0 8px 20px rgba(40, 167, 69, 0.4); font-size: 1.2rem;
            text-transform: uppercase; margin-top: 15px;
        }
        .btn-start:active { transform: scale(0.98); }

        /* MÀN HÌNH CÂU HỎI */
        #quiz-screen { 
            padding: 15px; padding-top: 95px; display: none; 
            grid-template-columns: 1fr 340px; gap: 20px; max-width: 1300px; margin: auto; 
        }
        
        #quiz-content { 
            background: var(--glass-white); padding: 25px; border-radius: 20px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.25); min-height: 500px;
            backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.6);
        }

        .option-item {
            border: 2px solid #e2e8f0; border-radius: 15px; padding: 16px; margin-bottom: 12px;
            background: white; font-size: 1rem; transition: 0.2s; cursor: pointer;
            display: flex; align-items: center;
        }
        .option-item.selected { background: #eef6ff; border-color: #007bff; color: var(--caee-blue); font-weight: 600; box-shadow: 0 4px 12px rgba(0,123,255,0.1); }
        
        .option-item.correct { background: #d4edda !important; border-color: #28a745 !important; color: #155724 !important; }
        .option-item.wrong { background: #f8d7da !important; border-color: #dc3545 !important; color: #721c24 !important; }

        .q-image-box img { max-width: 100%; border-radius: 15px; margin: 15px 0; border: 4px solid #fff; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }

        /* SIDEBAR SƠ ĐỒ CÂU HỎI */
        .sidebar-right div {
            background: var(--glass-white); padding: 25px; border-radius: 20px;
            backdrop-filter: blur(20px); box-shadow: 0 10px 40px rgba(0,0,0,0.25);
            border: 1px solid rgba(255,255,255,0.6);
        }

        /* KẾT QUẢ */
        #result-screen {
            display: none; position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.85); z-index: 10000; justify-content: center; align-items: center; padding: 20px;
            backdrop-filter: blur(15px);
        }
        .result-card {
            background: white; width: 100%; max-width: 450px; border-radius: 30px;
            padding: 40px 20px; text-align: center; box-shadow: 0 25px 60px rgba(0,0,0,0.5);
        }

        /* RESPONSIVE */
        @media (max-width: 900px) {
            #quiz-screen { grid-template-columns: 1fr; padding-top: 100px; }
            .sidebar-right { display: none; }
            .caee-header { padding: 5px 10px; }
            .caee-header div div { font-size: 11px !important; }
            h3 { font-size: 1.1rem; }
        }
    </style>
</head>
<body oncontextmenu="return false">

    <div class="bg-overlay"></div>

    <div id="warning-overlay">⚠️ PHÁT HIỆN GIAN LẬN!<br>Hệ thống sẽ nộp bài nếu bạn rời trang lần nữa.</div>

    <div class="caee-header" id="caee-header">
        <div style="flex-grow: 1; text-align: center;">
            <div style="font-weight: bold; font-size: 13px; text-shadow: 1px 1px 2px rgba(0,0,0,0.4);">TRƯỜNG CAO ĐẲNG CƠ ĐIỆN NÔNG NGHIỆP VÀ MÔI TRƯỜNG</div>
            <div id="job-display-header" style="font-weight: bold; font-size: 15px; color: #ffd700;">ĐANG TẢI...</div>
            <div style="font-size: 13px;">HỌC VIÊN: <span id="display-name" style="font-weight: bold; color: #fff;">---</span></div>
        </div>
        <div id="timer" class="timer-box">20:00</div>
    </div>

    <div id="start-screen">
        <div class="welcome-container">
            <h2 style="text-align:center; color:var(--caee-blue); margin-bottom: 25px; font-weight: 800; font-size: 1.7rem;">HỆ THỐNG SÁT HẠCH</h2>
            
            <select id="jobType" class="form-control" style="font-weight: bold; color: #333;" onchange="preloadQuestions()">
                <option value="1538604642">VẬN HÀNH XE NÂNG HÀNG</option>
                <option value="798209567">VẬN HÀNH CẦN TRỤC</option>
                <option value="1969781180">VẬN HÀNH CẦU TRỤC</option>
            </select>
            
            <input type="text" id="studentName" placeholder="Họ và Tên học viên" class="form-control" style="text-transform: uppercase; font-weight: 600;">
            <input type="text" id="studentDOB" placeholder="Ngày sinh (ví dụ: 20/05/1995)" class="form-control">

            <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                <input type="text" id="khoaThi" value="Khóa 4/2026" class="form-control" style="flex: 1.5; background: #f8f9fa; font-weight: bold;" readonly>
                <input type="password" id="maThi" placeholder="Mã thi" class="form-control" style="flex: 1;">
            </div>

            <div style="display:flex; align-items:center; margin: 15px 0; justify-content: center; gap:12px;">
                <input type="checkbox" id="modeToggle" style="width:22px; height:22px; cursor:pointer;">
                <label for="modeToggle" style="cursor:pointer; font-weight: 600; color: #444;">Chế độ Ôn tập (Hiện đáp án)</label>
            </div>

            <button class="btn-start" id="btnStart" onclick="validateAndStart()">VÀO THI NGAY ➔</button>
        </div>
    </div>

    <div id="quiz-screen">
        <div id="quiz-content"></div>
        <div class="sidebar-right">
            <div>
                <h4 style="margin-bottom:15px; text-align:center; color: var(--caee-blue);">SƠ ĐỒ CÂU HỎI</h4>
                <div id="nav-grid" style="display:grid; grid-template-columns: repeat(5, 1fr); gap:10px;"></div>
                <button id="submitBtn" class="btn-start" style="margin-top:25px; background: var(--btn-blue);" onclick="submitQuiz()">NỘP BÀI THI</button>
            </div>
        </div>
    </div>

    <div id="result-screen">
        <div class="result-card">
            <h2 style="color: var(--caee-blue); margin-bottom: 15px;">KẾT QUẢ SÁT HẠCH</h2>
            <div style="margin-bottom: 20px; font-size: 1.1rem; line-height: 1.6;">
                Học viên: <b id="res-name" style="color: #d63384;">---</b><br>
                Ngày sinh: <span id="res-dob">---</span><br>
                Khóa: <span id="res-id">---</span>
            </div>
            <div style="font-size: 3rem; font-weight: 800; color: var(--caee-blue); margin-bottom: 10px;">
                <span id="res-score">0</span><small style="font-size: 1rem; color: #666;">/30</small>
            </div>
            <div id="res-badge" style="display: inline-block; padding: 12px 40px; border-radius: 50px; color: white; font-weight: bold; font-size: 1.4rem; margin-bottom: 20px;">---</div>
            <p style="color: #666; font-size: 0.9rem;">Trang web sẽ tự tải lại sau <span id="countdown">10</span> giây...</p>
        </div>
    </div>

    <script>
        const BASE_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR7h1KNottkL2N-DEBjkUVVlXLblXy25_x1UhqML8WQz3AWeWeXFuvkSQUb4Sxv5eaK5T-VJQEWh4wB/pub?output=csv&gid=";
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwmpU33n1oc5US8h-XE9F9QdVUsFFwHuFrXS0DlubJaApctwaPMxIw9wIwtGy88xPw4pQ/exec";
        
        let allQuestions = [], selectedQuestions = [], studentAnswers = [];
        let currentQuestionIndex = 0, timeLeft = 1200, timerInterval, isSubmitted = false, cheatCount = 0;

        window.onload = preloadQuestions;

        function preloadQuestions() {
            const gid = document.getElementById('jobType').value;
            Papa.parse(BASE_CSV_URL + gid, {
                download: true, header: true, skipEmptyLines: true,
                complete: function(results) {
                    allQuestions = results.data.filter(i => i.CauHoi).map(i => ({
                        question: i.CauHoi,
                        options: [i.A, i.B, i.C, i.D].filter(o => o),
                        answer: i.DapAnDung ? i.DapAnDung.trim().toUpperCase() : "",
                        explanation: i.Giaithich || "Thực hiện đúng quy trình kỹ thuật vận hành và an toàn.",
                        image: i["HINH ANH"] || "" 
                    }));
                }
            });
        }

        async function validateAndStart() {
            const maThi = document.getElementById('maThi').value.trim();
            const name = document.getElementById('studentName').value.trim();
            const dob = document.getElementById('studentDOB').value.trim();
            
            if(!name || !maThi || !dob) return alert("Vui lòng nhập đầy đủ thông tin học viên!");

            const btn = document.getElementById('btnStart');
            btn.disabled = true; btn.innerText = "ĐANG XÁC THỰC...";

            try {
                const res = await fetch(`${WEB_APP_URL}?action=checkCode&code=${maThi}`);
                const result = await res.json();
                if(result.isValid) startQuiz();
                else { alert("Mã thi không chính xác!"); btn.disabled = false; btn.innerText = "VÀO THI NGAY ➔"; }
            } catch(e) { startQuiz(); }
        }

        function startQuiz() {
            if(allQuestions.length === 0) return alert("Đang tải dữ liệu, vui lòng đợi vài giây...");
            selectedQuestions = allQuestions.sort(() => 0.5 - Math.random()).slice(0, 30);
            
            document.getElementById('display-name').innerText = document.getElementById('studentName').value.toUpperCase();
            document.getElementById('job-display-header').innerText = document.getElementById('jobType').options[document.getElementById('jobType').selectedIndex].text;
            
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('caee-header').style.display = 'flex';
            document.getElementById('quiz-screen').style.display = 'grid';
            
            showQuestion(0);
            startTimer();
        }

        function showQuestion(idx) {
            currentQuestionIndex = idx;
            const q = selectedQuestions[idx];
            const stored = studentAnswers.find(a => a.qIndex === idx);
            const isPractice = document.getElementById('modeToggle').checked;
            const labels = ['A', 'B', 'C', 'D'];

            let html = `<h3 style="margin-bottom:15px; color:#333;">Câu ${idx + 1}: ${q.question}</h3>`;
            if(q.image) html += `<div class="q-image-box"><img src="${q.image}"></div>`;

            q.options.forEach((opt, i) => {
                let cls = "";
                const isSelected = stored && opt === stored.selected;
                if(isPractice && stored) {
                    if(labels[i] === q.answer) cls = "correct";
                    else if(isSelected) cls = "wrong";
                } else if(isSelected) cls = "selected";

                html += `<div class="option-item ${cls}" onclick="selectAns(${idx}, '${opt.replace(/'/g, "\\'")}')">
                            <b style="margin-right:10px;">${labels[i]}.</b> ${opt}
                         </div>`;
            });

            if(isPractice && stored) {
                html += `<div style="background:#fff3cd; padding:15px; border-radius:12px; margin-top:15px; border-left:5px solid #ffc107;">
                            <b>Giải thích:</b> ${q.explanation}
                         </div>`;
            }
            
            html += `<div style="display:flex; justify-content:space-between; margin-top:25px; gap:10px;">
                        <button class="btn-start" style="width:50%; background:#6c757d; margin:0;" onclick="showQuestion(${idx-1})" ${idx===0?'disabled':''}>LÙI LẠI</button>
                        <button class="btn-start" style="width:50%; background:var(--caee-blue); margin:0;" onclick="showQuestion(${idx+1})" ${idx===29?'disabled':''}>TIẾP THEO</button>
                     </div>`;
            document.getElementById('quiz-content').innerHTML = html;
            renderGrid();
        }

        function selectAns(qIdx, ans) {
            if(isSubmitted) return;
            const i = studentAnswers.findIndex(a => a.qIndex === qIdx);
            if(i > -1) studentAnswers[i].selected = ans;
            else studentAnswers.push({qIndex: qIdx, selected: ans});
            showQuestion(qIdx);
        }

        function renderGrid() {
            const grid = document.getElementById('nav-grid');
            if(!grid) return;
            grid.innerHTML = "";
            selectedQuestions.forEach((_, i) => {
                const hasAns = studentAnswers.some(a => a.qIndex === i);
                const active = i === currentQuestionIndex ? 'border:3px solid #ff6600; transform: scale(1.1);' : '';
                const bg = hasAns ? 'background:var(--caee-blue); color:white;' : 'background:white; color:#333;';
                grid.innerHTML += `<div onclick="showQuestion(${i})" style="height:42px; display:flex; justify-content:center; align-items:center; border-radius:8px; cursor:pointer; font-weight:bold; box-shadow: 0 2px 5px rgba(0,0,0,0.1); ${bg} ${active}">${i+1}</div>`;
            });
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                let m = Math.floor(timeLeft/60), s = timeLeft%60;
                document.getElementById('timer').innerText = `${m}:${s<10?'0':''}${s}`;
                if(timeLeft <= 0) submitQuiz(true);
            }, 1000);
        }

        async function submitQuiz(auto = false) {
            if(isSubmitted) return;
            if(!auto && !confirm("Bạn có chắc chắn muốn nộp bài thi ngay?")) return;
            isSubmitted = true; clearInterval(timerInterval);

            let score = 0;
            selectedQuestions.forEach((q, i) => {
                const ans = studentAnswers.find(a => a.qIndex === i);
                if(ans && ['A','B','C','D'][q.options.indexOf(ans.selected)] === q.answer) score++;
            });

            const status = score >= 25 ? "ĐẠT YÊU CẦU" : "KHÔNG ĐẠT";
            const sName = document.getElementById('studentName').value.toUpperCase();
            const sDOB = document.getElementById('studentDOB').value;
            const kThi = document.getElementById('khoaThi').value;

            document.getElementById('res-name').innerText = sName;
            document.getElementById('res-dob').innerText = sDOB;
            document.getElementById('res-id').innerText = kThi;
            document.getElementById('res-score').innerText = score;
            document.getElementById('res-badge').innerText = status;
            document.getElementById('res-badge').style.background = score >= 25 ? "#28a745" : "#dc3545";
            
            document.getElementById('quiz-screen').style.display = 'none';
            document.getElementById('caee-header').style.display = 'none';
            document.getElementById('result-screen').style.display = 'flex';

            // Gửi kết quả về Google Sheets
            const formData = new URLSearchParams();
            formData.append('name', sName);
            formData.append('birthDate', sDOB);
            formData.append('khoaThi', kThi);
            formData.append('jobName', document.getElementById('job-display-header').innerText);
            formData.append('score', score);
            formData.append('status', status);
            formData.append('mode', document.getElementById('modeToggle').checked ? "ON_TAP" : "SAT_HACH");
            formData.append('cheat', cheatCount);

            fetch(WEB_APP_URL, { method: "POST", mode: "no-cors", body: formData });

            let c = 10;
            const countInt = setInterval(() => { c--; document.getElementById('countdown').innerText = c; if(c<=0) { clearInterval(countInt); location.reload(); } }, 1000);
        }

        window.onblur = () => { 
            if(!isSubmitted && selectedQuestions.length > 0) {
                cheatCount++;
                document.getElementById('warning-overlay').style.display = 'flex';
                if(cheatCount >= 3) submitQuiz(true);
            }
        };
        window.onfocus = () => { document.getElementById('warning-overlay').style.display = 'none'; };
    </script>
</body>
</html>
