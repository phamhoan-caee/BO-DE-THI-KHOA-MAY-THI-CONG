<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HỆ THỐNG SÁT HẠCH - CAEE</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            --caee-blue: #003399; --header-blue: rgba(0, 64, 204, 0.9);
            --btn-orange: #ff6600; --btn-blue: #3366ff;
            --success: #28a745; --danger: #dc3545;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }

        body { 
            background: #f0f2f5 url('https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?q=80&w=2070&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* HEADER ẨN/HIỆN */
        .caee-header {
            position: fixed; top: 0; left: 0; right: 0;
            background: var(--header-blue); color: white; 
            padding: env(safe-area-inset-top) 15px 10px 15px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 1000; transition: transform 0.3s ease;
            backdrop-filter: blur(10px);
        }
        .header-hidden { transform: translateY(-100%); }

        .timer-box { background: #ff3333; padding: 5px 10px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; }

        /* VÙNG CHỨA NỘI DUNG THI */
        #quiz-screen { 
            flex: 1; display: none; flex-direction: column;
            padding-top: calc(60px + env(safe-area-inset-top)); /* Chừa chỗ cho header */
            padding-bottom: env(safe-area-inset-bottom);
            height: 100%;
        }

        #quiz-scroll-area {
            flex: 1; overflow-y: auto; padding: 10px;
            -webkit-overflow-scrolling: touch;
        }

        #quiz-content {
            background: rgba(255, 255, 255, 0.92);
            border-radius: 15px; padding: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 600px; margin: 0 auto;
        }

        /* ẢNH LUÔN NẰM TRÊN CÂU HỎI */
        .ai-box {
            width: 100%; height: auto; max-height: 220px;
            background: #000; border-radius: 10px;
            margin-bottom: 15px; overflow: hidden;
        }
        .ai-box img { width: 100%; height: 100%; object-fit: contain; }

        .question-text { font-size: 1.1rem; font-weight: 600; color: #333; margin-bottom: 15px; line-height: 1.4; }

        .option-item {
            border: 1px solid #ddd; border-radius: 10px; padding: 12px 15px; margin-bottom: 10px;
            cursor: pointer; background: white; font-size: 1rem; transition: 0.2s;
        }
        .option-item.selected { background: #e7f0ff; border-color: var(--btn-blue); color: var(--caee-blue); font-weight: bold; }

        /* ĐIỀU HƯỚNG CỐ ĐỊNH PHÍA DƯỚI */
        .nav-footer {
            background: white; padding: 10px 15px calc(10px + env(safe-area-inset-bottom));
            display: flex; gap: 10px; border-top: 1px solid #eee;
        }

        .btn-nav { 
            flex: 1; padding: 12px; border-radius: 10px; border: none;
            font-weight: bold; font-size: 1rem; color: white;
        }

        /* MÀN HÌNH CHÀO */
        .welcome-container {
            background: rgba(255, 255, 255, 0.95); padding: 25px; border-radius: 20px;
            width: 90%; max-width: 380px; margin: auto;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div class="caee-header" id="mainHeader">
        <div>
            <div id="job-display-header" style="color: #ffd700; font-size: 11px; font-weight: bold; text-transform: uppercase;">XE NÂNG HÀNG</div>
            <div style="font-size: 12px;">Học viên: <span id="display-name" style="font-weight: bold;">---</span></div>
        </div>
        <div id="timer" class="timer-box">20:00</div>
    </div>

    <div id="start-screen" style="display: flex; height: 100vh; align-items: center; z-index: 2000; position: relative;">
        <div class="welcome-container">
            <h2 style="text-align:center; color:var(--caee-blue); margin-bottom: 20px;">SÁT HẠCH CAEE</h2>
            <select id="jobType" style="width:100%; padding:12px; margin-bottom:12px; border-radius:10px; border:1px solid #ccc;">
                <option value="1538604642">VẬN HÀNH XE NÂNG HÀNG</option>
                <option value="798209567">VẬN HÀNH CẦN TRỤC</option>
                <option value="1969781180">VẬN HÀNH CẦU TRỤC</option>
            </select>
            <input type="text" id="studentName" placeholder="HỌ VÀ TÊN" style="width:100%; padding:12px; margin-bottom:12px; border-radius:10px; border:1px solid #ccc; text-transform: uppercase;">
            <input type="password" id="maThi" placeholder="Mã thi" style="width:100%; padding:12px; margin-bottom:20px; border-radius:10px; border:2px solid var(--btn-orange);">
            <button class="btn-nav" style="background:var(--success); width:100%;" onclick="startQuiz()">BẮT ĐẦU THI ➔</button>
        </div>
    </div>

    <div id="quiz-screen">
        <div id="quiz-scroll-area">
            <div id="quiz-content">
                </div>
        </div>
        
        <div class="nav-footer">
            <button class="btn-nav" style="background:#6c757d;" onclick="prevQuestion()">TRƯỚC</button>
            <button class="btn-nav" style="background:var(--btn-blue);" onclick="nextQuestion()">TIẾP THEO</button>
            <button class="btn-nav" style="background:var(--danger); flex: 0.6;" onclick="submitQuiz()">NỘP</button>
        </div>
    </div>

    <script>
        let allQuestions = [], studentAnswers = [], currentIdx = 0;
        let lastScrollTop = 0;

        // Logic ẩn hiện Header khi cuộn
        document.getElementById('quiz-scroll-area').addEventListener('scroll', function() {
            let st = this.scrollTop;
            let header = document.getElementById('mainHeader');
            if (st > lastScrollTop && st > 50) {
                header.classList.add('header-hidden');
            } else {
                header.classList.remove('header-hidden');
            }
            lastScrollTop = st;
        });

        function startQuiz() {
            const name = document.getElementById('studentName').value;
            if(!name) return alert("Nhập tên!");
            
            document.getElementById('display-name').innerText = name.toUpperCase();
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('quiz-screen').style.display = 'flex';
            
            // Giả lập dữ liệu để test giao diện
            allQuestions = Array(30).fill({
                question: "Tại sao người vận hành phải giảm tốc độ và bấm còi khi đi qua khu vực khuất, ngã tư hoặc góc cua trong nhà kho?",
                options: ["Để thu hút sự chú ý", "Để cảnh báo người đi bộ và phương tiện khác", "Để hoàn thành bài thi nhanh hơn", "Vì đó là quy định không bắt buộc"],
                image: "https://i.imgur.com/8YvLhJp.jpg"
            });
            showQuestion(0);
        }

        function showQuestion(idx) {
            currentIdx = idx;
            const q = allQuestions[idx];
            const stored = studentAnswers[idx];
            
            let html = `
                <div style="font-size: 0.8rem; color: var(--caee-blue); margin-bottom: 5px; font-weight: bold;">CÂU HỎI ${idx + 1}/30</div>
                <div class="ai-box"><img src="${q.image}"></div>
                <div class="question-text">${q.question}</div>
                <div id="options">
            `;

            q.options.forEach((opt, i) => {
                let sel = stored === i ? "selected" : "";
                html += `<div class="option-item ${sel}" onclick="selectOpt(${i})">
                            <b>${String.fromCharCode(65+i)}.</b> ${opt}
                         </div>`;
            });

            html += `</div>`;
            document.getElementById('quiz-content').innerHTML = html;
            document.getElementById('quiz-scroll-area').scrollTop = 0;
        }

        function selectOpt(optIdx) {
            studentAnswers[currentIdx] = optIdx;
            showQuestion(currentIdx);
        }

        function nextQuestion() { if(currentIdx < 29) showQuestion(currentIdx + 1); }
        function prevQuestion() { if(currentIdx > 0) showQuestion(currentIdx - 1); }

        function submitQuiz() {
            if(confirm("Bạn có chắc chắn muốn nộp bài?")) location.reload();
        }
    </script>
</body>
</html>
