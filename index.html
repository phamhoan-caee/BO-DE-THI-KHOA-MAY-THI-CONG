<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HỆ THỐNG SÁT HẠCH NGHỀ KHOA MÁY THI CÔNG - CAEE</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            --caee-blue: #003399; --header-blue: #0040cc;
            --btn-orange: #ff6600; --btn-blue: #3366ff;
            --success: #28a745; --danger: #dc3545;
            --light-bg: #f0f2f5;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background-color: var(--light-bg); font-family: 'Segoe UI', Arial, sans-serif; overflow-x: hidden; }

        /* THANH TIẾN TRÌNH MỚI */
        #progress-container {
            display: none; width: 100%; background: #e0e0e0; position: fixed; top: 0; z-index: 1000; height: 25px;
        }
        #progress-bar {
            width: 0%; height: 100%; background: var(--success); text-align: center; 
            line-height: 25px; color: white; font-weight: bold; font-size: 14px; transition: width 0.3s ease;
        }

        /* THÔNG TIN PHỤ DƯỚI THANH TIẾN TRÌNH */
        .sub-header {
            display: none; justify-content: space-between; align-items: center; padding: 5px 15px;
            background: #fff; border-bottom: 1px solid #ddd; position: fixed; top: 25px; width: 100%; z-index: 999;
        }
        .timer-box { background: #ff3333; color: white; padding: 2px 10px; border-radius: 4px; font-weight: bold; }

        /* TỐI ƯU KHI XOAY NGANG (LANDSCAPE) */
        @media screen and (orientation: landscape) {
            #progress-container { height: 18px; }
            #progress-bar { line-height: 18px; font-size: 11px; }
            .sub-header { top: 18px; padding: 2px 10px; font-size: 12px; }
            body { padding-top: 45px !important; }
            #quiz-screen { padding: 5px !important; gap: 10px !important; }
            #quiz-content { padding: 15px !important; }
            h3 { font-size: 1.1rem !important; margin-bottom: 10px !important; }
            .option-item { padding: 8px 12px !important; margin-bottom: 5px !important; font-size: 0.95rem !important; }
            .q-image-box img { max-height: 150px; width: auto; }
        }

        /* CSS GIỮ NGUYÊN TỪ BẢN CŨ */
        #warning-overlay {
            display: none; position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(220, 53, 69, 0.9); color: white; z-index: 9999;
            justify-content: center; align-items: center; text-align: center; font-size: 2rem;
        }
        #start-screen { min-height: 80vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .welcome-container { background: white; width: 95%; max-width: 450px; border-radius: 15px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .form-control { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; }
        .btn-start { background: var(--success); color: white; border: none; width: 100%; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 1.1rem; }
        #quiz-screen { padding: 20px; display: none; grid-template-columns: 1fr 320px; gap: 20px; max-width: 1300px; margin: auto; padding-top: 80px; }
        #quiz-content { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .option-item { border: 2px solid #eee; border-radius: 8px; padding: 15px; margin-bottom: 12px; cursor: pointer; display: flex; align-items: center; }
        .option-item.selected { background: #e7f0ff; border-color: var(--btn-blue); }
        .option-item.correct { background: #d4edda !important; border-color: #28a745 !important; }
        .option-item.wrong { background: #f8d7da !important; border-color: #dc3545 !important; }
        #result-screen { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); z-index: 10000; justify-content: center; align-items: center; }
        .result-card { background: white; width: 90%; max-width: 500px; border-radius: 24px; padding: 30px; text-align: center; }
        .score-circle { width: 100px; height: 100px; border-radius: 50%; border: 8px solid #eee; margin: 10px auto; display: flex; flex-direction: column; justify-content: center; font-size: 1.8rem; font-weight: bold; }
        .status-badge { display: inline-block; padding: 8px 25px; border-radius: 50px; color: white; font-weight: bold; margin: 10px 0; }
        @media (max-width: 900px) { #quiz-screen { grid-template-columns: 1fr; } .sidebar-right { display: none; } }
    </style>
</head>
<body oncontextmenu="return false">

    <div id="warning-overlay">⚠️ GIAN LẬN!</div>

    <div id="progress-container">
        <div id="progress-bar">0%</div>
    </div>
    <div class="sub-header" id="sub-header">
        <div style="font-size: 13px;"><b>Học viên:</b> <span id="display-name">---</span></div>
        <div id="timer" class="timer-box">20:00</div>
    </div>

    <div id="start-screen">
        <div class="welcome-container">
            <div style="text-align: center; margin-bottom: 20px;">
                <div style="font-size: 16px; color: #1a73e8; font-weight: bold;">TRƯỜNG CĐ CƠ ĐIỆN NÔNG NGHIỆP VÀ MÔI TRƯỜNG</div>
                <div style="font-size: 15px; color: #d32f2f; font-weight: 800; margin-top: 5px; text-transform: uppercase;">KHOA MÁY THI CÔNG</div>
                <div style="font-size: 14px; color: #555; margin-top: 5px; font-weight: bold; text-transform: uppercase;">TỔ CẦN, CẦU TRỤC</div>
            </div>
            <select id="jobType" class="form-control" style="font-weight: bold;" onchange="preloadQuestions()">
                <option value="1538604642">VẬN HÀNH XE NÂNG HÀNG</option>
                <option value="798209567">VẬN HÀNH CẦN TRỤC</option>
                <option value="1969781180">VẬN HÀNH CẦU TRỤC</option>
            </select>
            <input type="text" id="studentName" placeholder="HỌ VÀ TÊN HỌC VIÊN" class="form-control" style="text-transform: uppercase;">
            <input type="text" id="studentDOB" placeholder="Ngày/tháng/năm sinh" class="form-control">
            <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                <input type="text" id="khoaThi" value="Tháng 4/2026" class="form-control" style="flex: 1.5; background: #eee; font-weight: bold;" readonly>
                <input type="password" id="maThi" placeholder="Mã thi" class="form-control" style="flex: 1;">
            </div>
            <div style="display:flex; align-items:center; margin: 15px 0; justify-content: center; gap:10px;">
                <input type="checkbox" id="modeToggle" style="width:20px; height:20px;">
                <label for="modeToggle" style="cursor:pointer; font-weight: 600;">Chế độ Ôn tập</label>
            </div>
            <button class="btn-start" id="btnStart" onclick="validateAndStart()">VÀO THI NGAY ➔</button>
        </div>
    </div>

    <div id="quiz-screen">
        <div id="quiz-content"></div>
        <div class="sidebar-right">
            <div style="background:white; padding:20px; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.05);">
                <h4 style="margin-bottom:15px; text-align:center;">SƠ ĐỒ CÂU HỎI</h4>
                <div id="nav-grid" style="display:grid; grid-template-columns: repeat(5, 1fr); gap:8px;"></div>
                <button id="submitBtn" class="btn-start" style="margin-top:20px; background-color: var(--caee-blue);" onclick="submitQuiz()">NỘP BÀI</button>
            </div>
        </div>
    </div>

    <div id="result-screen">
        <div class="result-card">
            <div style="font-weight: bold; color: var(--caee-blue); margin-bottom: 10px;">KẾT QUẢ SÁT HẠCH</div>
            <div style="margin-bottom: 15px; font-size: 1rem; text-align: center;">
                Học viên: <b id="res-name" style="text-transform: uppercase;">---</b><br>
                Ngày sinh: <b id="res-dob">---</b>
            </div>
            <div class="score-circle">
                <span id="res-score">0</span>
                <small style="font-size: 0.7rem; color: #666;">/ 30 câu</small>
            </div>
            <div id="res-badge" class="status-badge">---</div>
            <p style="margin-top: 15px; color: #666; font-size: 0.8rem;">Hệ thống tự đóng sau <span id="countdown">15</span> giây...</p>
        </div>
    </div>

<script>
    const BASE_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ5lCh3QtnrFIoESKHLxtDu2ohCjYsW2tRxPGAWHRk-gr4sT6fobkth6egnRaCGGpKzQniO0e5L76CJ/pub?output=csv&gid=";
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwX2B9egviODNnN4J8ym9oDQDgdZkjs1IMqz3Z5ZR2BCFoOHtLTeO_WLLcjdCFdTx72/exec";
    
    let allQuestions = [], selectedQuestions = [], studentAnswers = [];
    let currentQuestionIndex = 0, timeLeft = 1200, timerInterval, isSubmitted = false, cheatCount = 0;

    function preloadQuestions() {
        const gid = document.getElementById('jobType').value;
        Papa.parse(BASE_CSV_URL + gid, {
            download: true, header: true, skipEmptyLines: true,
            complete: function(results) {
                allQuestions = results.data.filter(i => i.CauHoi).map(i => ({
                    question: i.CauHoi, options: [i.A, i.B, i.C, i.D].filter(o => o),
                    answer: i.DapAnDung ? i.DapAnDung.trim().toUpperCase() : "",
                    explanation: i.Giaithich || "Thực hiện đúng quy trình an toàn.",
                    image: i["HINH ANH"] || "" 
                }));
            }
        });
    }

    async function validateAndStart() {
        const maThi = document.getElementById('maThi').value.trim();
        const name = document.getElementById('studentName').value.trim();
        const dob = document.getElementById('studentDOB').value.trim();
        if(!name || !maThi || !dob) return alert("Vui lòng nhập đầy đủ thông tin!");
        const btn = document.getElementById('btnStart');
        btn.disabled = true; btn.innerText = "ĐANG KIỂM TRA...";
        try {
            const res = await fetch(`${WEB_APP_URL}?action=checkCode&code=${maThi}`);
            const result = await res.json();
            if(result.isValid) startQuiz();
            else { alert("Mã thi không đúng!"); btn.disabled = false; btn.innerText = "VÀO THI NGAY ➔"; }
        } catch(e) { alert("Lỗi kết nối Server!"); btn.disabled = false; btn.innerText = "VÀO THI NGAY ➔"; }
    }

    function startQuiz() {
        if(allQuestions.length === 0) return alert("Vui lòng đợi dữ liệu tải...");
        selectedQuestions = allQuestions.sort(() => 0.5 - Math.random()).slice(0, 30);
        document.getElementById('display-name').innerText = document.getElementById('studentName').value.toUpperCase();
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('progress-container').style.display = 'block';
        document.getElementById('sub-header').style.display = 'flex';
        document.getElementById('quiz-screen').style.display = 'grid';
        document.body.style.paddingTop = '80px';
        showQuestion(0);
        startTimer();
    }

    function showQuestion(idx) {
        currentQuestionIndex = idx;
        const q = selectedQuestions[idx];
        const stored = studentAnswers.find(a => a.qIndex === idx);
        const isPractice = document.getElementById('modeToggle').checked;
        const labels = ['A', 'B', 'C', 'D'];

        // CẬP NHẬT THANH TIẾN TRÌNH
        const percent = Math.round(((studentAnswers.length) / 30) * 100);
        document.getElementById('progress-bar').style.width = percent + '%';
        document.getElementById('progress-bar').innerText = percent + '%';

        let html = `<h3>Câu ${idx + 1}/30: ${q.question}</h3>`;
        if(q.image) html += `<div class="q-image-box"><img src="${q.image}"></div>`;

        q.options.forEach((opt, i) => {
            let cls = "";
            const isSelected = stored && opt === stored.selected;
            if(isPractice && stored) {
                if(labels[i] === q.answer) cls = "correct";
                else if(isSelected) cls = "wrong";
            } else if(isSelected) cls = "selected";
            html += `<div class="option-item ${cls}" onclick="selectAns(${idx}, '${opt.replace(/'/g, "\\'")}')"><b>${labels[i]}.</b>&nbsp;${opt}</div>`;
        });

        if(isPractice && stored) html += `<div style="background:#fff3cd; padding:10px; border-radius:8px; margin-top:10px; font-size:14px;"><b>Giải thích:</b> ${q.explanation}</div>`;
        html += `<div style="display:flex; justify-content:space-between; margin-top:15px; gap:10px;">
                    <button class="btn-start" style="padding:10px; background:var(--btn-blue);" onclick="showQuestion(${idx-1})" ${idx===0?'disabled':''}>Lùi lại</button>
                    ${idx === 29 ? '<button class="btn-start" style="padding:10px; background:var(--caee-blue);" onclick="submitQuiz()">NỘP BÀI</button>' : `<button class="btn-start" style="padding:10px; background:var(--btn-blue);" onclick="showQuestion(${idx+1})">Tiếp theo</button>`}
                 </div>`;
        document.getElementById('quiz-content').innerHTML = html;
        renderGrid();
    }

    function selectAns(qIdx, ans) {
        if(isSubmitted) return;
        const findIndex = studentAnswers.findIndex(a => a.qIndex === qIdx);
        if(findIndex > -1) studentAnswers[findIndex].selected = ans;
        else studentAnswers.push({qIndex: qIdx, selected: ans});
        showQuestion(qIdx);
    }

    function renderGrid() {
        const grid = document.getElementById('nav-grid'); if(!grid) return;
        grid.innerHTML = "";
        selectedQuestions.forEach((_, i) => {
            const hasAns = studentAnswers.some(a => a.qIndex === i);
            const active = i === currentQuestionIndex ? 'border:3px solid var(--btn-orange);' : '';
            const bg = hasAns ? 'background:var(--caee-blue); color:white;' : 'background:white;';
            grid.innerHTML += `<div onclick="showQuestion(${i})" style="height:35px; display:flex; justify-content:center; align-items:center; border-radius:5px; cursor:pointer; font-size:13px; font-weight:bold; ${bg} ${active}">${i+1}</div>`;
        });
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            timeLeft--;
            let m = Math.floor(timeLeft/60), s = timeLeft%60;
            document.getElementById('timer').innerText = `${m}:${s<10?'0':''}${s}`;
            if(timeLeft <= 0) submitQuiz(true);
        }, 1000);
    }

    async function submitQuiz(auto = false) {
        if(!auto && !confirm("Bạn muốn nộp bài?")) return;
        clearInterval(timerInterval); isSubmitted = true;
        const nameValue = String(document.getElementById('studentName').value).toUpperCase().trim();
        const dobValue = String(document.getElementById('studentDOB').value).trim();
        const khoaThiValue = String(document.getElementById('khoaThi').value).trim();
        const rawNghe = document.getElementById('jobType').options[document.getElementById('jobType').selectedIndex].text;
        const modeLabel = document.getElementById('modeToggle').checked ? " (ÔN TẬP)" : " (THI)";
        const ngheValue = rawNghe + modeLabel;
        let score = 0;
        selectedQuestions.forEach((q, i) => {
            const ans = studentAnswers.find(a => a.qIndex === i);
            const labels = ['A','B','C','D'];
            if(ans && labels[q.options.indexOf(ans.selected)] === q.answer) score++;
        });
        const status = score >= 25 ? "ĐẠT" : "KHÔNG ĐẠT";
        document.getElementById('res-name').innerText = nameValue;
        document.getElementById('res-dob').innerText = dobValue;
        document.getElementById('res-score').innerText = score;
        const badge = document.getElementById('res-badge');
        badge.innerText = status; badge.style.backgroundColor = status === "ĐẠT" ? "#28a745" : "#dc3545";
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('progress-container').style.display = 'none';
        document.getElementById('sub-header').style.display = 'none';
        document.getElementById('result-screen').style.display = 'flex';
        const formData = new URLSearchParams();
        formData.append('name', nameValue); formData.append('birthDate', dobValue);
        formData.append('khoaThi', khoaThiValue); formData.append('ngheName', ngheValue);
        formData.append('score', score + "/30"); formData.append('status', status); formData.append('viPham', cheatCount);
        fetch(WEB_APP_URL, { method: "POST", mode: "no-cors", body: formData });
        let c = 15;
        const cdInterval = setInterval(() => { if(c > 0) { c--; document.getElementById('countdown').innerText = c; } else { clearInterval(cdInterval); location.reload(); }}, 1000);
    }
</script>
</body>
</html>
