<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HỆ THỐNG SÁT HẠCH NGHỀ KHOA MÁY - CAEE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            overscroll-behavior: none;
        }

        /* Hiệu ứng nhấp nháy đỏ cho đồng hồ khi sắp hết giờ */
        @keyframes blink-red {
            0%, 100% { background: rgba(255, 255, 255, 0.2); color: #1e293b; }
            50% { background: rgba(239, 68, 68, 0.9); color: white; transform: scale(1.1); }
        }
        .timer-panic { animation: blink-red 0.5s infinite; }

        /* Giao diện Glassmorphism cho đồng hồ */
        .glass-timer {
            position: fixed; top: 20px; right: 20px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px 20px; border-radius: 16px;
            font-weight: 900; z-index: 1000; display: none;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }

        /* Thanh Năng Lượng (Health Bar) */
        .health-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 10px;
            background: #e2e8f0; z-index: 1001;
        }
        #health-bar {
            width: 0%; height: 100%;
            background: linear-gradient(90deg, #22c55e, #10b981);
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.6);
            transition: width 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Tối ưu Chế độ Ngang (Landscape) kiểu tay cầm chơi game */
        @media (orientation: landscape) {
            #quiz-screen { 
                display: grid; 
                grid-template-columns: 1fr 1fr; 
                gap: 24px; 
                padding-top: 60px !important; 
                max-width: 95% !important;
            }
            #quiz-content { height: calc(100vh - 180px); overflow-y: auto; }
            .fixed-nav { padding: 10px 40px !important; }
        }

        .option-item {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid #f1f5f9;
        }
        .option-item:active { transform: scale(0.96); }
        .option-item.selected {
            background-color: #eff6ff;
            border-color: #2563eb;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15);
        }

        #warning-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(15, 23, 42, 0.9); z-index: 9999;
            backdrop-filter: blur(8px);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 select-none" oncontextmenu="return false">

    <audio id="snd-click" src="https://www.soundjay.com/buttons/sounds/button-16.mp3"></audio>
    <audio id="snd-victory" src="https://www.myinstants.com/media/sounds/level-up-pokemon.mp3"></audio>

    <div id="warning-overlay" class="flex flex-col items-center justify-center p-6 text-white">
        <div class="text-6xl mb-4">🚫</div>
        <div class="text-3xl font-black italic">PHÁT HIỆN GIAN LẬN!</div>
        <p class="mt-4 text-slate-400">Vui lòng quay lại màn hình thi ngay lập tức.</p>
    </div>

    <div class="health-container" id="p-container" style="display: none;">
        <div id="health-bar"></div>
    </div>

    <div id="timer" class="glass-timer text-2xl tracking-tighter">20:00</div>

    <div id="start-screen" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-3xl p-8 shadow-2xl border border-slate-100">
            <div class="text-center mb-8">
                <h1 class="text-2xl font-extrabold text-blue-800 tracking-tight">HỆ THỐNG SÁT HẠCH</h1>
                <p class="text-slate-500 font-medium uppercase text-sm mt-1">Khoa Máy Thi Công - CAEE</p>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="text-xs font-bold text-slate-500 ml-1 uppercase">Ngành nghề</label>
                    <select id="jobType" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl font-bold focus:ring-2 focus:ring-blue-500 outline-none appearance-none" onchange="preloadQuestions()">
                        <option value="1538604642">VẬN HÀNH XE NÂNG HÀNG</option>
                        <option value="798209567">VẬN HÀNH CẦN TRỤC</option>
                        <option value="1969781180">VẬN HÀNH CẦU TRỤC</option>
                    </select>
                </div>

                <input type="text" id="studentName" placeholder="HỌ VÀ TÊN HỌC VIÊN" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none uppercase font-semibold">
                <input type="text" id="studentDOB" placeholder="NGÀY SINH (VD: 01/01/2000)" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">

                <div class="flex gap-3">
                    <input type="text" id="khoaThi" value="Tháng 4/2026" class="w-2/3 p-4 bg-slate-100 border border-slate-200 rounded-xl font-bold text-slate-600" readonly>
                    <input type="password" id="maThi" placeholder="MÃ THI" class="w-1/3 p-4 bg-slate-50 border-2 border-blue-200 rounded-xl focus:border-blue-500 outline-none text-center font-bold">
                </div>

                <label class="flex items-center justify-center gap-3 p-3 bg-blue-50 rounded-xl cursor-pointer hover:bg-blue-100 transition">
                    <input type="checkbox" id="modeToggle" class="w-5 h-5 rounded text-blue-600">
                    <span class="font-bold text-blue-800">CHẾ ĐỘ ÔN TẬP</span>
                </label>

                <button onclick="validateAndStart()" id="btnStart" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-extrabold py-5 rounded-2xl shadow-lg shadow-blue-200 transition-all active:scale-95 text-lg uppercase">
                    Bắt đầu làm bài ➔
                </button>
            </div>
        </div>
    </div>

    <div id="quiz-screen" class="hidden max-w-3xl mx-auto p-4 pt-20 pb-32">
        <div id="quiz-content" class="bg-white rounded-[2.5rem] p-8 shadow-xl border border-slate-100 min-h-[400px]">
            </div>
        
        <div class="fixed-nav fixed bottom-0 left-0 w-full bg-white/80 backdrop-blur-xl p-5 border-t border-slate-100 shadow-[0_-15px_30px_rgba(0,0,0,0.05)] z-[2000]">
            <div class="max-w-3xl mx-auto flex items-center justify-between gap-4">
                <button id="prevBtn" onclick="changeQuestion(-1)" class="flex-1 bg-slate-200 text-slate-600 font-black py-5 rounded-2xl active:scale-90 transition uppercase text-xs">Lùi lại</button>
                
                <button id="submitBtn" onclick="submitQuiz()" class="flex-[1.8] bg-blue-700 hover:bg-blue-800 text-white font-black py-5 rounded-3xl shadow-xl shadow-blue-200 active:scale-95 transition text-lg uppercase tracking-wider">Nộp bài</button>
                
                <button id="nextBtn" onclick="changeQuestion(1)" class="flex-1 bg-slate-200 text-slate-600 font-black py-5 rounded-2xl active:scale-90 transition uppercase text-xs">Tiếp theo</button>
            </div>
        </div>
    </div>

    <div id="result-screen" class="hidden fixed inset-0 bg-slate-900 z-[10000] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-[3rem] p-10 text-center shadow-2xl scale-in">
            <div class="text-6xl mb-4" id="res-icon">🏆</div>
            <h2 class="text-sm font-black text-slate-400 uppercase tracking-widest mb-2">Kết quả sát hạch</h2>
            <div id="res-name" class="text-2xl font-black text-slate-900 uppercase mb-6 tracking-tighter">TÊN HỌC VIÊN</div>
            
            <div class="inline-flex items-center justify-center mb-8">
                <div class="w-44 h-44 rounded-full border-[12px] border-slate-50 flex flex-col items-center justify-center bg-slate-50 shadow-inner">
                    <span id="res-score" class="text-7xl font-black text-blue-600 leading-none">0</span>
                    <span class="text-slate-400 font-bold text-xs mt-2 uppercase">/ 30 Câu</span>
                </div>
            </div>

            <div id="res-badge" class="w-full py-4 rounded-2xl text-white font-black text-xl mb-6 shadow-lg uppercase tracking-widest">---</div>
            
            <p class="text-slate-400 text-xs font-medium">Hệ thống tự đóng sau <span id="countdown" class="text-blue-600 font-black">10</span>s...</p>
        </div>
    </div>

<script>
    const BASE_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR7h1KNottkL2N-DEBjkUVVlXLblXy25_x1UhqML8WQz3AWeWeXFuvkSQUb4Sxv5eaK5T-VJQEWh4wB/pub?output=csv&gid=";
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwAtaRA2z11PUj6b24FFBXgGzgFO7GzYfy30v30IyHYoHWbeqexQSh3Y8iGVkkyLliP/exec";
    
    let allQuestions = [], selectedQuestions = [], studentAnswers = [];
    let currentIdx = 0, timeLeft = 1200, timerInterval, isSubmitted = false, cheatCount = 0;

    function playSound(id) {
        const s = document.getElementById(id);
        s.currentTime = 0; s.play().catch(()=>{});
    }

    window.onload = preloadQuestions;

    function preloadQuestions() {
        const gid = document.getElementById('jobType').value;
        Papa.parse(BASE_CSV_URL + gid, {
            download: true, header: true, skipEmptyLines: true,
            complete: function(results) {
                allQuestions = results.data.filter(i => i.CauHoi).map(i => ({
                    question: i.CauHoi,
                    options: [i.A, i.B, i.C, i.D].filter(o => o),
                    answer: i.DapAnDung ? i.DapAnDung.trim().toUpperCase() : "",
                    explanation: i.Giaithich || "Thực hiện đúng quy trình an toàn.",
                    image: i["HINH ANH"] || "" 
                }));
            }
        });
    }

    window.onblur = () => { if(!isSubmitted && selectedQuestions.length > 0) { cheatCount++; document.getElementById('warning-overlay').style.display = 'flex'; } };
    window.onfocus = () => { document.getElementById('warning-overlay').style.display = 'none'; };

    async function validateAndStart() {
        const maThi = document.getElementById('maThi').value.trim();
        const name = document.getElementById('studentName').value.trim();
        const dob = document.getElementById('studentDOB').value.trim();
        if(!name || !maThi || !dob) return alert("Vui lòng nhập đủ thông tin!");

        const btn = document.getElementById('btnStart');
        btn.disabled = true; btn.innerText = "ĐANG XÁC MINH...";

        try {
            const res = await fetch(`${WEB_APP_URL}?action=checkCode&code=${maThi}`);
            const result = await res.json();
            if(result.isValid) startQuiz();
            else { alert("Mã thi không chính xác!"); btn.disabled = false; btn.innerText = "Bắt đầu làm bài ➔"; }
        } catch(e) { startQuiz(); } // Bypass nếu server lỗi
    }

    function startQuiz() {
        selectedQuestions = allQuestions.sort(() => 0.5 - Math.random()).slice(0, 30);
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        document.getElementById('timer').style.display = 'block';
        document.getElementById('p-container').style.display = 'block';
        showQuestion(0);
        startTimer();
    }

    function showQuestion(idx) {
        currentIdx = idx;
        const q = selectedQuestions[idx];
        const stored = studentAnswers.find(a => a.qIndex === idx);
        const isPractice = document.getElementById('modeToggle').checked;
        const labels = ['A', 'B', 'C', 'D'];

        let html = `<div class="flex items-center gap-3 mb-6">
                        <span class="bg-blue-700 text-white px-4 py-1.5 rounded-xl font-black italic text-sm tracking-widest uppercase">Câu ${idx + 1}</span>
                    </div>
                    <h3 class="text-xl font-bold leading-tight mb-8 text-slate-800">${q.question}</h3>`;
        
        if(q.image) html += `<div class="mb-8 overflow-hidden rounded-3xl border border-slate-100 shadow-sm"><img src="${q.image}" class="w-full object-cover"></div>`;

        q.options.forEach((opt, i) => {
            let cls = "";
            const isSelected = stored && opt === stored.selected;
            if(isPractice && stored) {
                if(labels[i] === q.answer) cls = "correct bg-green-50 border-green-500 text-green-700";
                else if(isSelected) cls = "wrong bg-red-50 border-red-500 text-red-700";
            } else if(isSelected) cls = "selected";

            html += `<div class="option-item flex items-center p-5 mb-4 rounded-[1.25rem] cursor-pointer font-bold ${cls}" onclick="selectAns(${idx}, '${opt.replace(/'/g, "\\'")}')">
                        <span class="w-10 h-10 flex items-center justify-center bg-slate-100 rounded-xl mr-4 text-slate-400 font-black">${labels[i]}</span>
                        <div class="flex-1">${opt}</div>
                     </div>`;
        });

        if(isPractice && stored) html += `<div class="mt-6 p-5 bg-blue-50 rounded-[1.25rem] text-sm font-bold text-blue-700 italic border-l-8 border-blue-600">💡 Giải thích: ${q.explanation}</div>`;

        document.getElementById('quiz-content').innerHTML = html;
        document.getElementById('prevBtn').style.opacity = idx === 0 ? "0.3" : "1";
        document.getElementById('nextBtn').style.opacity = idx === 29 ? "0.3" : "1";
        updateHealthBar();
    }

    function selectAns(qIdx, ans) {
        if(isSubmitted) return;
        playSound('snd-click');
        const i = studentAnswers.findIndex(a => a.qIndex === qIdx);
        if(i > -1) studentAnswers[i].selected = ans;
        else studentAnswers.push({qIndex: qIdx, selected: ans});
        showQuestion(qIdx);
    }

    function changeQuestion(step) {
        let n = currentIdx + step;
        if(n >= 0 && n < 30) showQuestion(n);
    }

    function updateHealthBar() {
        const percent = (studentAnswers.length / 30) * 100;
        const bar = document.getElementById('health-bar');
        bar.style.width = percent + "%";
        // Đổi màu rực rỡ hơn khi gần hoàn thành
        if(percent > 80) bar.style.background = "linear-gradient(90deg, #3b82f6, #2563eb)";
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            timeLeft--;
            let m = Math.floor(timeLeft/60), s = timeLeft%60;
            const timerEl = document.getElementById('timer');
            timerEl.innerText = `${m}:${s<10?'0':''}${s}`;
            
            if(timeLeft < 60) timerEl.classList.add('timer-panic');
            if(timeLeft <= 0) submitQuiz(true);
        }, 1000);
    }

    async function submitQuiz(auto = false) {
        if(isSubmitted) return;
        if(!auto && !confirm("BẠN CÓ CHẮC CHẮN MUỐN NỘP BÀI KHÔNG?")) return;
        
        isSubmitted = true; 
        clearInterval(timerInterval);
        playSound('snd-victory');

        let score = 0;
        selectedQuestions.forEach((q, i) => {
            const ans = studentAnswers.find(a => a.qIndex === i);
            if(ans && ['A','B','C','D'][q.options.indexOf(ans.selected)] === q.answer) score++;
        });

        const status = score >= 25 ? "ĐẠT" : "KHÔNG ĐẠT";
        document.getElementById('res-name').innerText = document.getElementById('studentName').value.toUpperCase();
        document.getElementById('res-score').innerText = score;
        document.getElementById('res-badge').innerText = status;
        document.getElementById('res-badge').style.backgroundColor = score >= 25 ? "#059669" : "#dc2626";
        document.getElementById('res-icon').innerText = score >= 25 ? "🏆" : "💀";
        
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('timer').style.display = 'none';
        document.getElementById('result-screen').classList.remove('hidden');

        // Gửi dữ liệu
        const formData = new URLSearchParams();
        formData.append('name', document.getElementById('studentName').value);
        formData.append('score', score);
        formData.append('status', status);
        formData.append('cheat', cheatCount);
        fetch(WEB_APP_URL, { method: "POST", mode: "no-cors", body: formData });

        let c = 10;
        const countInt = setInterval(() => { 
            c--; 
            document.getElementById('countdown').innerText = c; 
            if(c<=0) { clearInterval(countInt); location.reload(); } 
        }, 1000);
    }
</script>
</body>
</html>
