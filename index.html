<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HỆ THỐNG SÁT HẠCH NGHỀ - CAEE</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            --caee-blue: #003399; --header-blue: #0040cc;
            --btn-orange: #ff6600; --btn-blue: #3366ff;
            --success: #28a745; --danger: #dc3545;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body { 
            background: linear-gradient(rgba(0, 51, 153, 0.2), rgba(0, 51, 153, 0.2)), 
                        url('https://lh3.googleusercontent.com/d/1vN_N165O9F7R93V2N8Z_7K0v0M4v0G1M'); /* Ảnh xưởng sắc nét */
            background-size: cover; background-attachment: fixed; background-position: center;
            font-family: 'Segoe UI', Arial, sans-serif; padding-top: 130px; min-height: 100vh;
        }

        /* HEADER THÔNG MINH - TỰ ĐỘNG THU PHÓNG */
        .caee-header {
            background: var(--header-blue); color: white; padding: 8px 12px;
            display: none; flex-direction: column;
            position: fixed; top: 0; width: 100%; z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        /* Khi cuộn xuống, header thu nhỏ lại */
        .header-scrolled { padding: 4px 12px; opacity: 0.95; }
        .header-scrolled .school-name { font-size: 10px !important; }

        .school-name { font-weight: bold; font-size: 13px; text-transform: uppercase; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 4px; margin-bottom: 4px; }
        .user-info-row { display: flex; justify-content: space-between; align-items: center; font-size: 11px; }

        .timer-box { background: #ff3333; padding: 4px 10px; border-radius: 6px; font-weight: bold; font-size: 14px; }

        /* NỘI DUNG CHÍNH - HIỆU ỨNG KÍNH MỜ */
        .welcome-container, #quiz-content, .result-card { 
            background: rgba(255, 255, 255, 0.96) !important; 
            backdrop-filter: blur(15px); border-radius: 15px; padding: 15px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.2) !important;
            width: 96%; max-width: 600px; margin: auto;
        }

        #quiz-content { max-width: 800px; width: 96%; }

        .progress-container { width: 100%; background: #ddd; height: 6px; border-radius: 10px; margin: 8px 0; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--success); width: 0%; transition: 0.3s; }

        .ai-box { width: 100%; border-radius: 10px; overflow: hidden; aspect-ratio: 16/9; margin-bottom: 12px; border: 2px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }

        /* CÂU HỎI & ĐÁP ÁN - CHỮ NHỎ PHÙ HỢP MOBILE */
        h3.question-text { font-size: 1rem; color: #111; line-height: 1.4; margin-bottom: 12px; }
        
        .option-item {
            border: 1.5px solid #eee; border-radius: 10px; padding: 10px; margin-bottom: 8px;
            cursor: pointer; background: #fdfdfd; display: flex; align-items: center; font-size: 0.85rem; line-height: 1.3;
            transition: 0.2s;
        }
        .option-item.selected { background: #eef5ff; border-color: var(--btn-blue); color: var(--caee-blue); font-weight: 600; }
        
        /* Giải thích đáp án */
        .explanation-box { 
            background: #e8f5e9; border-left: 4px solid var(--success); 
            padding: 10px; margin-top: 10px; border-radius: 4px; font-size: 0.8rem; color: #2e7d32; font-style: italic;
        }

        .btn-start { 
            background: var(--success); color: white; border: none; width: 100%; padding: 12px; 
            border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1rem;
        }

        /* ẨN SƠ ĐỒ CÂU HỎI TRÊN MOBILE */
        @media (max-width: 850px) {
            body { padding-top: 110px; }
            #quiz-screen { display: block !important; padding: 10px; }
            .sidebar-right { display: none; } /* ẨN LƯỚI CÂU HỎI THEO YÊU CẦU */
            #question-layout { display: flex !important; flex-direction: column !important; }
            .ai-side { order: -1; margin-bottom: 10px; }
            .option-item { padding: 12px; } /* Tăng diện tích bấm trên mobile */
        }

        #warning-overlay {
            display: none; position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(220, 53, 69, 0.95); color: white; z-index: 9999;
            justify-content: center; align-items: center; text-align: center; font-size: 1.2rem; padding: 20px;
        }
    </style>
</head>
<body oncontextmenu="return false">

    <div id="warning-overlay">⚠️ CẢNH BÁO!<br>Vui lòng không rời khỏi màn hình thi.</div>

    <div class="caee-header" id="caee-header">
        <div class="school-name">Trường Cao đẳng Cơ điện Nông nghiệp và Môi trường</div>
        <div class="user-info-row">
            <div style="flex: 1;">
                <div id="job-display-header" style="color: #ffd700; font-weight: bold;">...</div>
                <div>HV: <span id="display-name" style="font-weight: bold;">---</span> | NS: <span id="display-dob">---</span></div>
            </div>
            <div id="timer" class="timer-box">20:00</div>
        </div>
    </div>

    <div id="start-screen">
        <div class="welcome-container">
            <h2 style="text-align:center; color:var(--caee-blue); margin-bottom: 15px; font-size: 1.3rem;">HỆ THỐNG SÁT HẠCH</h2>
            <select id="jobType" class="form-control" style="width:100%; padding:12px; border-radius:8px; margin-bottom:10px; font-weight:bold;">
                <option value="1538604642">VẬN HÀNH XE NÂNG HÀNG</option>
                <option value="798209567">VẬN HÀNH CẦN TRỤC</option>
                <option value="1969781180">VẬN HÀNH CẦU TRỤC</option>
            </select>
            <input type="text" id="studentName" placeholder="HỌ VÀ TÊN HỌC VIÊN" class="form-control" style="width:100%; padding:12px; margin-bottom:10px; border-radius:8px; text-transform: uppercase;">
            <input type="text" id="studentDOB" placeholder="Ngày/tháng/năm sinh (VD: 20/05/1995)" class="form-control" style="width:100%; padding:12px; margin-bottom:10px; border-radius:8px;">
            <input type="password" id="maThi" placeholder="Mã dự thi" class="form-control" style="width:100%; padding:12px; margin-bottom:15px; border-radius:8px; border: 2px solid var(--btn-orange);">
            
            <div style="display:flex; align-items:center; margin-bottom: 15px; justify-content: center; gap:8px;">
                <input type="checkbox" id="modeToggle" style="width:18px; height:18px;">
                <label for="modeToggle" style="font-weight: 600; font-size: 0.9rem;">Chế độ Ôn tập (Hiện giải thích)</label>
            </div>

            <button class="btn-start" onclick="validateAndStart()">BẮT ĐẦU SÁT HẠCH ➔</button>
        </div>
    </div>

    <div id="quiz-screen">
        <div id="quiz-content"></div>
    </div>

    <div id="result-screen" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:2000; justify-content:center; align-items:center;">
        <div class="result-card" style="text-align:center;">
            <h2 style="color: var(--caee-blue);">KẾT QUẢ THI</h2>
            <div id="res-name" style="font-weight:bold; margin: 15px 0; font-size: 1.1rem;">---</div>
            <div style="font-size: 3.5rem; font-weight: 800; color: var(--header-blue);" id="res-score">0</div>
            <div id="res-badge" style="font-size: 1.2rem; font-weight: bold; margin-bottom: 20px;">---</div>
            <button class="btn-start" onclick="location.reload()">THOÁT HỆ THỐNG</button>
        </div>
    </div>

<script>
    // Theo dõi cuộn chuột để thu nhỏ header
    window.onscroll = function() {
        const header = document.getElementById("caee-header");
        if (document.body.scrollTop > 50 || document.documentElement.scrollTop > 50) {
            header.classList.add("header-scrolled");
        } else {
            header.classList.remove("header-scrolled");
        }
    };

    const BASE_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR7h1KNottkL2N-DEBjkUVVlXLblXy25_x1UhqML8WQz3AWeWeXFuvkSQUb4Sxv5eaK5T-VJQEWh4wB/pub?output=csv&gid=";
    let allQuestions = [], selectedQuestions = [], studentAnswers = [];
    let currentQuestionIndex = 0, timeLeft = 1200, timerInterval;

    window.onload = preloadQuestions;
    function preloadQuestions() {
        const gid = document.getElementById('jobType').value;
        Papa.parse(BASE_CSV_URL + gid, {
            download: true, header: true, skipEmptyLines: true,
            complete: function(results) {
                allQuestions = results.data.filter(i => i.CauHoi).map(i => ({
                    question: i.CauHoi,
                    options: [i.A, i.B, i.C, i.D].filter(o => o),
                    answer: i.DapAnDung ? i.DapAnDung.trim().toUpperCase() : "",
                    explanation: i.Giaithich || "Thực hiện đúng quy tắc an toàn vận hành thiết bị nâng.",
                    image: i["HINH ANH"] || ""
                }));
            }
        });
    }

    function validateAndStart() {
        const name = document.getElementById('studentName').value.trim();
        const dob = document.getElementById('studentDOB').value.trim();
        const code = document.getElementById('maThi').value.trim();
        if(!name || !dob || !code) return alert("Vui lòng điền đủ Họ tên, Ngày sinh và Mã thi!");
        
        document.getElementById('display-name').innerText = name.toUpperCase();
        document.getElementById('display-dob').innerText = dob;
        document.getElementById('job-display-header').innerText = document.getElementById('jobType').options[document.getElementById('jobType').selectedIndex].text;
        
        startQuiz();
    }

    function startQuiz() {
        selectedQuestions = allQuestions.sort(() => 0.5 - Math.random()).slice(0, 30);
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('caee-header').style.display = 'flex';
        document.getElementById('quiz-screen').style.display = 'block';
        showQuestion(0);
        startTimer();
    }

    function showQuestion(idx) {
        currentQuestionIndex = idx;
        const q = selectedQuestions[idx];
        const isPractice = document.getElementById('modeToggle').checked;
        const stored = studentAnswers.find(a => a.qIndex === idx);
        const labels = ['A', 'B', 'C', 'D'];

        let html = `
            <div class="progress-container"><div class="progress-bar" style="width: ${((idx+1)/30)*100}%"></div></div>
            <div id="question-layout">
                <div class="ai-side">
                    <div class="ai-box">
                        <img src="${q.image || 'https://via.placeholder.com/400x225?text=CAEE'}" style="width:100%; height:100%; object-fit:contain; background:#f0f0f0;">
                    </div>
                </div>
                <div>
                    <h3 class="question-text">Câu ${idx + 1}: ${q.question}</h3>
                    <div id="options-list">`;

        q.options.forEach((opt, i) => {
            let cls = (stored && opt === stored.selected) ? "selected" : "";
            html += `<div class="option-item ${cls}" onclick="selectAns(${idx}, '${opt.replace(/'/g, "\\'")}')">
                        <b style="margin-right:8px; color:var(--caee-blue)">${labels[i]}.</b> ${opt}
                     </div>`;
        });

        if(isPractice && stored) {
            html += `<div class="explanation-box"><b>💡 Giải thích:</b> ${q.explanation}</div>`;
        }

        html += `</div></div></div>
            <div style="display:flex; justify-content:space-between; margin-top:20px; gap:10px;">
                <button class="btn-start" style="background:#6c757d; flex:1;" onclick="showQuestion(${idx-1})" ${idx===0?'disabled':''}>◀ TRƯỚC</button>
                ${idx === 29 ? 
                    `<button class="btn-start" style="background:var(--caee-blue); flex:1;" onclick="submitQuiz()">NỘP BÀI ✔</button>` : 
                    `<button class="btn-start" style="background:var(--btn-blue); flex:1;" onclick="showQuestion(${idx+1})">TIẾP THEO ▶</button>`}
            </div>`;
        
        document.getElementById('quiz-content').innerHTML = html;
        window.scrollTo(0,0);
    }

    function selectAns(qIdx, ans) {
        const i = studentAnswers.findIndex(a => a.qIndex === qIdx);
        if(i > -1) studentAnswers[i].selected = ans;
        else studentAnswers.push({qIndex: qIdx, selected: ans});
        showQuestion(qIdx);
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            timeLeft--;
            let m = Math.floor(timeLeft/60), s = timeLeft%60;
            document.getElementById('timer').innerText = `${m}:${s<10?'0':''}${s}`;
            if(timeLeft <= 0) submitQuiz(true);
        }, 1000);
    }

    function submitQuiz(auto = false) {
        if(!auto && !confirm("Bạn có chắc chắn muốn nộp bài?")) return;
        clearInterval(timerInterval);
        let score = 0;
        selectedQuestions.forEach((q, i) => {
            const ans = studentAnswers.find(a => a.qIndex === i);
            if(ans && ['A','B','C','D'][q.options.indexOf(ans.selected)] === q.answer) score++;
        });
        document.getElementById('res-name').innerText = document.getElementById('studentName').value.toUpperCase();
        document.getElementById('res-score').innerText = score + "/30";
        document.getElementById('res-badge').innerText = score >= 25 ? "KẾT QUẢ: ĐẠT ✅" : "KẾT QUẢ: KHÔNG ĐẠT ❌";
        document.getElementById('res-badge').style.color = score >= 25 ? "var(--success)" : "var(--danger)";
        document.getElementById('result-screen').style.display = 'flex';
    }
</script>
</body>
</html>
