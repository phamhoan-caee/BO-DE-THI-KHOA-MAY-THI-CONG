<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>SÁT HẠCH KHOA MÁY THI CÔNG - CAEE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        /* Hiệu ứng bo góc và đổ bóng */
        .rounded-super { border-radius: 24px; }
        .rounded-medium { border-radius: 16px; }

        /* Đồng hồ trong suốt cố định */
        .glass-timer {
            background: rgba(220, 38, 38, 0.2);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #dc2626;
        }

        /* Hiệu ứng đáp án phát sáng */
        .option-card {
            transition: all 0.2s ease;
            border-width: 2px;
        }
        .option-card.selected { 
            border-color: #2563eb; 
            background-color: #eff6ff;
            box-shadow: 0 0 15px rgba(37, 99, 235, 0.3);
            transform: scale(1.01);
        }
        .option-card.correct { 
            border-color: #16a34a; 
            background-color: #f0fdf4; 
            box-shadow: 0 0 15px rgba(22, 163, 74, 0.3);
        }
        .option-card.wrong { 
            border-color: #dc2626; 
            background-color: #fef2f2; 
        }

        /* Ẩn sơ đồ câu hỏi trên mobile */
        @media (max-width: 1024px) {
            .mobile-hide { display: none !important; }
            .question-text { font-size: 1.1rem; }
            .option-text { font-size: 0.95rem; }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-10" oncontextmenu="return false">

    <div id="warning-overlay" class="hidden fixed inset-0 bg-red-600/90 z-[9999] flex flex-col items-center justify-center text-white text-center p-6">
        <i class="fas fa-exclamation-triangle text-6xl mb-4 animate-bounce"></i>
        <h1 class="text-3xl font-bold uppercase">Phát hiện gian lận!</h1>
        <p class="text-xl">Vui lòng quay lại màn hình thi.</p>
    </div>

    <header id="caee-header" class="hidden fixed top-0 w-full bg-white/80 backdrop-blur-md border-b border-gray-100 z-50">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex flex-col">
                <span id="job-display-header" class="text-xs md:text-sm font-black text-blue-700 uppercase leading-none">VẬN HÀNH XE NÂNG</span>
                <span class="text-[10px] text-gray-500 font-bold mt-1 uppercase tracking-tighter">HV: <span id="display-name" class="text-blue-500">---</span></span>
            </div>
            <div id="timer" class="glass-timer px-4 py-1.5 rounded-full font-mono text-lg font-black tracking-tighter">20:00</div>
        </div>
    </header>

    <div id="start-screen" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-super shadow-2xl p-8 border border-gray-50">
            <div class="text-center mb-8">
                <div class="bg-blue-50 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-id-card text-3xl text-blue-600"></i>
                </div>
                <h2 class="text-xl font-black text-gray-800 uppercase">Thông tin học viên</h2>
            </div>

            <div class="space-y-4">
                <select id="jobType" class="w-full p-4 rounded-2xl bg-slate-50 border-none ring-1 ring-gray-200 focus:ring-2 focus:ring-blue-500 outline-none font-bold text-gray-700" onchange="preloadQuestions()">
                    <option value="1538604642">VẬN HÀNH XE NÂNG HÀNG</option>
                    <option value="798209567">VẬN HÀNH CẦN TRỤC</option>
                    <option value="1969781180">VẬN HÀNH CẦU TRỤC</option>
                </select>
                
                <input type="text" id="studentName" placeholder="HỌ VÀ TÊN" class="w-full p-4 rounded-2xl bg-slate-50 border-none ring-1 ring-gray-200 focus:ring-2 focus:ring-blue-500 outline-none uppercase font-bold text-blue-600">
                <input type="text" id="studentDOB" placeholder="Ngày tháng năm sinh" class="w-full p-4 rounded-2xl bg-slate-50 border-none ring-1 ring-gray-200 focus:ring-2 focus:ring-blue-500 outline-none">

                <div class="flex gap-2">
                    <input type="text" id="khoaThi" value="Tháng 4/2026" class="w-2/3 p-4 rounded-2xl bg-gray-100 font-bold text-gray-500" readonly>
                    <input type="password" id="maThi" placeholder="Mã thi" class="w-1/3 p-4 rounded-2xl bg-slate-50 border-none ring-1 ring-gray-200 focus:ring-2 focus:ring-blue-500 outline-none text-center font-bold">
                </div>

                <button id="btnStart" onclick="validateAndStart()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-4 rounded-2xl shadow-lg shadow-blue-200 transition-all active:scale-95">
                    BẮT ĐẦU SÁT HẠCH
                </button>
            </div>
        </div>
    </div>

    <div id="quiz-screen" class="hidden container mx-auto px-4 pt-20 pb-10 max-w-5xl">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2">
                <div id="quiz-content" class="bg-white rounded-super shadow-sm p-5 md:p-8 border border-gray-100">
                    </div>
            </div>

            <div class="lg:col-span-1 mobile-hide">
                <div class="bg-white rounded-super shadow-sm p-6 border border-gray-100 sticky top-24">
                    <h4 class="font-bold text-gray-400 mb-4 text-center text-xs uppercase tracking-widest">Sơ đồ câu hỏi</h4>
                    <div id="nav-grid" class="grid grid-cols-5 gap-2"></div>
                    <button onclick="submitQuiz()" class="w-full mt-6 bg-red-500 hover:bg-red-600 text-white font-black py-4 rounded-2xl transition-all">
                        NỘP BÀI THI
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="result-screen" class="hidden fixed inset-0 z-[10000] bg-white flex items-center justify-center p-4">
        <div class="w-full max-w-md text-center">
            <div id="res-icon" class="w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-6"></div>
            <h2 class="text-3xl font-black text-gray-900 mb-2" id="res-badge">---</h2>
            <p class="text-gray-500 font-medium mb-8">Học viên: <span id="res-name" class="text-blue-600"></span></p>
            
            <div class="bg-slate-50 rounded-super p-8 mb-8 border border-gray-100">
                <span class="text-gray-400 font-bold text-xs uppercase tracking-widest block mb-2">Điểm số của bạn</span>
                <div class="text-6xl font-black text-slate-800"><span id="res-score">0</span><span class="text-xl text-gray-400">/30</span></div>
            </div>

            <p class="text-[10px] text-gray-400 uppercase font-bold">Hệ thống sẽ tự động đặt lại sau <span id="countdown">10</span>s</p>
        </div>
    </div>

<script>
    // Các biến và URL giữ nguyên từ bản gốc của bạn
    const BASE_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR7h1KNottkL2N-DEBjkUVVlXLblXy25_x1UhqML8WQz3AWeWeXFuvkSQUb4Sxv5eaK5T-VJQEWh4wB/pub?output=csv&gid=";
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxztBfYM7PDwyicHFOSZr73Q5Yo5i2Zc2MxyexPrMp23nOoaF4yE1ECbTT2-hjaVVW6/exec";
    
    let allQuestions = [], selectedQuestions = [], studentAnswers = [];
    let currentQuestionIndex = 0, timeLeft = 1200, timerInterval, isSubmitted = false, cheatCount = 0;

    window.onload = preloadQuestions;

    function preloadQuestions() {
        const gid = document.getElementById('jobType').value;
        Papa.parse(BASE_CSV_URL + gid, {
            download: true, header: true, skipEmptyLines: true,
            complete: function(results) {
                allQuestions = results.data.filter(i => i.CauHoi).map(i => ({
                    question: i.CauHoi,
                    options: [i.A, i.B, i.C, i.D].filter(o => o),
                    answer: i.DapAnDung ? i.DapAnDung.trim().toUpperCase() : "",
                    explanation: i.Giaithich || "Thực hiện đúng quy trình an toàn kỹ thuật.",
                    image: i["HINH ANH"] || "" 
                }));
            }
        });
    }

    async function validateAndStart() {
        const maThi = document.getElementById('maThi').value.trim();
        const name = document.getElementById('studentName').value.trim();
        const dob = document.getElementById('studentDOB').value.trim();
        if(!name || !maThi || !dob) return alert("Vui lòng nhập đầy đủ thông tin!");

        const btn = document.getElementById('btnStart');
        btn.disabled = true;
        btn.innerHTML = `<i class="fas fa-spinner animate-spin"></i>`;

        try {
            const res = await fetch(`${WEB_APP_URL}?action=checkCode&code=${maThi}`);
            const result = await res.json();
            if(result.isValid) startQuiz();
            else { alert("Mã thi không đúng!"); btn.disabled = false; btn.innerText="BẮT ĐẦU SÁT HẠCH"; }
        } catch(e) { startQuiz(); } // Dự phòng nếu lỗi server
    }

    function startQuiz() {
        selectedQuestions = allQuestions.sort(() => 0.5 - Math.random()).slice(0, 30);
        document.getElementById('display-name').innerText = document.getElementById('studentName').value.toUpperCase();
        document.getElementById('job-display-header').innerText = document.getElementById('jobType').options[document.getElementById('jobType').selectedIndex].text;
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('caee-header').classList.remove('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        showQuestion(0);
        startTimer();
    }

    function showQuestion(idx) {
        currentQuestionIndex = idx;
        const q = selectedQuestions[idx];
        const stored = studentAnswers.find(a => a.qIndex === idx);
        const labels = ['A', 'B', 'C', 'D'];

        let html = `
            <div class="flex justify-between items-center mb-4">
                <span class="text-[10px] font-black text-blue-600 bg-blue-50 px-3 py-1 rounded-full uppercase tracking-widest">Câu ${idx + 1} / 30</span>
                ${idx === 29 ? `<button onclick="submitQuiz()" class="text-xs font-bold text-red-500 lg:hidden uppercase">Nộp bài</button>` : ''}
            </div>
            <h3 class="question-text font-bold text-gray-800 leading-snug mb-6">${q.question}</h3>
        `;

        if(q.image) {
            html += `<div class="mb-6 rounded-2xl overflow-hidden bg-slate-50 flex justify-center border border-gray-100">
                        <img src="${q.image}" class="max-h-48 object-contain">
                    </div>`;
        }

        html += `<div class="space-y-4">`; // Tăng khoảng cách giữa các đáp án
        q.options.forEach((opt, i) => {
            const isSelected = stored && opt === stored.selected;
            let cls = isSelected ? "selected" : "";

            html += `
                <button class="option-card w-full text-left p-4 rounded-2xl border-2 border-gray-100 flex items-center group ${cls}" 
                        onclick="selectAns(${idx}, '${opt.replace(/'/g, "\\'")}')">
                    <span class="w-10 h-10 shrink-0 flex items-center justify-center rounded-xl bg-slate-100 group-hover:bg-blue-600 group-hover:text-white mr-4 font-black transition-colors">${labels[i]}</span>
                    <span class="option-text font-semibold text-gray-700">${opt}</span>
                </button>
            `;
        });
        html += `</div>`;

        html += `
            <div class="flex justify-between gap-4 mt-8">
                <button class="flex-1 py-4 rounded-2xl bg-slate-100 text-gray-500 font-black text-sm uppercase disabled:opacity-20" 
                        onclick="showQuestion(${idx-1})" ${idx===0?'disabled':''}>Trở lại</button>
                <button class="flex-1 py-4 rounded-2xl bg-blue-600 text-white font-black text-sm uppercase shadow-lg shadow-blue-100" 
                        onclick="showQuestion(${idx+1})" ${idx===29?'disabled':''}>Tiếp theo</button>
            </div>
        `;
        document.getElementById('quiz-content').innerHTML = html;
        renderGrid();
    }

    function selectAns(qIdx, ans) {
        const i = studentAnswers.findIndex(a => a.qIndex === qIdx);
        if(i > -1) studentAnswers[i].selected = ans;
        else studentAnswers.push({qIndex: qIdx, selected: ans});
        showQuestion(qIdx);
    }

    function renderGrid() {
        const grid = document.getElementById('nav-grid');
        grid.innerHTML = "";
        selectedQuestions.forEach((_, i) => {
            const hasAns = studentAnswers.some(a => a.qIndex === i);
            const active = i === currentQuestionIndex ? 'ring-2 ring-blue-600 ring-offset-2' : '';
            const bg = hasAns ? 'bg-blue-600 text-white' : 'bg-slate-100 text-gray-400';
            grid.innerHTML += `<div onclick="showQuestion(${i})" class="h-10 flex justify-center items-center rounded-xl cursor-pointer font-black text-xs ${bg} ${active}">${i+1}</div>`;
        });
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            timeLeft--;
            let m = Math.floor(timeLeft/60), s = timeLeft%60;
            document.getElementById('timer').innerText = `${m}:${s<10?'0':''}${s}`;
            if(timeLeft <= 0) submitQuiz(true);
        }, 1000);
    }

    async function submitQuiz(auto = false) {
        if(!auto && !confirm("Nộp bài thi ngay?")) return;
        isSubmitted = true; clearInterval(timerInterval);

        let score = 0;
        selectedQuestions.forEach((q, i) => {
            const ans = studentAnswers.find(a => a.qIndex === i);
            if(ans && ['A','B','C','D'][q.options.indexOf(ans.selected)] === q.answer) score++;
        });

        const pass = score >= 25;
        document.getElementById('res-name').innerText = document.getElementById('studentName').value.toUpperCase();
        document.getElementById('res-score').innerText = score;
        document.getElementById('res-badge').innerText = pass ? "THI ĐẠT" : "KHÔNG ĐẠT";
        document.getElementById('res-badge').className = `text-3xl font-black mb-2 ${pass ? "text-green-600" : "text-red-600"}`;
        document.getElementById('res-icon').innerHTML = pass ? `<i class="fas fa-check-circle text-7xl text-green-500"></i>` : `<i class="fas fa-times-circle text-7xl text-red-500"></i>`;
        
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('caee-header').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');

        let c = 10;
        setInterval(() => { c--; document.getElementById('countdown').innerText = c; if(c<=0) location.reload(); }, 1000);
    }
</script>
</body>
</html>
