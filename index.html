<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>SÁT HẠCH KHOA MÁY THI CÔNG - CAEE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        .rounded-super { border-radius: 24px; }
        
        .glass-timer {
            background: rgba(220, 38, 38, 0.2);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #dc2626;
        }

        .option-card { transition: all 0.2s ease; border-width: 2px; }
        .option-card.selected { 
            border-color: #2563eb; 
            background-color: #eff6ff;
            box-shadow: 0 0 15px rgba(37, 99, 235, 0.3);
        }

        /* Tối ưu hóa cực hạn cho Mobile (iPhone X/11/12/13/14...) */
        @media (max-width: 768px) {
            .mobile-hide { display: none !important; }
            #quiz-screen { padding-top: 4.5rem !important; }
            #quiz-content { padding: 1rem !important; border-radius: 20px; }
            
            .question-text { 
                font-size: 1rem !important; 
                line-height: 1.25 !important;
                margin-bottom: 0.75rem !important; 
            }
            
            .option-card { 
                padding: 0.6rem 0.75rem !important; 
                margin-bottom: 0.5rem !important; 
                border-radius: 14px !important;
            }

            .option-card span:first-child {
                width: 1.75rem !important;
                height: 1.75rem !important;
                font-size: 0.8rem !important;
                margin-right: 0.75rem !important;
                border-radius: 8px !important;
            }

            .option-text { font-size: 0.85rem !important; line-height: 1.2 !important; }

            #quiz-content img {
                max-height: 120px !important; /* Giới hạn chiều cao ảnh */
                margin-bottom: 0.75rem !important;
            }

            /* Tránh thanh gạt iPhone X */
            .action-buttons {
                margin-top: 1rem !important;
                padding-bottom: env(safe-area-inset-bottom, 1.5rem) !important;
            }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen" oncontextmenu="return false">

    <header id="caee-header" class="hidden fixed top-0 w-full bg-white/80 backdrop-blur-md border-b border-gray-100 z-50">
        <div class="container mx-auto px-4 py-2 flex justify-between items-center">
            <div class="flex flex-col">
                <span id="job-display-header" class="text-[10px] md:text-sm font-black text-blue-700 uppercase">VẬN HÀNH</span>
                <span class="text-[9px] text-gray-400 font-bold uppercase tracking-tighter">HV: <span id="display-name" class="text-blue-500">---</span></span>
            </div>
            <div id="timer" class="glass-timer px-3 py-1 rounded-full font-mono text-base font-black">20:00</div>
        </div>
    </header>

    <div id="start-screen" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-super shadow-2xl p-8">
            <div class="text-center mb-6">
                <h2 class="text-xl font-black text-gray-800 uppercase">Thông tin học viên</h2>
            </div>
            <div class="space-y-4">
                <select id="jobType" class="w-full p-4 rounded-2xl bg-slate-50 border-none ring-1 ring-gray-200 outline-none font-bold" onchange="preloadQuestions()">
                    <option value="1538604642">VẬN HÀNH XE NÂNG HÀNG</option>
                    <option value="798209567">VẬN HÀNH CẦN TRỤC</option>
                    <option value="1969781180">VẬN HÀNH CẦU TRỤC</option>
                </select>
                <input type="text" id="studentName" placeholder="HỌ VÀ TÊN" class="w-full p-4 rounded-2xl bg-slate-50 ring-1 ring-gray-200 outline-none uppercase font-bold text-blue-600">
                <input type="text" id="studentDOB" placeholder="Ngày tháng năm sinh" class="w-full p-4 rounded-2xl bg-slate-50 ring-1 ring-gray-200 outline-none">
                <div class="flex gap-2">
                    <input type="text" id="khoaThi" value="Tháng 4/2026" class="w-2/3 p-4 rounded-2xl bg-gray-100 font-bold text-gray-500" readonly>
                    <input type="password" id="maThi" placeholder="Mã thi" class="w-1/3 p-4 rounded-2xl bg-slate-50 ring-1 ring-gray-200 outline-none text-center font-bold">
                </div>
                <button id="btnStart" onclick="validateAndStart()" class="w-full bg-blue-600 text-white font-black py-4 rounded-2xl active:scale-95 transition-all">BẮT ĐẦU SÁT HẠCH</button>
            </div>
        </div>
    </div>

    <div id="quiz-screen" class="hidden container mx-auto px-4 pt-20 pb-10 max-w-5xl">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2">
                <div id="quiz-content" class="bg-white rounded-super shadow-sm p-8 border border-gray-100"></div>
            </div>
            <div class="lg:col-span-1 mobile-hide">
                <div class="bg-white rounded-super shadow-sm p-6 border border-gray-100 sticky top-24">
                    <div id="nav-grid" class="grid grid-cols-5 gap-2"></div>
                    <button onclick="submitQuiz()" class="w-full mt-6 bg-red-500 text-white font-black py-4 rounded-2xl">NỘP BÀI THI</button>
                </div>
            </div>
        </div>
    </div>

    <div id="result-screen" class="hidden fixed inset-0 z-[10000] bg-white flex items-center justify-center p-4 text-center">
        <div class="w-full max-w-md">
            <div id="res-icon" class="mb-4 text-7xl"></div>
            <h2 class="text-2xl font-black mb-2" id="res-badge"></h2>
            <div class="bg-slate-50 rounded-super p-8 mb-6 border">
                <span class="text-xs font-bold text-gray-400 block mb-1">ĐIỂM SỐ</span>
                <div class="text-6xl font-black text-slate-800"><span id="res-score">0</span><span class="text-xl text-gray-400">/30</span></div>
            </div>
            <p class="text-[10px] text-gray-400 font-bold uppercase">Tự động đặt lại sau <span id="countdown">10</span>s</p>
        </div>
    </div>

<script>
    // GIỮ NGUYÊN PHẦN LOGIC (BASE_CSV_URL, preloadQuestions, validateAndStart, startQuiz, selectAns, renderGrid, startTimer, submitQuiz)
    const BASE_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR7h1KNottkL2N-DEBjkUVVlXLblXy25_x1UhqML8WQz3AWeWeXFuvkSQUb4Sxv5eaK5T-VJQEWh4wB/pub?output=csv&gid=";
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzPhnxAoPaqoinK034RXEZBfX07rUs4y2obJFT3kPXUCxY_QG9yhB3ndDs18Yv1UAJA/exec";
    
    let allQuestions = [], selectedQuestions = [], studentAnswers = [];
    let currentQuestionIndex = 0, timeLeft = 1200, timerInterval, isSubmitted = false;

    window.onload = preloadQuestions;

    function preloadQuestions() {
        const gid = document.getElementById('jobType').value;
        Papa.parse(BASE_CSV_URL + gid, {
            download: true, header: true, skipEmptyLines: true,
            complete: function(results) {
                allQuestions = results.data.filter(i => i.CauHoi).map(i => ({
                    question: i.CauHoi,
                    options: [i.A, i.B, i.C, i.D].filter(o => o),
                    answer: i.DapAnDung ? i.DapAnDung.trim().toUpperCase() : "",
                    image: i["HINH ANH"] || "" 
                }));
            }
        });
    }

    async function validateAndStart() {
        const name = document.getElementById('studentName').value.trim();
        const maThi = document.getElementById('maThi').value.trim();
        if(!name || !maThi) return alert("Vui lòng nhập thông tin!");
        startQuiz();
    }

    function startQuiz() {
        selectedQuestions = allQuestions.sort(() => 0.5 - Math.random()).slice(0, 30);
        document.getElementById('display-name').innerText = document.getElementById('studentName').value.toUpperCase();
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('caee-header').classList.remove('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        showQuestion(0);
        startTimer();
    }

    // HÀM SHOW QUESTION ĐÃ TINH CHỈNH ĐỂ TIẾT KIỆM KHÔNG GIAN
    function showQuestion(idx) {
        currentQuestionIndex = idx;
        const q = selectedQuestions[idx];
        const stored = studentAnswers.find(a => a.qIndex === idx);
        const labels = ['A', 'B', 'C', 'D'];

        let html = `
            <div class="flex justify-between items-center mb-2">
                <span class="text-[10px] font-black text-blue-600 bg-blue-50 px-2 py-0.5 rounded-full uppercase tracking-tighter">Câu ${idx + 1} / 30</span>
                ${idx === 29 ? `<button onclick="submitQuiz()" class="text-[10px] font-black text-red-500 uppercase">Nộp bài</button>` : ''}
            </div>
            <h3 class="question-text font-bold text-gray-800 leading-tight mb-3">${q.question}</h3>
        `;

        if(q.image) {
            html += `<div class="mb-3 rounded-xl overflow-hidden bg-slate-50 flex justify-center border border-gray-100">
                        <img src="${q.image}" class="max-height-mobile object-contain">
                    </div>`;
        }

        html += `<div class="options-container">`;
        q.options.forEach((opt, i) => {
            const isSelected = stored && opt === stored.selected;
            let cls = isSelected ? "selected" : "";

            html += `
                <button class="option-card w-full text-left rounded-2xl border-2 border-gray-100 flex items-center group ${cls}" 
                        onclick="selectAns(${idx}, '${opt.replace(/'/g, "\\'")}')">
                    <span class="shrink-0 flex items-center justify-center rounded-lg bg-slate-100 group-hover:bg-blue-600 group-hover:text-white font-black transition-colors">${labels[i]}</span>
                    <span class="option-text font-semibold text-gray-700">${opt}</span>
                </button>
            `;
        });
        html += `</div>`;

        html += `
            <div class="flex justify-between gap-3 action-buttons mt-3">
                <button class="flex-1 py-3 rounded-xl bg-slate-100 text-gray-500 font-black text-xs uppercase disabled:opacity-20" 
                        onclick="showQuestion(${idx-1})" ${idx===0?'disabled':''}>Trở lại</button>
                <button class="flex-1 py-3 rounded-xl bg-blue-600 text-white font-black text-xs uppercase shadow-md" 
                        onclick="showQuestion(${idx+1})" ${idx===29?'disabled':''}>Tiếp theo</button>
            </div>
        `;
        document.getElementById('quiz-content').innerHTML = html;
        renderGrid();
    }

    function selectAns(qIdx, ans) {
        const i = studentAnswers.findIndex(a => a.qIndex === qIdx);
        if(i > -1) studentAnswers[i].selected = ans;
        else studentAnswers.push({qIndex: qIdx, selected: ans});
        showQuestion(qIdx);
    }

    function renderGrid() {
        const grid = document.getElementById('nav-grid');
        if(!grid) return;
        grid.innerHTML = "";
        selectedQuestions.forEach((_, i) => {
            const hasAns = studentAnswers.some(a => a.qIndex === i);
            const active = i === currentQuestionIndex ? 'ring-2 ring-blue-600 ring-offset-2' : '';
            const bg = hasAns ? 'bg-blue-600 text-white' : 'bg-slate-100 text-gray-400';
            grid.innerHTML += `<div onclick="showQuestion(${i})" class="h-10 flex justify-center items-center rounded-xl cursor-pointer font-black text-xs ${bg} ${active}">${i+1}</div>`;
        });
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            timeLeft--;
            let m = Math.floor(timeLeft/60), s = timeLeft%60;
            document.getElementById('timer').innerText = `${m}:${s<10?'0':''}${s}`;
            if(timeLeft <= 0) submitQuiz(true);
        }, 1000);
    }

    function submitQuiz(auto = false) {
        if(!auto && !confirm("Nộp bài thi ngay?")) return;
        isSubmitted = true; clearInterval(timerInterval);
        let score = 0;
        selectedQuestions.forEach((q, i) => {
            const ans = studentAnswers.find(a => a.qIndex === i);
            if(ans && ['A','B','C','D'][q.options.indexOf(ans.selected)] === q.answer) score++;
        });
        const pass = score >= 25;
        document.getElementById('res-score').innerText = score;
        document.getElementById('res-badge').innerText = pass ? "THI ĐẠT" : "KHÔNG ĐẠT";
        document.getElementById('res-badge').className = `text-2xl font-black mb-2 ${pass ? "text-green-600" : "text-red-600"}`;
        document.getElementById('res-icon').innerHTML = pass ? "✅" : "❌";
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('caee-header').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        let c = 10;
        setInterval(() => { c--; document.getElementById('countdown').innerText = c; if(c<=0) location.reload(); }, 1000);
    }
</script>
</body>
</html>
