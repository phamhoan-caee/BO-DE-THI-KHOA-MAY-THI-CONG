<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SÁT HẠCH LÝ THUYẾT - CAEE</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            --caee-blue: #003399;
            --btn-blue: #3366ff;
            --success: #28a745;
            --danger: #dc3545;
            --light-bg: #f4f7f9;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background-color: var(--light-bg); font-family: 'Segoe UI', Arial, sans-serif; height: 100vh; overflow: hidden; }

        /* THANH TIẾN TRÌNH SÁT MÉP TRÊN */
        .progress-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 6px;
            background: #e0e0e0; z-index: 1000; display: none;
        }
        #progress-bar { height: 100%; width: 0%; background: var(--success); transition: width 0.4s ease; }

        /* ĐỒNG HỒ TRONG SUỐT GÓC TRÁI */
        .timer-glass {
            position: fixed; top: 20px; left: 20px; 
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 18px;
            border-radius: 30px;
            color: #333;
            font-family: 'Courier New', Courier, monospace;
            font-weight: 900;
            font-size: 1.4rem;
            z-index: 1001;
            display: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .timer-low { color: var(--danger); animation: blink 1s infinite; border-color: var(--danger); }
        @keyframes blink { 50% { opacity: 0.5; } }

        /* MÀN HÌNH CHÀO */
        #start-screen { height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .welcome-card { background: white; width: 100%; max-width: 450px; border-radius: 20px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; }
        .form-control { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 10px; font-size: 1rem; }
        .btn-start { background: var(--success); color: white; border: none; width: 100%; padding: 15px; border-radius: 12px; font-weight: bold; font-size: 1.1rem; cursor: pointer; }

        /* KHU VỰC THI */
        #quiz-screen { display: none; height: 100vh; padding: 40px 20px 100px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #quiz-content { 
            background: white; border-radius: 25px; padding: 30px; 
            width: 100%; max-width: 700px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.06);
            overflow-y: auto; max-height: 80vh;
        }

        .q-title { font-size: 1.2rem; color: var(--caee-blue); margin-bottom: 25px; font-weight: 700; line-height: 1.6; }
        
        /* CÂU TRẢ LỜI & HIỆU ỨNG PHÁT SÁNG */
        .option-item {
            border: 2px solid #f0f2f5; border-radius: 15px; padding: 18px; margin-bottom: 12px;
            cursor: pointer; transition: 0.3s; font-weight: 500; display: flex; align-items: center;
            background: #fff; font-size: 1rem;
        }
        .option-item.selected { 
            border-color: var(--btn-blue); 
            background: #f0f5ff; 
            box-shadow: 0 0 15px rgba(51, 102, 255, 0.3); /* Phát sáng */
            transform: translateY(-2px);
        }

        /* FOOTER NÚT BẤM */
        .quiz-footer {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 90px;
            background: white; display: none; align-items: center; justify-content: center;
            padding: 0 20px; border-top: 1px solid #eee; gap: 15px; z-index: 1001;
        }
        .nav-btn {
            height: 55px; border-radius: 15px; border: none; color: white; font-weight: 800;
            font-size: 1rem; cursor: pointer; transition: 0.2s; text-transform: uppercase;
        }
        .btn-prev, .btn-next { background: var(--btn-blue); flex: 1; max-width: 150px; }
        .btn-submit { background: var(--danger); flex: 1.2; max-width: 200px; box-shadow: 0 4px 15px rgba(220, 53, 69, 0.2); }

        /* HÌNH ẢNH CÂU HỎI */
        .q-image-box img { max-width: 100%; border-radius: 15px; margin-bottom: 20px; display: block; margin-left: auto; margin-right: auto; }

        /* MÀN HÌNH KẾT QUẢ */
        #result-screen { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: var(--light-bg); z-index: 10000; justify-content: center; align-items: center; padding: 20px; }
        .result-card { background: white; width: 100%; max-width: 450px; border-radius: 25px; padding: 30px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <div class="progress-container" id="prog-cont">
        <div id="progress-bar"></div>
    </div>

    <div id="timer-display" class="timer-glass">20:00</div>

    <div id="start-screen">
        <div class="welcome-card">
            <h2 style="color:var(--caee-blue); margin-bottom: 20px;">HỆ THỐNG SÁT HẠCH</h2>
            <select id="jobType" class="form-control" onchange="preloadQuestions()">
                <option value="1538604642">VẬN HÀNH XE NÂNG HÀNG</option>
                <option value="798209567">VẬN HÀNH CẦN TRỤC</option>
                <option value="1969781180">VẬN HÀNH CẦU TRỤC</option>
            </select>
            <input type="text" id="studentName" placeholder="HỌ VÀ TÊN" class="form-control" style="text-transform: uppercase;">
            <input type="text" id="studentDOB" placeholder="NGÀY SINH (VD: 01/01/2000)" class="form-control">
            <input type="password" id="maThi" placeholder="MÃ DỰ THI" class="form-control">
            <button class="btn-start" onclick="validateAndStart()">VÀO THI NGAY</button>
        </div>
    </div>

    <div id="quiz-screen">
        <div id="quiz-content"></div>
    </div>

    <div class="quiz-footer" id="quiz-footer">
        <button class="nav-btn btn-prev" onclick="changeQuestion(-1)">LÙI LẠI</button>
        <button class="nav-btn btn-submit" onclick="submitQuiz()">NỘP BÀI</button>
        <button class="nav-btn btn-next" onclick="changeQuestion(1)">TIẾP THEO</button>
    </div>

    <div id="result-screen">
        <div class="result-card">
            <div class="result-header">KẾT QUẢ BÀI THI</div>
            <div style="margin-bottom: 20px; font-size: 1.1rem; line-height: 1.6; text-align: centered;">
                Học viên: <b id="res-name" style="color: var(--caee-blue); text-transform: uppercase;">---</b><br>
                Ngày sinh: <b id="res-dob">---</b><br>
                Khóa thi: <b id="res-id">---</b>
            </div>
            <div class="score-circle">
                <span id="res-score">0</span>
                <small style="font-size: 0.8rem; color: #666; font-weight: normal;">/ 30 câu</small>
            </div>
            <div id="res-badge" class="status-badge">---</div>
            <div class="notice-text">
                KẾT QUẢ NÀY ĐƯỢC NHÀ TRƯỜNG LƯU LẠI VÀ DÙNG ĐỂ XÉT CẤP CHỨNG CHỈ SƠ CẤP NGHỀ.
            </div>
            <p style="margin-top: 25px; color: #666; font-size: 0.85rem;">Hệ thống tự đóng sau <span id="countdown">10</span> giây...</p>
        </div>
    </div>

<script>
    const BASE_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRs5CSEsuNg_OtjJbzTmAxQ__5EyVZFe7axrAa1KW9bTAM6dSRNclBRdz1zKXUOZpmfVvQRwU5RRuiN/pub?output=csv&gid=";
    let allQuestions = [], selectedQuestions = [], studentAnswers = [];
    let currentQuestionIndex = 0, timeLeft = 1200, timerInterval;

    window.onload = preloadQuestions;

    function preloadQuestions() {
        const gid = document.getElementById('jobType').value;
        Papa.parse(BASE_CSV_URL + gid, {
            download: true, header: true, skipEmptyLines: true,
            complete: function(results) {
                allQuestions = results.data.filter(i => i.CauHoi).map(i => ({
                    question: i.CauHoi,
                    options: [i.A, i.B, i.C, i.D].filter(o => o),
                    answer: i.DapAnDung ? i.DapAnDung.trim().toUpperCase() : "",
                    image: i["HINH ANH"] || ""
                }));
            }
        });
    }

    function validateAndStart() {
        if(!document.getElementById('studentName').value || !document.getElementById('maThi').value) {
            return alert("Vui lòng điền đầy đủ thông tin!");
        }
        
        selectedQuestions = allQuestions.sort(() => 0.5 - Math.random()).slice(0, 30);
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('prog-cont').style.display = 'block';
        document.getElementById('timer-display').style.display = 'block';
        document.getElementById('quiz-screen').style.display = 'flex';
        document.getElementById('quiz-footer').style.display = 'flex';
        
        startTimer();
        showQuestion(0);
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            timeLeft--;
            let m = Math.floor(timeLeft / 60);
            let s = timeLeft % 60;
            const display = document.getElementById('timer-display');
            display.innerText = `${m}:${s < 10 ? '0' : ''}${s}`;

            if(timeLeft < 120) display.classList.add('timer-low'); // Cảnh báo còn 2 phút
            if(timeLeft <= 0) submitQuiz(true);
        }, 1000);
    }

    function showQuestion(idx) {
        currentQuestionIndex = idx;
        const q = selectedQuestions[idx];
        const stored = studentAnswers.find(a => a.qIndex === idx);
        
        // Cập nhật thanh tiến trình
        document.getElementById('progress-bar').style.width = ((studentAnswers.length / 30) * 100) + "%";

        let html = `<div class="q-title">Câu ${idx + 1}: ${q.question}</div>`;
        if(q.image) html += `<div class="q-image-box"><img src="${q.image}"></div>`;

        q.options.forEach((opt, i) => {
            const labels = ['A', 'B', 'C', 'D'];
            const isSelected = (stored && opt === stored.selected);
            html += `<div class="option-item ${isSelected ? 'selected' : ''}" onclick="selectAns(${idx}, '${opt.replace(/'/g, "\\'")}')">
                        <b style="margin-right:15px; color:var(--caee-blue)">${labels[i]}.</b> ${opt}
                     </div>`;
        });
        document.getElementById('quiz-content').innerHTML = html;
        document.getElementById('quiz-content').scrollTop = 0;
    }

    function selectAns(qIdx, ans) {
        const i = studentAnswers.findIndex(a => a.qIndex === qIdx);
        if(i > -1) studentAnswers[i].selected = ans;
        else studentAnswers.push({qIndex: qIdx, selected: ans});
        showQuestion(qIdx);
    }

    function changeQuestion(dir) {
        let n = currentQuestionIndex + dir;
        if(n >= 0 && n < 30) showQuestion(n);
    }

    function submitQuiz(auto = false) {
        if(!auto && !confirm("Bạn có chắc chắn muốn nộp bài?")) return;
        
        clearInterval(timerInterval);
        let score = 0;
        selectedQuestions.forEach((q, i) => {
            const ans = studentAnswers.find(a => a.qIndex === i);
            if(ans) {
                const label = ['A','B','C','D'][q.options.indexOf(ans.selected)];
                if(label === q.answer) score++;
            }
        });

        document.getElementById('res-name').innerText = document.getElementById('studentName').value.toUpperCase();
        document.getElementById('res-score').innerText = score;
        const badge = document.getElementById('res-badge');
        badge.innerText = score >= 25 ? "ĐẠT (PASSED)" : "KHÔNG ĐẠT (FAILED)";
        badge.style.backgroundColor = score >= 25 ? "#28a745" : "#dc3545";

        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('quiz-footer').style.display = 'none';
        document.getElementById('prog-cont').style.display = 'none';
        document.getElementById('timer-display').style.display = 'none';
        document.getElementById('result-screen').style.display = 'flex';

        setTimeout(() => location.reload(), 10000);
    }
</script>
</body>
</html>
