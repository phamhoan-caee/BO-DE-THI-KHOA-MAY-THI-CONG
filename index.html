<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HỆ THỐNG SÁT HẠCH CAEE</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            --caee-blue: #003399; --header-blue: #0040cc;
            --btn-orange: #ff6600; --btn-blue: #3366ff;
            --success: #28a745; --danger: #dc3545;
            --light-bg: #f0f2f5;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background-color: var(--light-bg); font-family: 'Segoe UI', Arial, sans-serif; overflow-x: hidden; }

        /* 1. HEADER VÀ HIỆU ỨNG ẨN */
        .caee-header {
            background: var(--header-blue); color: white; padding: 10px 20px;
            display: none; justify-content: space-between; align-items: center;
            position: fixed; top: 0; width: 100%; z-index: 1000;
            transition: transform 0.8s ease-in-out; /* Trượt mượt mà */
        }
        .header-hidden { transform: translateY(-100%); }

        /* 2. ĐỒNG HỒ TIẾT KIỆM DIỆN TÍCH - KÍNH MỜ */
        .timer-box {
            position: fixed; top: 15px; right: 15px; z-index: 1001;
            background: rgba(255, 255, 255, 0.15); 
            backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #d32f2f; padding: 5px 15px; border-radius: 50px;
            font-weight: bold; font-size: 1.1rem; min-width: 80px; text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* GIAO DIỆN CHÍNH */
        #start-screen { min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .welcome-container { background: white; width: 100%; max-width: 450px; border-radius: 15px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .form-control { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; }
        
        #quiz-screen { padding: 20px; display: none; grid-template-columns: 1fr 300px; gap: 20px; max-width: 1200px; margin: auto; padding-top: 70px; }
        #quiz-content { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }

        .option-item { border: 2px solid #eee; border-radius: 8px; padding: 12px; margin-bottom: 10px; cursor: pointer; display: flex; align-items: center; }
        .option-item.selected { background: #e7f0ff; border-color: var(--btn-blue); color: var(--caee-blue); }

        /* 3. CỤM 3 NÚT ĐIỀU HƯỚNG CÂN ĐỐI 30% - 30% - 30% */
        .nav-button-group {
            display: flex; justify-content: center; gap: 5%; margin-top: 25px;
        }
        .btn-nav {
            width: 30%; padding: 12px 5px; border: none; border-radius: 8px;
            font-weight: bold; color: white; cursor: pointer; font-size: 0.9rem;
            transition: opacity 0.2s;
        }
        .btn-lùi { background-color: #6c757d; }
        .btn-nộp { background-color: var(--caee-blue); }
        .btn-tiếp { background-color: var(--btn-blue); }
        .btn-nav:disabled { background-color: #ccc; cursor: not-allowed; }

        .sidebar-right { background: white; padding: 15px; border-radius: 12px; height: fit-content; }
        #nav-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
        
        #result-screen { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: #f0f2f5; z-index: 9999; justify-content: center; align-items: center; }
    </style>
</head>
<body>

    <div class="caee-header" id="caee-header">
        <div style="flex:1; text-align:center;">
            <div style="font-weight: bold; font-size: 13px;">TRƯỜNG CAO ĐẲNG CƠ ĐIỆN NÔNG NGHIỆP VÀ MÔI TRƯỜNG</div>
            <div id="job-display-header" style="color: #ffd700; font-size: 13px;">ĐANG TẢI...</div>
        </div>
    </div>

    <div id="timer" class="timer-box" style="display:none;">20:00</div>

    <div id="start-screen">
        <div class="welcome-container">
            <h3 style="text-align:center; color: var(--caee-blue);">THÔNG TIN THÍ SINH</h3>
            <select id="jobType" class="form-control" onchange="preloadQuestions()">
                <option value="1538604642">VẬN HÀNH XE NÂNG HÀNG</option>
                <option value="798209567">VẬN HÀNH CẦN TRỤC</option>
                <option value="1969781180">VẬN HÀNH CẦU TRỤC</option>
            </select>
            <input type="text" id="studentName" placeholder="HỌ TÊN HỌC VIÊN" class="form-control">
            <input type="text" id="studentDOB" placeholder="NGÀY SINH (DD/MM/YYYY)" class="form-control">
            <input type="password" id="maThi" placeholder="MÃ THI" class="form-control">
            <div style="text-align:center; margin: 10px 0;">
                <input type="checkbox" id="modeToggle"> <label for="modeToggle">Chế độ Ôn tập</label>
            </div>
            <button onclick="startQuiz()" style="width:100%; padding:15px; background:var(--success); color:white; border:none; border-radius:8px; font-weight:bold;">BẮT ĐẦU THI</button>
        </div>
    </div>

    <div id="quiz-screen">
        <div id="quiz-content"></div>
        <div class="sidebar-right">
            <h4 style="text-align:center; margin-bottom:10px;">LƯỚI CÂU HỎI</h4>
            <div id="nav-grid"></div>
        </div>
    </div>

    <div id="result-screen">
        <div style="background:white; padding:40px; border-radius:20px; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,0.1);">
            <h2 id="res-status" style="margin-bottom:20px;">KẾT QUẢ</h2>
            <div style="font-size: 3rem; font-weight: bold; color: var(--caee-blue);">
                <span id="res-score">0</span>/30
            </div>
            <button onclick="location.reload()" style="margin-top:20px; padding:10px 20px;">THOÁT</button>
        </div>
    </div>

<script>
    const BASE_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRs5CSEsuNg_OtjJbzTmAxQ__5EyVZFe7axrAa1KW9bTAM6dSRNclBRdz1zKXUOZpmfVvQRwU5RRuiN/pub?output=csv&gid=";
    let allQuestions = [], selectedQuestions = [], studentAnswers = [];
    let currentIdx = 0, timeLeft = 1200, timerInterval;

    function preloadQuestions() {
        const gid = document.getElementById('jobType').value;
        Papa.parse(BASE_CSV_URL + gid, {
            download: true, header: true, complete: (results) => {
                allQuestions = results.data.filter(i => i.CauHoi).map(i => ({
                    q: i.CauHoi, options: [i.A, i.B, i.C, i.D].filter(o => o),
                    ans: i.DapAnDung.trim().toUpperCase()
                }));
            }
        });
    }
    window.onload = preloadQuestions;

    function startQuiz() {
        if(allQuestions.length === 0) return alert("Đang tải dữ liệu...");
        selectedQuestions = allQuestions.sort(() => 0.5 - Math.random()).slice(0, 30);
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('caee-header').style.display = 'flex';
        document.getElementById('timer').style.display = 'block';
        document.getElementById('quiz-screen').style.display = 'grid';
        document.getElementById('job-display-header').innerText = document.getElementById('jobType').options[document.getElementById('jobType').selectedIndex].text;
        
        showQuestion(0);
        startTimer();

        // HIỆU ỨNG ẨN HEADER SAU 15 GIÂY
        setTimeout(() => {
            document.getElementById('caee-header').classList.add('header-hidden');
        }, 15000);
    }

    function showQuestion(idx) {
        currentIdx = idx;
        const q = selectedQuestions[idx];
        const stored = studentAnswers.find(a => a.idx === idx);
        
        let html = `<h3>Câu ${idx + 1}: ${q.q}</h3><div style="margin-top:20px;">`;
        q.options.forEach((opt, i) => {
            const isSelected = stored && stored.ans === opt;
            html += `<div class="option-item ${isSelected?'selected':''}" onclick="selectAns(${idx},'${opt}')">
                        <b>${String.fromCharCode(65+i)}.</b>&nbsp;${opt}
                     </div>`;
        });
        
        // 3. CỤM NÚT ĐIỀU HƯỚNG CÂN ĐỐI TRONG KHUNG CÂU HỎI
        html += `</div>
            <div class="nav-button-group">
                <button class="btn-nav btn-lùi" onclick="showQuestion(${idx-1})" ${idx===0?'disabled':''}>LÙI LẠI</button>
                <button class="btn-nav btn-nộp" onclick="submitQuiz()">NỘP BÀI</button>
                <button class="btn-nav btn-tiếp" onclick="showQuestion(${idx+1})" ${idx===29?'disabled':''}>TIẾP THEO</button>
            </div>`;
        
        document.getElementById('quiz-content').innerHTML = html;
        renderGrid();
    }

    function selectAns(idx, ans) {
        const existing = studentAnswers.findIndex(a => a.idx === idx);
        if(existing > -1) studentAnswers[existing].ans = ans;
        else studentAnswers.push({idx, ans});
        showQuestion(idx);
    }

    function renderGrid() {
        const grid = document.getElementById('nav-grid');
        grid.innerHTML = "";
        selectedQuestions.forEach((_, i) => {
            const hasAns = studentAnswers.some(a => a.idx === i);
            const active = i === currentIdx ? 'border:2px solid var(--btn-orange);' : '';
            const bg = hasAns ? 'background:var(--caee-blue);color:white;' : 'background:white;';
            grid.innerHTML += `<div onclick="showQuestion(${i})" style="height:35px; display:flex; justify-content:center; align-items:center; border-radius:4px; cursor:pointer; font-weight:bold; font-size:12px; ${bg} ${active}">${i+1}</div>`;
        });
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            timeLeft--;
            let m = Math.floor(timeLeft/60), s = timeLeft%60;
            document.getElementById('timer').innerText = `${m}:${s<10?'0':''}${s}`;
            if(timeLeft <= 0) submitQuiz();
        }, 1000);
    }

    function submitQuiz() {
        if(!confirm("Bạn muốn nộp bài?")) return;
        clearInterval(timerInterval);
        let score = 0;
        selectedQuestions.forEach((q, i) => {
            const ans = studentAnswers.find(a => a.idx === i);
            if(ans && ['A','B','C','D'][q.options.indexOf(ans.ans)] === q.ans) score++;
        });
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('timer').style.display = 'none';
        document.getElementById('caee-header').style.display = 'none';
        document.getElementById('result-screen').style.display = 'flex';
        document.getElementById('res-score').innerText = score;
        document.getElementById('res-status').innerText = score >= 25 ? "ĐẠT" : "KHÔNG ĐẠT";
    }
</script>
</body>
</html>
