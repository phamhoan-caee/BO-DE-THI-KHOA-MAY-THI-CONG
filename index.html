<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SÁT HẠCH NGHỀ CAEE - GAMING LIGHT</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00d2ff;
            --neon-pink: #ff007f;
            --gaming-white: #f8f9fa;
            --text-dark: #1a1f26;
            --panel-shadow: 0 10px 30px rgba(0, 210, 255, 0.2);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        body { 
            background: #eef2f7; 
            color: var(--text-dark); 
            font-family: 'Roboto', sans-serif; 
            overflow: hidden; 
            height: 100vh;
        }

        /* HEADER TỰ ĐỘNG ẨN HIỆN */
        .caee-header {
            background: white;
            padding: 8px 20px; 
            display: none; /* Hiện khi vào thi */
            justify-content: space-between;
            align-items: center; 
            border-bottom: 3px solid var(--neon-blue);
            position: fixed; 
            top: 0; width: 100%; 
            z-index: 1000;
            transition: transform 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .header-hidden { transform: translateY(-100%); }

        .hud-text { font-family: 'Orbitron', sans-serif; font-weight: 700; color: var(--neon-blue); }
        .timer-box { 
            background: var(--text-dark); border-radius: 8px;
            padding: 5px 15px; color: var(--neon-blue); font-family: 'Orbitron';
            box-shadow: 0 0 10px var(--neon-blue);
        }

        /* MÀN HÌNH CHỜ */
        #start-screen { height: 100vh; display: flex; justify-content: center; align-items: center; background: white; }
        .welcome-container { 
            background: white; width: 90%; max-width: 450px; border-radius: 20px; 
            padding: 30px; border: 2px solid var(--neon-blue); box-shadow: var(--panel-shadow);
        }
        .form-control { 
            width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #ddd;
            background: #fff; color: #333; outline: none; font-size: 14px;
        }
        .btn-start { 
            background: linear-gradient(45deg, var(--neon-blue), #0072ff); color: white; border: none;
            width: 100%; padding: 15px; border-radius: 50px; font-weight: bold; cursor: pointer;
            font-family: 'Orbitron', sans-serif; letter-spacing: 1px; transition: 0.3s;
        }

        /* GIAO DIỆN LÀM BÀI */
        #quiz-screen { 
            display: none; height: 100vh; padding: 20px 10px 110px 10px;
            grid-template-columns: 1fr 280px; gap: 15px; max-width: 1400px; margin: auto;
        }

        #quiz-content { 
            background: white; padding: 15px; border-radius: 15px; 
            box-shadow: var(--panel-shadow); overflow-y: auto;
            border-top: 5px solid var(--neon-blue);
        }

        /* TINH CHỈNH CÂU HỎI NHỎ LẠI ĐỂ HIỆN HÌNH ẢNH */
        .q-text { font-size: 1.1rem; font-weight: 700; margin-bottom: 10px; color: #222; }
        .option-item {
            background: #f1f4f8; border: 1px solid #e0e6ed; border-radius: 10px;
            padding: 12px 15px; margin-bottom: 8px; cursor: pointer; transition: 0.2s;
            font-size: 14px; display: flex; align-items: center;
        }
        .option-item:hover { background: #e7faff; border-color: var(--neon-blue); }
        .option-item.selected { 
            background: #e0fbff; border-color: var(--neon-blue); 
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.3); font-weight: 500;
        }

        /* HÌNH ẢNH VẬN HÀNH */
        .q-image-box img { 
            width: 100%; max-height: 250px; object-fit: contain;
            border-radius: 10px; border: 2px dashed var(--neon-blue); background: #fafafa;
        }

        /* GAMEPAD CONTROLS */
        .game-controls {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 100px;
            background: rgba(255,255,255,0.9); display: flex; justify-content: space-between;
            align-items: center; padding: 0 25px; border-top: 2px solid var(--neon-blue);
            backdrop-filter: blur(10px);
        }
        .btn-nav-game {
            width: 100px; height: 60px; border-radius: 15px; border: none;
            background: var(--text-dark); color: white; font-family: 'Orbitron'; font-weight: bold;
            box-shadow: 0 4px 0 #000; transition: 0.1s;
        }
        .btn-nav-game:active { transform: translateY(4px); box-shadow: none; }
        .btn-nav-game:disabled { opacity: 0.2; }

        /* SƠ ĐỒ CÂU HỎI */
        .sidebar-right { background: white; padding: 15px; border-radius: 15px; box-shadow: var(--panel-shadow); height: fit-content; }
        .grid-item {
            height: 35px; display: flex; justify-content: center; align-items: center;
            border-radius: 6px; cursor: pointer; font-family: 'Orbitron'; font-size: 12px;
            background: #f1f4f8; color: #888; border: 1px solid #ddd;
        }
        .grid-item.answered { background: var(--neon-blue); color: white; border: none; }
        .grid-item.active { outline: 3px solid var(--neon-pink); }

        @media (max-width: 900px) {
            #quiz-screen { grid-template-columns: 1fr; padding-top: 15px; } /* Sát mép để màn hình lớn hơn */
            .sidebar-right { display: none; }
            .q-image-box img { max-height: 180px; }
        }
    </style>
</head>
<body oncontextmenu="return false">

    <div class="caee-header" id="caee-header">
        <div>
            <div class="hud-text" id="job-display-header" style="font-size: 12px;">CAO ĐẲNG CAEE</div>
            <div style="font-size: 11px; color: #666; font-weight: bold;">PILOT: <span id="display-name" style="color: var(--neon-pink);">---</span></div>
        </div>
        <div id="timer" class="timer-box">20:00</div>
    </div>

    <div id="start-screen">
        <div class="welcome-container">
            <h2 class="hud-text" style="text-align:center; color:var(--text-dark); margin-bottom: 20px; font-size: 1.2rem;">LOG-IN TO SYSTEM</h2>
            <select id="jobType" class="form-control" style="font-weight: bold;">
                <option value="1538604642">VẬN HÀNH XE NÂNG HÀNG</option>
                <option value="798209567">VẬN HÀNH CẦN TRỤC</option>
                <option value="1969781180">VẬN HÀNH CẦU TRỤC</option>
            </select>
            <input type="text" id="studentName" placeholder="Họ và tên" class="form-control">
            <input type="text" id="studentDOB" placeholder="Ngày tháng năm sinh" class="form-control">
            <input type="password" id="maThi" placeholder="Mã dự thi" class="form-control">
            <div style="display:flex; align-items:center; margin: 15px 0; gap:8px; font-size: 13px;">
                <input type="checkbox" id="modeToggle" style="width:18px; height:18px;">
                <label for="modeToggle" style="font-weight: bold;">Training Mode (Hiện đáp án)</label>
            </div>
            <button class="btn-start" onclick="startQuiz()">INITIALIZE MISSION</button>
        </div>
    </div>

    <div id="quiz-screen">
        <div id="quiz-content">
            </div>
        <div class="sidebar-right">
            <div id="nav-grid" style="display:grid; grid-template-columns: repeat(5, 1fr); gap:6px;"></div>
            <button class="btn-start" style="margin-top:20px; background: var(--text-dark); font-size: 12px;" onclick="location.reload()">ABORT MISSION</button>
        </div>
    </div>

    <div class="game-controls" id="game-controls" style="display:none;">
        <button class="btn-nav-game" id="btnPrev" onclick="showQuestion(currentQuestionIndex-1)">PREV</button>
        <div style="text-align:center">
            <div id="q-counter" class="hud-text" style="font-size: 18px;">01/30</div>
            <button id="submitBtn" style="background: var(--neon-pink); border:none; color:white; padding:4px 12px; border-radius:4px; font-size:10px; font-weight:bold; margin-top:5px;" onclick="submitQuiz()">NỘP BÀI</button>
        </div>
        <button class="btn-nav-game" id="btnNext" onclick="showQuestion(currentQuestionIndex+1)" style="background: var(--neon-blue);">NEXT</button>
    </div>

    <script>
        let allQuestions = [], selectedQuestions = [], studentAnswers = [];
        let currentQuestionIndex = 0, timeLeft = 1200, timerInterval;
        let lastScrollTop = 0;

        // Logic ẩn hiện Header khi cuộn
        document.getElementById('quiz-content').addEventListener('scroll', function() {
            let st = this.scrollTop;
            let header = document.getElementById('caee-header');
            if (st > lastScrollTop && st > 50) {
                header.classList.add('header-hidden');
            } else {
                header.classList.remove('header-hidden');
            }
            lastScrollTop = st;
        });

        // Tải dữ liệu giả định/CSV (Giữ nguyên logic PapaParse của bạn)
        function startQuiz() {
            const name = document.getElementById('studentName').value;
            if(!name) return alert("Vui lòng nhập tên!");
            
            // Giả lập lấy 30 câu (Bạn hãy kết nối lại với PapaParse như code cũ)
            selectedQuestions = Array.from({length: 30}, (_, i) => ({
                question: `Tình huống vận hành thứ ${i+1}: Bạn cần làm gì để đảm bảo an toàn?`,
                options: ["Dừng máy ngay lập tức", "Tiếp tục vận hành chậm", "Báo cáo người quản lý", "Kiểm tra lại phanh"],
                image: "https://via.placeholder.com/600x300.png?text=Hinh+Anh+Minh+Hoa+Xe+Nang"
            }));

            document.getElementById('display-name').innerText = name.toUpperCase();
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('caee-header').style.display = 'flex';
            document.getElementById('quiz-screen').style.display = 'grid';
            document.getElementById('game-controls').style.display = 'flex';
            
            showQuestion(0);
            startTimer();
        }

        function showQuestion(idx) {
            if(idx < 0 || idx > 29) return;
            currentQuestionIndex = idx;
            const q = selectedQuestions[idx];
            const stored = studentAnswers.find(a => a.qIndex === idx);
            
            document.getElementById('q-counter').innerText = `${idx + 1 < 10 ? '0' : ''}${idx + 1}/30`;
            document.getElementById('btnPrev').disabled = idx === 0;
            document.getElementById('btnNext').disabled = idx === 29;

            let html = `<div class="q-text">Câu ${idx+1}: ${q.question}</div>`;
            if(q.image) html += `<div class="q-image-box" style="margin-bottom:15px;"><img src="${q.image}"></div>`;

            q.options.forEach((opt, i) => {
                let cls = (stored && opt === stored.selected) ? "selected" : "";
                html += `<div class="option-item ${cls}" onclick="selectAns(${idx}, '${opt}')">
                            <b style="color:var(--neon-blue); margin-right:8px;">${String.fromCharCode(65+i)}.</b> ${opt}
                         </div>`;
            });

            document.getElementById('quiz-content').innerHTML = html;
            document.getElementById('quiz-content').scrollTop = 0; // Luôn lên đầu câu mới
            renderGrid();
        }

        function selectAns(qIdx, ans) {
            const i = studentAnswers.findIndex(a => a.qIndex === qIdx);
            if(i > -1) studentAnswers[i].selected = ans;
            else studentAnswers.push({qIndex: qIdx, selected: ans});
            showQuestion(qIdx);
        }

        function renderGrid() {
            const grid = document.getElementById('nav-grid');
            grid.innerHTML = "";
            for(let i=0; i<30; i++) {
                const hasAns = studentAnswers.some(a => a.qIndex === i);
                const active = i === currentQuestionIndex ? 'active' : '';
                const answered = hasAns ? 'answered' : '';
                grid.innerHTML += `<div onclick="showQuestion(${i})" class="grid-item ${active} ${answered}">${i+1}</div>`;
            }
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                let m = Math.floor(timeLeft/60), s = timeLeft%60;
                document.getElementById('timer').innerText = `${m}:${s<10?'0':''}${s}`;
                if(timeLeft <= 0) submitQuiz();
            }, 1000);
        }

        function submitQuiz() {
            alert("Đã ghi nhận kết quả nhiệm vụ!");
            location.reload();
        }
    </script>
</body>
</html>
