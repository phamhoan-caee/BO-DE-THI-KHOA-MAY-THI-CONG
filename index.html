<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SÁT HẠCH LÝ THUYẾT - CAEE</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            --caee-blue: #003399; --btn-blue: #3366ff;
            --success: #28a745; --danger: #dc3545;
            --light-bg: #f4f7f9;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background-color: var(--light-bg); font-family: 'Segoe UI', Arial, sans-serif; height: 100vh; overflow: hidden; }
        .progress-container { position: fixed; top: 0; left: 0; width: 100%; height: 6px; background: #e0e0e0; z-index: 1000; display: none; }
        #progress-bar { height: 100%; width: 0%; background: var(--success); transition: width 0.4s ease; }
        .timer-glass {
            position: fixed; top: 15px; right: 15px; background: rgba(220, 53, 69, 0.9);
            padding: 8px 15px; border-radius: 10px; color: white; font-weight: 900; font-size: 1.2rem; z-index: 1001; display: none;
        }
        #quiz-screen { display: none; height: 100vh; padding: 20px; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 60px; }
        #quiz-content { background: white; border-radius: 20px; padding: 20px; width: 100%; max-width: 700px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); overflow-y: auto; max-height: 70vh; }
        .q-title { font-size: 1.1rem; color: var(--caee-blue); margin-bottom: 20px; font-weight: 700; }
        .option-item { border: 2px solid #f0f2f5; border-radius: 12px; padding: 15px; margin-bottom: 10px; cursor: pointer; transition: 0.2s; background: #fff; }
        .option-item.selected { border-color: var(--btn-blue); background: #f0f5ff; }
        .quiz-footer { position: fixed; bottom: 0; left: 0; width: 100%; height: 80px; background: white; display: none; align-items: center; justify-content: center; border-top: 1px solid #eee; gap: 10px; z-index: 1001; }
        .nav-btn { height: 50px; border-radius: 10px; border: none; color: white; font-weight: 800; cursor: pointer; }
        .btn-prev, .btn-next { background: var(--btn-blue); width: 100px; }
        .btn-submit { background: var(--danger); width: 120px; }
        #result-screen { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: #f0f2f5; z-index: 10000; justify-content: center; align-items: center; padding: 20px; }
        .result-card { background: white; width: 100%; max-width: 400px; border-radius: 25px; padding: 30px; text-align: center; box-shadow: 0 15px 40px rgba(0,0,0,0.1); }
        .res-info-box { background: #f8f9fa; border-radius: 15px; padding: 15px; margin: 20px 0; text-align: left; font-size: 0.9rem; }
        #start-screen { height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; background: linear-gradient(135deg, #003399 0%, #3366ff 100%); }
        .welcome-card { background: white; width: 100%; max-width: 400px; border-radius: 20px; padding: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.2); }
        .form-control { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; }
    </style>
</head>
<body>

    <div class="progress-container" id="prog-cont"><div id="progress-bar"></div></div>
    <div id="timer-display" class="timer-glass">20:00</div>

    <div id="start-screen">
        <div class="welcome-card">
            <h2 style="color:var(--caee-blue); margin-bottom: 5px; font-size: 1.2rem;">TRƯỜNG CAO ĐẲNG CƠ ĐIỆN NÔNG NGHIỆP VÀ MÔI TRƯỜNG</h2>
            <p style="font-weight: bold; margin-bottom: 20px; color: #555;">KHOA MÁY THI CÔNG</p>
            <select id="jobType" class="form-control" onchange="preloadQuestions()">
                <option value="1538604642">VẬN HÀNH XE NÂNG HÀNG</option>
                <option value="798209567">VẬN HÀNH CẦN TRỤC</option>
                <option value="1969781180">VẬN HÀNH CẦU TRỤC</option>
            </select>
            <input type="text" id="studentName" placeholder="HỌ VÀ TÊN" class="form-control" style="text-transform: uppercase;">
            <input type="text" id="studentDOB" placeholder="NGÀY SINH (DD/MM/YYYY)" class="form-control">
            <input type="text" id="khoaThi" value="Tháng 4/2026" class="form-control" readonly style="background:#eee">
            <input type="password" id="maThi" placeholder="MÃ DỰ THI" class="form-control">
            
            <div style="margin: 15px 0; font-size: 0.9rem;">
                <input type="checkbox" id="modeToggle"> <label for="modeToggle">Chế độ Ôn tập (Hiện đáp án)</label>
            </div>

            <button id="btnStart" style="background:var(--success); color:white; border:none; width:100%; padding:15px; border-radius:10px; font-weight:bold; cursor:pointer;" onclick="validateAndStart()">BẮT ĐẦU THI</button>
        </div>
    </div>

    <div id="quiz-screen"><div id="quiz-content"></div></div>

    <div class="quiz-footer" id="quiz-footer">
        <button class="nav-btn btn-prev" onclick="changeQuestion(-1)">LÙI LẠI</button>
        <button class="nav-btn btn-submit" id="btnSubmit" onclick="submitQuiz()">NỘP BÀI</button>
        <button class="nav-btn btn-next" onclick="changeQuestion(1)">TIẾP THEO</button>
    </div>

    <div id="result-screen">
        <div class="result-card">
            <h2 style="color:var(--caee-blue)">KẾT QUẢ</h2>
            <div class="res-info-box" id="res-box">
                </div>
            <div style="font-size: 4rem; font-weight: 900; color: var(--caee-blue);" id="res-score">0</div>
            <p>Câu đúng / 30</p>
            <div id="res-badge" style="margin-top:20px; padding:15px; border-radius:10px; color:white; font-weight:bold;">---</div>
            <p style="margin-top:20px; font-size:0.8rem; color:#aaa;">Hệ thống sẽ tải lại sau <span id="countdown">15</span> giây...</p>
        </div>
    </div>

<script>
    // THAY URL WEB APP CỦA ANH VÀO ĐÂY
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyKyfRNPfQev5N2Vcjgnr5ukeULbQ5Q-vQsWnARGczcU7dFygfIYzeZD4mpXSX3qP4R/exec"; 
    const BASE_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRs5CSEsuNg_OtjJbzTmAxQ__5EyVZFe7axrAa1KW9bTAM6dSRNclBRdz1zKXUOZpmfVvQRwU5RRuiN/pub?output=csv&gid=";
    
    let allQuestions = [], selectedQuestions = [], studentAnswers = [];
    let currentQuestionIndex = 0, timeLeft = 1200, timerInterval;

    window.onload = preloadQuestions;

    function preloadQuestions() {
        const gid = document.getElementById('jobType').value;
        Papa.parse(BASE_CSV_URL + gid, {
            download: true, header: true, skipEmptyLines: true,
            complete: function(results) {
                allQuestions = results.data.filter(i => i.CauHoi).map(i => ({
                    question: i.CauHoi, options: [i.A, i.B, i.C, i.D].filter(o => o),
                    answer: i.DapAnDung ? i.DapAnDung.trim().toUpperCase() : "", image: i["HINH ANH"] || ""
                }));
            }
        });
    }

    async function validateAndStart() {
        const name = document.getElementById('studentName').value.trim();
        const code = document.getElementById('maThi').value.trim();
        const btn = document.getElementById('btnStart');

        if(!name || !code) return alert("Vui lòng nhập đầy đủ thông tin!");

        btn.disabled = true; btn.innerText = "ĐANG KIỂM TRA...";

        try {
            // Sửa lỗi kết nối bằng cách gọi đúng URL tham số
            const resp = await fetch(`${SCRIPT_URL}?action=checkCode&code=${code}`);
            const result = await resp.json();
            
            if (result.isValid) {
                startQuiz();
            } else {
                alert("Mã dự thi không chính xác!");
                btn.disabled = false; btn.innerText = "BẮT ĐẦU THI";
            }
        } catch (e) {
            console.error(e);
            alert("Lỗi kết nối máy chủ! Hãy kiểm tra lại SCRIPT_URL.");
            btn.disabled = false; btn.innerText = "BẮT ĐẦU THI";
        }
    }

    function startQuiz() {
        selectedQuestions = allQuestions.sort(() => 0.5 - Math.random()).slice(0, 30);
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('prog-cont').style.display = 'block';
        document.getElementById('timer-display').style.display = 'block';
        document.getElementById('quiz-screen').style.display = 'flex';
        document.getElementById('quiz-footer').style.display = 'flex';
        
        timerInterval = setInterval(() => {
            timeLeft--;
            let m = Math.floor(timeLeft/60), s = timeLeft%60;
            document.getElementById('timer-display').innerText = `${m}:${s<10?'0':''}${s}`;
            if(timeLeft <= 0) submitQuiz(true);
        }, 1000);
        showQuestion(0);
    }

    function showQuestion(idx) {
        currentQuestionIndex = idx;
        const q = selectedQuestions[idx];
        const stored = studentAnswers.find(a => a.qIndex === idx);
        document.getElementById('progress-bar').style.width = ((studentAnswers.length / 30) * 100) + "%";
        
        let html = `<div class="q-title">Câu ${idx + 1}: ${q.question}</div>`;
        if(q.image) html += `<div style="text-align:center"><img src="${q.image}" style="max-width:100%; border-radius:10px; margin-bottom:15px;"></div>`;
        
        q.options.forEach((opt, i) => {
            const isSel = (stored && opt === stored.selected);
            html += `<div class="option-item ${isSel ? 'selected' : ''}" onclick="selectAns(${idx}, '${opt.replace(/'/g, "\\'")}')">
                        <b>${['A','B','C','D'][i]}.</b> ${opt}
                     </div>`;
        });
        document.getElementById('quiz-content').innerHTML = html;
        document.getElementById('quiz-content').scrollTop = 0;
    }

    function selectAns(qIdx, ans) {
        const i = studentAnswers.findIndex(a => a.qIndex === qIdx);
        if(i > -1) studentAnswers[i].selected = ans;
        else studentAnswers.push({qIndex: qIdx, selected: ans});
        showQuestion(qIdx);
    }

    function changeQuestion(dir) {
        let n = currentQuestionIndex + dir;
        if(n >= 0 && n < 30) showQuestion(n);
    }

    async function submitQuiz(auto = false) {
        if(!auto && !confirm("Bạn có chắc chắn muốn nộp bài?")) return;
        
        clearInterval(timerInterval);
        document.getElementById('btnSubmit').disabled = true;

        let score = 0;
        selectedQuestions.forEach((q, i) => {
            const ans = studentAnswers.find(a => a.qIndex === i);
            if(ans && ['A','B','C','D'][q.options.indexOf(ans.selected)] === q.answer) score++;
        });

        const status = score >= 25 ? "ĐẠT" : "KHÔNG ĐẠT";
        const jobSelect = document.getElementById('jobType');
        const jobName = jobSelect.options[jobSelect.selectedIndex].text; // Sửa lỗi undefined

        // Hiển thị kết quả
        document.getElementById('res-box').innerHTML = `
            <b>Học viên:</b> ${document.getElementById('studentName').value.toUpperCase()}<br>
            <b>Ngày sinh:</b> ${document.getElementById('studentDOB').value}<br>
            <b>Nghề:</b> ${jobName}<br>
            <b>Khóa:</b> ${document.getElementById('khoaThi').value}
        `;
        document.getElementById('res-score').innerText = score;
        const badge = document.getElementById('res-badge');
        badge.innerText = status;
        badge.style.backgroundColor = status === "ĐẠT" ? "#28a745" : "#dc3545";

        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('quiz-footer').style.display = 'none';
        document.getElementById('result-screen').style.display = 'flex';

        // Gửi dữ liệu về Sheets
        const formData = new URLSearchParams();
        formData.append('name', document.getElementById('studentName').value);
        formData.append('birthDate', document.getElementById('studentDOB').value);
        formData.append('khoaThi', document.getElementById('khoaThi').value);
        formData.append('jobName', jobName);
        formData.append('score', score + "/30");
        formData.append('status', status);
        formData.append('mode', document.getElementById('modeToggle').checked ? "ONTAP" : "SATHACH");

        fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", body: formData });

        let c = 15;
        setInterval(() => { 
            if(c > 0) {
                c--; 
                document.getElementById('countdown').innerText = c; 
            } else {
                location.reload();
            }
        }, 1000);
    }
</script>
</body>
</html>
